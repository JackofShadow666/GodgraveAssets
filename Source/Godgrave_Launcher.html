<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#060a0e;
    font-family:'Share Tech Mono',monospace;color:#6ab0d0;
    display:flex;align-items:center;justify-content:center;}

  #screen{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:20px;}

  #status{font-size:12px;letter-spacing:2px;color:#4a7a90;min-height:18px;}
  #err{font-size:11px;color:#ff6060;max-width:320px;line-height:1.6;display:none;}

  #startBtn{
    background:#ff4757;color:#fff;border:none;padding:18px 50px;
    font-size:18px;font-weight:bold;border-radius:30px;font-family:inherit;
    box-shadow:0 5px 15px rgba(255,71,87,0.4);letter-spacing:2px;cursor:pointer;
  }
  #startBtn:active{transform:scale(0.96);}
  #startBtn[disabled]{opacity:0.4;pointer-events:none;}

  /* ── Поворот экрана ──────────────────────────────────────────────────── */
  #rotate-prompt{
    display:none;position:fixed;inset:0;z-index:999;
    background:#060a0e;flex-direction:column;align-items:center;justify-content:center;
    color:#6ab0d0;text-align:center;
  }
  body.is-portrait #rotate-prompt{display:flex;}
  body.is-portrait #screen{visibility:hidden;}
  #rotate-prompt .icon{font-size:56px;margin-bottom:16px;animation:rh 1.6s ease-in-out infinite;}
  @keyframes rh{0%,100%{transform:rotate(0deg);}50%{transform:rotate(90deg);}}
  #rotate-prompt .txt{font-size:13px;letter-spacing:2px;opacity:0.8;}

  .spinner{
    width:28px;height:28px;border:3px solid #1a3a50;border-top-color:#6ab0d0;
    border-radius:50%;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="rotate-prompt">
  <div class="icon">📱</div>
  <div class="txt">ПОВЕРНИТЕ УСТРОЙСТВО<br>ГОРИЗОНТАЛЬНО</div>
</div>

<div id="screen">
  <h1 style="font-size:20px;letter-spacing:4px;color:#7ac8e8;">⚔ GODGRAVE</h1>
  <button id="startBtn">▶ СТАРТ</button>
  <div id="status"></div>
  <div id="err"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// LAUNCHER — скачивает актуальную версию игры с GitHub и запускает её.
// Сам файл игры (Combo.html) можно открывать напрямую для разработки —
// лаунчер не требуется для обычной работы с кодом.
// ════════════════════════════════════════════════════════════════════════════

// Откуда брать актуальный Combo.html. Меняй ветку/путь при необходимости.
const GAME_URL = 'https://raw.githubusercontent.com/JackofShadow666/GodgraveAssets/main/Source/Combo.html';

const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');

// ── Поворот экрана ───────────────────────────────────────────────────────
function applyOrientation(){
  const portrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('is-portrait', portrait);
}
applyOrientation();
window.addEventListener('resize', () => setTimeout(applyOrientation, 150));
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 150));

// ── Fullscreen ───────────────────────────────────────────────────────────
function requestFS(){
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) {
      const p = el.requestFullscreen();
      if (p && p.catch) p.catch(()=>{});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.mozRequestFullScreen) {
      el.mozRequestFullScreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    }
  } catch(e){}
}

// ── Загрузка и запуск игры ──────────────────────────────────────────────
async function loadAndStart(){
  startBtn.disabled = true;
  errEl.style.display = 'none';
  statusEl.innerHTML = '<div class="spinner"></div>';

  requestFS(); // требует жеста пользователя — вызываем сразу в обработчике клика

  try {
    // cache: 'no-store' — всегда тянуть свежую версию, не использовать кэш браузера
    const resp = await fetch(GAME_URL, { cache: 'no-store' });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const html = await resp.text();

    if(!html || html.length < 100 || !/<html/i.test(html)){
      throw new Error('Получен некорректный файл (не HTML)');
    }

    // Полная замена документа содержимым игры.
    // document.write на текущей странице (не в iframe) корректно заменяет
    // весь DOM и заново выполняет все <script> внутри загруженного HTML.
    document.open();
    document.write(html);
    document.close();

  } catch(e){
    statusEl.textContent = '';
    errEl.style.display = 'block';
    errEl.textContent = '⚠ Не удалось загрузить игру: ' + e.message
      + '\\n\\nПроверьте подключение к интернету и повторите попытку.';
    startBtn.disabled = false;
    startBtn.textContent = '🔄 ПОВТОРИТЬ';
  }
}

startBtn.addEventListener('click', loadAndStart);
startBtn.addEventListener('touchend', e => { e.preventDefault(); loadAndStart(); }, {passive:false});
</script>
</body>
</html>
