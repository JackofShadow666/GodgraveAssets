

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title"></title>
<style>
/* ===== ОСНОВНЫЕ СТИЛИ ===== */
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@300;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{background:#080b10;overflow:hidden;font-family:'Share Tech Mono',monospace;color:#c8d8e8;}
canvas{display:block;position:fixed;top:0;left:0;cursor:none;}

/* ===== ПАНЕЛЬ ===== */
#panel{position:fixed;top:0;right:0;width:280px;height:100vh;background:#0a0e14;border-left:1px solid #1a2e44;display:none;flex-direction:column;overflow:hidden;box-shadow:-6px 0 30px rgba(0,0,0,0.7);z-index:2000;}
#panel.open{display:flex;}
#ph{padding:14px 16px 10px;border-bottom:1px solid #1a2e44;flex-shrink:0;}
#ph h2{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:3px;color:#6ab0d0;text-transform:uppercase;}
#ph p{font-size:8px;color:#3a5a70;margin-top:3px;letter-spacing:1px;line-height:1.6;}
#controls{flex:1;overflow-y:auto;padding:10px 12px;scrollbar-width:auto;scrollbar-color:#2c4f78 transparent;}
#controls::-webkit-scrollbar{width:10px;}
#controls::-webkit-scrollbar-thumb{background:#2c4f78;border-radius:8px;border:2px solid #0a0e14;}
#infobar{padding:8px 12px;border-top:1px solid #162030;font-size:8px;color:#304858;line-height:1.9;background:#060a0e;flex-shrink:0;}
.ir{display:flex;justify-content:space-between;}
.iv{color:#5a8898;}

/* ===== СЕКЦИИ ===== */
.sec{margin-bottom:18px;}
.sec-title{font-size:8px;letter-spacing:2px;color:#2a5a70;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #0e2030;}

/* ===== ROW (СЛАЙДЕРЫ/ЧЕКБОКСЫ) ===== */
.row{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;}
.row-head{display:flex;justify-content:space-between;align-items:baseline;}
.row-head label{font-size:8px;color:#4a7090;letter-spacing:0.5px;}
.row-head .val{font-size:9px;color:#6ab0d0;font-weight:bold;}
.row input[type=range]{width:100%;height:3px;cursor:pointer;accent-color:#3a9acc;}
.row input[type=checkbox]{margin-right:4px;}

/* ===== КЛАВИШИ ===== */
.keys{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
.key{background:rgba(15,40,60,0.7);border:1px solid #1e4060;border-radius:2px;padding:3px 7px;font-size:8px;color:#4a7a8a;line-height:1.5;}

/* ===== HUD ===== */
.hud-name { font-size:10px; color:#dff4ff; letter-spacing:1px; font-weight:900; background:rgba(5,15,25,.78); padding:2px 6px; border-radius:3px; text-shadow:0 0 6px #5ab8ff; }
.hud-name-bot { text-shadow:0 0 6px #398cff; }
.hud-wins { font-size:11px; color:#4acc80; letter-spacing:1px; font-weight:bold; }
.hud-wins-bot { font-size:11px; color:#cc4040; letter-spacing:1px; font-weight:bold; }
.hud-status { font-size:9px; color:#ffaa44; }
.hud-phase { font-size:9px; letter-spacing:.5px; }
.hud-buff { font-size:9px; color:#ff4040; margin-top:2px; letter-spacing:1px; }

/* ===== КНОПКИ ===== */
.menu-btn { width:100%; padding:7px 0; border-radius:3px; font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; cursor:pointer; margin-bottom:8px; }
.mb-export { background:#0e2a1e; border:1px solid #1a5a30; color:#3acc70; }
.mb-ai    { background:#1a1a0e; border:1px solid #5a5a1a; color:#cccc40; }
.mb-balls { background:#1a0e0e; border:1px solid #5a1a1a; color:#cc4040; }
.mb-boxes { background:#100e1a; border:1px solid #3a1a5a; color:#9040cc; }
.mb-block { background:#1a1000; border:1px solid #6a4010; color:#cc8020; }
.mb-music { background:#0e1a0e; border:1px solid #2a5a2a; color:#4acc70; }

/* ===== HUD ПОЛОСКИ ===== */
.hp-bar { background:rgba(0,0,0,0.6); border:2px solid #f0f4ff; border-radius:2px; height:11px; margin-bottom:3px; overflow:hidden; box-shadow:0 0 5px rgba(255,255,255,.35); }
.hp-bar .fill { height:100%; background:#2acc50; width:100%; transition:width .08s; }
.stam-bar { background:rgba(0,0,0,0.5); border:1px solid #2a2a10; border-radius:2px; height:7px; margin-bottom:3px; overflow:hidden; }
.stam-bar .fill { height:100%; background:#ccaa20; width:100%; transition:width .08s; }
.rage-bar { background:#1a0808; border:1px solid #5a1010; border-radius:2px; height:5px; margin-bottom:3px; overflow:hidden; }
.rage-bar .fill { height:100%; background:linear-gradient(90deg,#cc2020,#ff5020); width:0%; transition:width .12s; }
.hud-labels { display:flex; margin-top:2px; font-size:7px; color:#3a6080; }
.hud-labels .hp { color:#3a6080; }
.hud-labels .stam { flex:1; text-align:center; color:#8a7020; }
.hud-labels .rage { color:#802020; }

/* ===== ПРОЧЕЕ ===== */
#badge{position:fixed;top:14px;left:14px;background:rgba(8,14,22,0.93);border:1px solid #1a3a54;border-radius:6px;padding:7px 12px;pointer-events:none;z-index:5;}
#badge .bn{font-size:8px;color:#2a5068;letter-spacing:2px;}
#badge .bname{font-size:13px;color:#7ac8e8;font-family:'Oswald',sans-serif;letter-spacing:2px;margin-top:1px;}
#adisplay{display:none !important;}
#dtoggle.on{border-color:#2a7a50;color:#4acc80;}
#hint{position:fixed;bottom:14px;left:14px;font-size:8px;color:#2a4a5a;line-height:1.8;pointer-events:none;}
.root-dot{pointer-events:none;}

/* ===== ОВЕРЛЕИ ===== */
.game-overlay{display:none;position:fixed;inset:0;z-index:5000;background:rgba(5,8,12,0.97);flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:16px 12px 30px;overflow-y:auto;overflow-x:hidden;font-family:'Share Tech Mono',monospace;cursor:default;pointer-events:all;-webkit-user-select:text;user-select:text;box-sizing:border-box;}
@media(min-height:600px){#name-overlay.open{justify-content:center;}}
.game-overlay.open{display:flex;}
body.menu-open canvas,body.menu-open #hud,body.menu-open #pvp-hud,body.menu-open #badge,body.menu-open #adisplay,body.menu-open #hint,body.menu-open #panel,body.menu-open #dtoggle,body.menu-open #mobile-ctrl,body.menu-open #mob-spawn-btn,body.menu-open #mob-menu-btn,body.menu-open #mob-dodge-btn,body.menu-open #mob-style-btn,body.menu-open #mob-shield-flip-btn,body.menu-open #mob-weapon-btn,body.menu-open #mob-throw-btn,body.menu-open #mob-bot-shield-btn,body.menu-open #mob-bot-weapon-btn,body.menu-open #mob-music-btn,body.menu-open #mob-zone-btn{visibility:hidden !important;}

.ov-title{color:#6ab0d0;font-size:15px;letter-spacing:4px;text-transform:uppercase;margin:0 0 4px;}
.ov-sub{color:#2a5a70;font-size:10px;letter-spacing:2px;margin:0;}
.ov-btn{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:2px;padding:11px 36px;border-radius:22px;cursor:pointer;background:rgba(20,30,45,0.9);color:#6ab0d0;border:1px solid #2a5a80;min-width:200px;text-align:center;}
.ov-btn:hover{background:rgba(30,50,70,0.95);color:#8ad0e8;}
.ov-btn.accent{color:#4acc80;border-color:#1a6a3a;}
.ov-btn.accent:hover{background:rgba(10,30,20,0.95);}
.ov-btn.danger{color:#cc4040;border-color:#5a1818;}
.ov-btn.danger:hover{background:rgba(30,10,10,0.95);}
.ov-btn.small{min-width:0;padding:6px 14px;font-size:11px;border-radius:14px;}
.ov-btn.back{min-width:0;color:#3a7a9a;border-color:#1a4060;font-size:11px;padding:8px 24px;border-radius:18px;}
.ov-card{background:rgba(8,16,26,0.9);border:1px solid #1a3a54;border-radius:8px;padding:14px 18px;width:100%;max-width:460px;}
.ov-card h3{color:#2a7a9a;font-size:9px;letter-spacing:3px;text-transform:uppercase;margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid #122030;}
.ov-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
.ov-label{color:#2a6a8a;font-size:11px;flex-shrink:0;}
.ov-val{color:#8ab8c8;font-size:13px;word-break:break-all;flex:1;}
.ov-input{background:rgba(4,12,22,0.95);border:1px solid #1a3050;color:#cce;padding:10px 16px;font-size:14px;font-family:'Share Tech Mono',monospace;border-radius:20px;width:100%;max-width:280px;box-sizing:border-box;outline:none;text-align:center;cursor:text;caret-color:#6ab0d0;}
.ov-input:focus{border-color:#2a6a9a;box-shadow:0 0 10px rgba(80,140,200,0.15);}
.ov-input.wide{max-width:100%;text-align:left;border-radius:8px;padding:8px 12px;font-size:12px;}
.ov-textarea{background:rgba(4,12,22,0.95);border:1px solid #1a3050;color:#6a9ab0;padding:8px 12px;font-size:10px;font-family:monospace;border-radius:8px;width:100%;box-sizing:border-box;resize:vertical;min-height:52px;max-height:90px;outline:none;cursor:text;}
.friend-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:10px;margin-bottom:3px;background:rgba(4,12,20,0.8);border:1px solid #0e1e2e;}
.friend-item .fname{color:#7ab0c0;font-size:12px;flex:1;}
.friend-item .fstatus{font-size:9px;color:#1a4050;flex-shrink:0;}
.friend-item .fstatus.online{color:#3acc70;}
#net-status-text{font-size:11px;color:#2a5a6a;margin-bottom:6px;}
.net-msg{font-size:12px;line-height:1.5;word-break:break-word;}
.net-who{font-size:9px;margin-right:5px;}
.net-msg.me .net-who{color:#4acc80;}
.net-msg.them .net-who{color:#6ab0d0;}
.net-msg.sys{color:#1a5a6a;font-size:10px;text-align:center;font-style:italic;}
.net-screen{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}

/* ===== MOBILE ===== */
#mobile-ctrl{display:none;position:fixed;inset:0;pointer-events:none;z-index:100;}
body.is-mobile:not(.is-portrait) #mobile-ctrl{display:block;}
body.is-mobile #panel{display:none !important;}
body.is-mobile.mob-pregame canvas,body.is-mobile.mob-pregame #hud,body.is-mobile.mob-pregame #mobile-ctrl,body.is-mobile.mob-pregame #adisplay,body.is-mobile.mob-pregame #hint,body.is-mobile.mob-pregame #dtoggle{visibility:hidden !important;}
body.is-mobile canvas{width:100vw !important;height:100vh !important;}
body.is-mobile #hud{width:100% !important;}
body.is-mobile #adisplay{display:none !important;}
body.is-mobile #hint{display:none !important;}
body.is-mobile #dtoggle{display:none !important;}
#rotate-prompt{display:none;position:fixed;inset:0;z-index:999;pointer-events:all;background:#060a0e;flex-direction:column;align-items:center;justify-content:center;color:#6ab0d0;font-family:'Share Tech Mono',monospace;text-align:center;}
body.is-mobile.is-portrait #rotate-prompt{display:flex;}
body.is-mobile.is-portrait #mobile-ctrl,body.is-mobile.is-portrait canvas,body.is-mobile.is-portrait #hud{visibility:hidden;}
#rotate-prompt .icon{font-size:56px;margin-bottom:16px;animation:rotateHint 1.6s ease-in-out infinite;}
@keyframes rotateHint{0%,100%{transform:rotate(0deg);}50%{transform:rotate(90deg);}}
#rotate-prompt .txt{font-size:13px;letter-spacing:2px;opacity:0.8;}

#mob-spawn-btn,#mob-menu-btn,#mob-dodge-btn,#mob-music-btn,#mob-zone-btn,#mob-style-btn,#mob-shield-flip-btn,#mob-bot-shield-btn,#mob-bot-weapon-btn,#mob-weapon-btn,#mob-throw-btn{z-index:1000;pointer-events:auto !important;position:absolute;}
.touch-zone{z-index:100;position:absolute;top:0;bottom:0;pointer-events:all;touch-action:none;}
#zone-move{left:0;width:45%;top:90px;}
#zone-sword{right:0;width:55%;top:90px;}
.stick-base{position:absolute;border-radius:50%;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.18);transform:translate(-50%,-50%);opacity:0;transition:opacity .1s;pointer-events:none;}
.stick-base.active{opacity:1;visibility:visible;}
.stick-knob{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;visibility:hidden;}
.stick-base.active ~ .stick-knob,.stick-base.active + .stick-knob{visibility:visible;}
#move-base{width:110px;height:110px;}
#move-knob{width:50px;height:50px;background:rgba(200,200,200,0.25);box-shadow:0 2px 8px rgba(0,0,0,0.3);border:1.5px solid rgba(255,255,255,0.3);}
#sword-base{width:150px;height:150px;}
#sword-knob{width:68px;height:68px;background:rgba(200,200,200,0.25);box-shadow:0 2px 8px rgba(0,0,0,0.3);border:1.5px solid rgba(255,255,255,0.3);transition:background .1s,box-shadow .1s;}
#sword-knob.lmb-active{background:rgba(255,80,80,0.45);box-shadow:0 4px 16px rgba(255,0,0,0.6);border-color:rgba(255,120,120,0.6);}
#fixed-stick-base{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.2);display:none;pointer-events:none;z-index:90;}
body.fixed-stick-mode #fixed-stick-base{display:block;}
body.fixed-stick-mode #zone-sword .stick-base,body.fixed-stick-mode #zone-sword .stick-knob{display:none;}
#fixed-stick-knob{position:absolute;top:50%;left:50%;width:56px;height:56px;border-radius:50%;background:rgba(200,200,200,0.2);border:1.5px solid rgba(255,255,255,0.25);box-shadow:0 2px 8px rgba(0,0,0,0.3);transform:translate(-50%,-50%);transition:background .1s,box-shadow .1s;}
#fixed-stick-knob.lmb-active{background:rgba(255,80,80,0.4);box-shadow:0 4px 16px rgba(255,0,0,0.5);border-color:rgba(255,120,120,0.6);}
#fixed-stick-reticle{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #ffcc40;border-radius:50%;box-shadow:0 0 8px rgba(255,200,60,0.7);pointer-events:none;transition:transform .05s linear;}
#fixed-stick-reticle::after{content:'';position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#ffcc40;border-radius:50%;}
#mob-bot-shield-btn{top:14px;left:calc(50% - 109px);background:rgba(10,30,20,0.9);border:1px solid #2a6a40;border-radius:50%;width:50px;height:50px;color:#4acc70;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;}
#mob-bot-weapon-btn{top:14px;left:calc(50% - 165px);background:rgba(10,30,20,0.9);border:1px solid #2a6a40;border-radius:50%;width:50px;height:50px;color:#4acc70;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;}
#mob-spawn-btn{top:14px;left:calc(50% - 53px);background:rgba(10,30,20,0.9);border:1px solid #2a6a40;border-radius:50%;width:50px;height:50px;color:#4acc70;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;}
#mob-menu-btn{top:14px;left:calc(50% + 59px);background:rgba(10,20,30,0.9);border:1px solid #1a4060;border-radius:50%;width:50px;height:50px;color:#6ab0d0;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;}
#mob-music-btn{top:14px;left:calc(50% + 3px);background:rgba(10,20,30,0.9);border:1px solid #1a4060;border-radius:50%;width:50px;height:50px;color:#4acc70;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:1000;}
#mob-zone-btn{top:14px;left:calc(50% + 115px);background:rgba(10,20,30,0.9);border:1px solid #3a3010;border-radius:50%;width:50px;height:50px;color:#ccaa30;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:1000;}
#mob-zone-btn.active{border-color:#cc6010;color:#ff8020;background:rgba(40,20,5,0.9);}
#mob-style-btn{top:100px;left:126px;background:rgba(10,20,30,0.9);border:1px solid #3a5a8a;border-radius:50%;width:50px;height:50px;color:#7ab0e0;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;}
#mob-shield-flip-btn{right:160px;bottom:22px;background:rgba(10,20,30,0.9);border:1px solid #2a4a7a;border-radius:50%;width:50px;height:50px;color:#88ccff;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:1000;}
#mob-shield-flip-btn.active{background:rgba(20,45,70,0.96);border-color:#88ccff;box-shadow:0 0 14px rgba(120,190,255,0.45);}
body.is-mobile:not(.is-portrait) #mob-shield-flip-btn{display:flex;}
#mob-weapon-btn{top:100px;left:70px;background:rgba(10,20,30,0.9);border:1px solid #2a4a7a;border-radius:50%;width:50px;height:50px;color:#88ccff;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:1000;}
body.is-mobile:not(.is-portrait) #mob-weapon-btn{display:flex;}
#mob-throw-btn{top:90px;right:72px;background:rgba(10,20,30,0.9);border:1px solid #7a4a2a;border-radius:50%;width:50px;height:50px;color:#ffaa66;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:1000;}
body.is-mobile:not(.is-portrait) #mob-throw-btn{display:flex;}
#mob-dodge-btn{top:90px;right:14px;background:rgba(10,20,30,0.9);border:1px solid #2a5a3a;border-radius:50%;width:50px;height:50px;color:#4acc80;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:1000;}
#mob-dodge-btn:active{background:rgba(20,60,30,0.95);}
#mob-menu-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(5,8,12,0.92);flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;pointer-events:all;overflow-y:auto;overflow-x:hidden;padding:22px 0 32px;scrollbar-width:auto;scrollbar-color:#2c4f78 transparent;}
#mob-menu-overlay::-webkit-scrollbar,.mob-menu-embed::-webkit-scrollbar,#mob-settings-overlay::-webkit-scrollbar{width:12px;}
#mob-menu-overlay::-webkit-scrollbar-thumb,.mob-menu-embed::-webkit-scrollbar-thumb,#mob-settings-overlay::-webkit-scrollbar-thumb{background:#2c4f78;border-radius:8px;border:2px solid rgba(5,8,12,0.92);}
#mob-menu-overlay.open{display:flex;}
.mob-net-group{display:flex;gap:0;width:220px;flex-shrink:0;}
.mob-net-half{flex:1;margin:0 !important;padding:10px 2px !important;font-size:9px !important;letter-spacing:0.5px !important;min-width:0 !important;}
.mob-net-half.left{border-radius:22px 0 0 22px !important;border-right:1px solid #0a2040 !important;}
.mob-net-half.right{border-radius:0 22px 22px 0 !important;}
.menu-btn-mob{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:2px;padding:10px 32px;border-radius:22px;cursor:pointer;background:rgba(20,30,45,0.9);color:#6ab0d0;border:1px solid #2a5a80;min-width:220px;flex-shrink:0;transition:background .15s,border-color .15s;}
@media(hover:hover){.menu-btn-mob:hover{background:rgba(30,50,75,0.95);border-color:#4a8ab0;color:#8ad0f0;}.ov-btn:hover{filter:brightness(1.2);}}
.menu-btn-mob:active{background:rgba(40,70,100,0.95);}
.mob-menu-embed{max-height:60vh;overflow-y:auto;width:90%;}
#mob-settings-overlay{display:none;position:fixed;inset:0;z-index:600;background:rgba(5,8,12,0.96);flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;padding:20px 16px;}
#mob-settings-overlay.open{display:flex;}
#pvp-hud{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(8,14,22,0.9);border:1px solid #1a3a54;border-radius:20px;padding:5px 12px;z-index:200;align-items:center;gap:10px;font-family:'Share Tech Mono',monospace;font-size:11px;}
#pvp-hud.visible{display:flex;}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- ===== HUD ===== -->
<div id="hud" style="position:fixed;top:16px;left:0;width:100%;pointer-events:none;font-family:'Share Tech Mono',monospace;padding:0 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
  
  <!-- PLAYER HUD -->
  <div id="hud-player" style="width:220px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
      <span class="hud-name" id="hud-player-name" data-i18n="hud.playerLabel"></span>
      <span class="hud-wins" id="hud-p-wins"></span>
      <span class="hud-status" id="hud-p-status"></span>
    </div>
    <div data-hud="hud-p-hp,hud-p-stam,hud-p-rage"></div>
    <div class="hud-buff" id="hud-p-buff"></div>
  </div>

  <!-- BOT HUD -->

<!-- ===== СКРИПТЫ ===== -->
<script>
// ================================================================
// 1. МАКРОСЫ (ДО ВСЕХ ОСТАЛЬНЫХ СКРИПТОВ)
// ================================================================
(function() {
  'use strict';

  // ─── РЕНДЕРЕР СЛАЙДЕРОВ ───
  document.querySelectorAll('[data-slider]').forEach(el => {
    const parts = el.dataset.slider.split(',');
    const [id, labelKey, val, min, max, step] = parts;
    const hasColor = parts.length > 6 && parts[6] === 'true';
    const color = hasColor ? '#ccaa30' : '#3a9acc';
    let labelText = (window.i18n && typeof window.i18n.t === 'function') ? window.i18n.t(labelKey) : labelKey;
    if (document.getElementById('sl-' + id)) return;
    el.innerHTML = `
      <div class="row">
        <div class="row-head"><label style="${hasColor ? 'color:'+color : ''}">${labelText}</label><span class="val" style="${hasColor ? 'color:'+color : ''}" id="vl-${id}">${val}</span></div>
        <input type="range" id="sl-${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="accent-color:${color};">
      </div>
    `;
  });

  // ─── РЕНДЕРЕР ЧЕКБОКСОВ ───
  document.querySelectorAll('[data-checkbox]').forEach(el => {
    const parts = el.dataset.checkbox.split(',');
    const [id, labelKey] = parts;
    const checked = parts.length > 2 && parts[2] === 'true' ? 'checked' : '';
    const hasColor = parts.length > 3 && parts[3] === 'true';
    const color = hasColor ? '#3acc70' : '#ccaa30';
    let labelText = (window.i18n && typeof window.i18n.t === 'function') ? window.i18n.t(labelKey) : labelKey;
    if(labelKey === 'checkbox.botRandomWeapon' && labelText === labelKey) labelText = '&#1057;&#1083;&#1091;&#1095;&#1072;&#1081;&#1085;&#1086;&#1077; &#1086;&#1088;&#1091;&#1078;&#1080;&#1077; &#1073;&#1086;&#1090;&#1086;&#1074;';
    if (document.getElementById('cb-' + id)) return;
    el.innerHTML = `
      <div class="row" style="flex-direction:row;align-items:center;gap:7px;">
        <input type="checkbox" id="cb-${id}" style="accent-color:${color};cursor:pointer;" ${checked}>
        <label for="cb-${id}" style="font-size:8px;${hasColor ? 'color:'+color : ''};cursor:pointer;letter-spacing:0.5px;">${labelText}</label>
      </div>
    `;
  });

  // ─── РЕНДЕРЕР СЕЛЕКТОВ ───
  document.querySelectorAll('[data-select]').forEach(el => {
    const parts = el.dataset.select.split(',');
    const [id, labelKey, opts, defVal] = parts;
    const options = opts.split(';').map(o => {
      const [val, textKey] = o.split(':');
      const text = (window.i18n && typeof window.i18n.t === 'function') ? window.i18n.t(textKey) : textKey;
      return {val, text};
    });
    const val = defVal || options[0].val;
    const labelText = (window.i18n && typeof window.i18n.t === 'function') ? window.i18n.t(labelKey) : labelKey;
    if (document.getElementById(id)) return;
    el.innerHTML = `
      <div class="row">
        <div class="row-head"><label>${labelText}</label></div>
        <select id="${id}" style="width:100%;padding:6px;background:#081522;border:1px solid #1a5070;border-radius:3px;color:#8ad8ff;font-family:'Share Tech Mono',monospace;font-size:9px;cursor:pointer;">
          ${options.map(o => `<option value="${o.val}" ${o.val==val?'selected':''}>${o.text}</option>`).join('')}
        </select>
      </div>
    `;
  });

  // ─── РЕНДЕРЕР HUD ПОЛОСОК ───
  document.querySelectorAll('[data-hud]').forEach(el => {
    const ids = el.dataset.hud.split(',');
    const [hp, stam, rage] = ids;
    if (document.getElementById(hp)) return;
    el.innerHTML = `
      <div class="hp-bar"><div class="fill" id="${hp}"></div></div>
      <div class="stam-bar"><div class="fill" id="${stam}"></div></div>
      <div class="rage-bar"><div class="fill" id="${rage}"></div></div>
      <div class="hud-labels">
        <span class="hp" data-i18n="hud.hp"></span>
        <span class="stam" data-i18n="hud.stam"></span>
        <span class="rage" data-i18n="hud.rage"></span>
      </div>
    `;
  });

  // ─── ЗАГЛУШКИ ДЛЯ НЕДОСТАЮЩИХ ID ───
  function createMissingElements() {
    const neededIds = [
      'sl-playerglow','vl-playerglow','sl-playerrespawn-legacy','vl-playerrespawn-legacy',
      'sl-bgbright','vl-bgbright','sl-gridbright','vl-gridbright',
      'sl-dist','vl-dist','sl-spd','vl-spd','sl-inertia','vl-inertia',
      'sl-ex','vl-ex','sl-ey','vl-ey','sl-blk','vl-blk',
      'sl-aex','vl-aex','sl-aey','vl-aey','sl-as','vl-as',
      'sl-sc0','vl-sc0','sl-sc1','vl-sc1','sl-scs','vl-scs',
      'sl-srot','vl-srot','sl-sox','vl-sox','sl-soy','vl-soy',
      'sl-cscl','vl-cscl','sl-swlen','vl-swlen','sl-flailspeedmult','vl-flailspeedmult',
      'sl-flailsag','vl-flailsag','sl-dzone','vl-dzone',
      'sl-aiang','vl-aiang','sl-duelrad','vl-duelrad','sl-circchance','vl-circchance',
      'sl-probingchance','vl-probingchance','sl-probingretreat','vl-probingretreat',
      'sl-spindur','vl-spindur','sl-playerrespawn','vl-playerrespawn',
      'sl-gamepadflickwindow','vl-gamepadflickwindow','sl-gamepadflickminvel','vl-gamepadflickminvel',
      'sl-gamepadflickminamp','vl-gamepadflickminamp','sl-gamepadflickcount','vl-gamepadflickcount',
      'sl-gamepadflickmaxmult','vl-gamepadflickmaxmult','sl-gamepadstamflick','vl-gamepadstamflick',
      'sl-gamespeed','vl-gamespeed','sl-camrows','vl-camrows','sl-camlerp','vl-camlerp','sl-musicvol','vl-musicvol',
      'sl-botcount','vl-botcount','sl-botspd','vl-botspd','sl-botdodgechance','vl-botdodgechance',
      'sl-botdodgetoward','vl-botdodgetoward','sl-botscale','vl-botscale','sl-botswordscale','vl-botswordscale',
      'sl-globalspd','vl-globalspd','sl-swthresh','vl-swthresh','sl-stamblock','vl-stamblock',
      'sl-stamswing','vl-stamswing','sl-kbforce','vl-kbforce','sl-unbdur','vl-unbdur',
      'sl-unbcombo','vl-unbcombo','sl-stamreg','vl-stamreg','sl-lmbcost','vl-lmbcost',
      'sl-lmbdmg','vl-lmbdmg','sl-rageper','vl-rageper','sl-ragebuf','vl-ragebuf',
      'sl-exhdur2','vl-exhdur2','sl-exhspd2','vl-exhspd2','sl-exhswd2','vl-exhswd2',
      'sl-swres','vl-swres','sl-bladeKB','vl-bladeKB','sl-bodyKB','vl-bodyKB',
      'sl-blockSlowDur','vl-blockSlowDur','sl-blockSlowMult','vl-blockSlowMult',
      'sl-deflectMin','vl-deflectMin','sl-deflectMax','vl-deflectMax',
      'sl-swordback','vl-swordback','sl-blockKB','vl-blockKB',
      'sl-disarmchance','vl-disarmchance','sl-orbitwindow','vl-orbitwindow',
      'sl-orbitturns','vl-orbitturns','sl-stamorbit','vl-stamorbit',
      'sl-flickwindow','vl-flickwindow','sl-flickminvel','vl-flickminvel',
      'sl-flickminamp','vl-flickminamp','sl-flickcount','vl-flickcount',
      'sl-flickmaxmult','vl-flickmaxmult','sl-stamflick','vl-stamflick',
      'sl-dbg','vl-dbg'
    ];
    neededIds.forEach(id => { if (!document.getElementById(id)) { const el = document.createElement('div'); el.id = id; el.style.display = 'none'; document.body.appendChild(el); } });
  }

  // ─── СИНХРОНИЗАЦИЯ СЛАЙДЕРОВ ───
  function syncSliders() {
    document.querySelectorAll('.row input[type=range]').forEach(input => {
      const id = input.id.replace('sl-', '');
      const val = document.getElementById('vl-' + id);
      if (val) val.textContent = input.value;
    });
  }

  createMissingElements();
  document.addEventListener('input', e => { if (e.target.closest('.row input[type=range]')) syncSliders(); });
  window.syncSliders = syncSliders;
  console.log('✅ Макросы инициализированы');
})();
</script>
