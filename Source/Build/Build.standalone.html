<script>
// === bundled: src/input/player-controls.js ===
// Local controller slots. Slot 1 is the primary P entity; slots 2-4 use the
// first three entities from ALL_BOTS. A slot owns an entity only while a local
// controller is assigned to it; otherwise that entity remains controlled by AI.
(function(){
  'use strict';

  const STORAGE_KEY = 'godgrave.gamepad1.playerSlot';
  const SLOT_COUNT = 4;
  const DEADZONE_MOVE = 0.18;
  const DEADZONE_AIM = 0.22;
  const AIM_RADIUS = 90;
  // Right-stick weapon response. Increase for faster aim, decrease for slower.
  // 7.5 is exactly 3x the previous 2.5 value.
  const AIM_SMOOTH_SPEED = 14.5;

  const slots = Array.from({length:SLOT_COUNT}, (_, index) => ({
    index,
    source: index === 0 ? 'keyboard-mouse' : null,
    entity: null,
  }));
  const padState = { index:null, previousButtons:[], aimAngle:0 };

  function readStoredSlot(){
    const value = Number(localStorage.getItem(STORAGE_KEY));
    return Number.isInteger(value) && value >= 0 && value < SLOT_COUNT ? value : 0;
  }
  let gamepadSlot = readStoredSlot();

  function ensureSlotEntity(slotIndex){
    if(slotIndex === 0) return typeof P !== 'undefined' ? P : null;
    if(typeof ALL_BOTS === 'undefined') return null;
    const requiredBots = slotIndex;
    const countInput = document.getElementById('sl-botcount');
    if(ALL_BOTS.length < requiredBots && countInput && typeof applyBotCount === 'function'){
      applyBotCount();
    }
    return ALL_BOTS[slotIndex - 1] || null;
  }

  function clearManualEntity(entity){
    if(!entity) return;
    entity._manualControl = false;
    const ai = entity._aiState;
    if(ai){
      ai._fakeKeys.w = ai._fakeKeys.a = ai._fakeKeys.s = ai._fakeKeys.d = false;
      ai._fakeMDown = false;
    }
  }

  function syncSlots(){
    for(const slot of slots){
      const nextEntity = slot.index===0 || slot.index===gamepadSlot
        ? ensureSlotEntity(slot.index)
        : (typeof ALL_BOTS!=='undefined' ? ALL_BOTS[slot.index-1] || null : null);
      if(slot.entity && slot.entity !== nextEntity) clearManualEntity(slot.entity);
      slot.entity = nextEntity;
      slot.source = slot.index === 0 ? 'keyboard-mouse' : null;
    }
    slots[gamepadSlot].source = 'gamepad-0';
    if(gamepadSlot > 0 && slots[gamepadSlot].entity){
      slots[gamepadSlot].entity._manualControl = true;
      slots[gamepadSlot].entity._playerSlot = gamepadSlot;
    }
    for(let i=1;i<slots.length;i++){
      if(i !== gamepadSlot) clearManualEntity(slots[i].entity);
    }
    window.PLAYER_SLOTS = slots;
  }

  function setGamepadSlot(slotIndex){
    const next = Math.max(0, Math.min(SLOT_COUNT - 1, Number(slotIndex) || 0));
    if(gamepadSlot > 0) clearManualEntity(slots[gamepadSlot].entity);
    gamepadSlot = next;
    localStorage.setItem(STORAGE_KEY, String(gamepadSlot));
    if(gamepadSlot > 0 && typeof dummyOn !== 'undefined') dummyOn=true;
    if(gamepadSlot>0){
      const botCount=document.getElementById('sl-botcount');
      if(botCount){
        botCount.value='0';
        botCount.dispatchEvent(new Event('input',{bubbles:true}));
      }
    }
    syncSlots();
    updateSettingsUI();
  }

  function findGamepad(){
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    if(padState.index !== null && pads[padState.index]) return pads[padState.index];
    for(const pad of pads){
      if(pad){ padState.index = pad.index; return pad; }
    }
    padState.index = null;
    return null;
  }

  function axis(value, deadzone){
    value = Number(value) || 0;
    if(Math.abs(value) <= deadzone) return 0;
    return Math.sign(value) * (Math.abs(value) - deadzone) / (1 - deadzone);
  }

  function pressed(pad, index){ return !!(pad.buttons[index] && pad.buttons[index].pressed); }
  function justPressed(pad, index){ return pressed(pad,index) && !padState.previousButtons[index]; }

  function cycleWeapon(entity){
    if(!entity || typeof setWeapon !== 'function' || typeof WEAPON_TYPES === 'undefined') return;
    setWeapon(entity, ((entity.weaponType || 0) + 1) % WEAPON_TYPES.length);
  }
  function cycleShield(entity){
    if(!entity || typeof setShield !== 'function' || typeof SHIELD_TYPES === 'undefined') return;
    setShield(entity, ((entity.shield || 0) + 1) % SHIELD_TYPES.length);
  }
  function dodge(entity, moveX, moveY){
    if(!entity || isExhausted(entity) || isUnbalanced(entity) || (entity._dodgeCD || 0) > GameTime) return;
    let dx=moveX, dy=moveY;
    if(Math.hypot(dx,dy) < 0.1){ dx=Math.cos(entity.angle); dy=Math.sin(entity.angle); }
    const len=Math.hypot(dx,dy)||1;
    entity._dvx=dx/len*8; entity._dvy=dy/len*8;
    entity._dodgeCD=GameTime+0.7;
    entity._dodgeActiveUntil=GameTime+0.3;
    if(typeof drainStamina==='function') drainStamina(entity,30);
  }

  function manualFlickStaminaCost(){
    const gamepadCost = sv('gamepadstamflick');
    return Number.isFinite(gamepadCost) ? gamepadCost : sv('stamflick');
  }

  function updateManualCombatStamina(entity, attack, aimAngle, dt){
    const staminaBefore=entity.stamina;
    const state=entity._manualCombatState || (entity._manualCombatState={
      attack:false,lastAngle:null,orbitAngle:0,orbitStart:RealTime,
      flickDirection:0,flickStartAngle:0,flickCount:0,flickWindowStart:RealTime
    });
    if(entity._manualGestureSuppressUntil) state.gestureSuppressUntil=entity._manualGestureSuppressUntil;
    const melee=!isRangedWeapon(entity) && weaponKeyOf(entity)!=='flail';
    const staminaMult=typeof weaponStaminaMult==='function' ? weaponStaminaMult(entity) : 1;

    if(melee && attack){
      if(!state.attack){
        const initial=entity.stamMax*(sv('lmbcost')/100)*weaponLmbStaminaMult(entity);
        if(entity.stamina>=initial){
          drainStamina(entity,initial);
          state.holdDrain=Math.max(0,entity.stamina);
        }
      } else if(state.holdDrain>0){
        drainStamina(entity,state.holdDrain*dt);
      }
    } else state.holdDrain=0;

    if((state.gestureSuppressUntil||0)>RealTime){
      state.lastAngle=aimAngle;
      state.attack=attack;
      return;
    }
    if(state.lastAngle!==null){
      const delta=$.M.angDiff(aimAngle,state.lastAngle);
      const velocity=delta/Math.max(dt,0.001);
      if(!attack && melee){
        if(RealTime-state.orbitStart>sv('orbitwindow')){
          state.orbitAngle=0; state.orbitStart=RealTime;
        }
        const orbitDirection=Math.sign(delta);
        if(state.orbitDirection && orbitDirection && orbitDirection!==state.orbitDirection){
          state.orbitAngle=0; state.orbitStart=RealTime;
        }
        if(orbitDirection) state.orbitDirection=orbitDirection;
        state.orbitAngle+=Math.abs(delta);
        if(Math.abs(state.orbitAngle)>=Math.PI*2*sv('orbitturns')){
          drainStamina(entity,sv('stamorbit')*staminaMult);
          $.FX.hit({x:entity.x,y:entity.y-30,t:(window.I18N ? window.I18N.t('playercontrols.hitOrbit') : 'ORBIT'),life:35,big:false,col:'#ff8840'});
          state.orbitAngle=0; state.orbitStart=RealTime;
        }

        const direction=Math.sign(velocity);
        if(RealTime-state.flickWindowStart>sv('flickwindow')){
          state.flickCount=0; state.flickWindowStart=RealTime;
        }
        if(Math.abs(velocity)>=sv('flickminvel') && direction && state.flickDirection && direction!==state.flickDirection){
          const amplitude=Math.abs($.M.angDiff(aimAngle,state.flickStartAngle));
          if(amplitude>=sv('flickminamp') && amplitude<=sv('flickminamp')*sv('flickmaxmult')) state.flickCount++;
          state.flickStartAngle=aimAngle;
          if(state.flickCount>=sv('flickcount')){
            drainStamina(entity,manualFlickStaminaCost());
            $.FX.hit({x:entity.x,y:entity.y-25,t:(window.I18N ? window.I18N.t('playercontrols.hitFlick') : 'FLICK'),life:30,big:false,col:'#ffaa20'});
            state.flickCount=0; state.flickWindowStart=RealTime;
          }
        }
        if(direction && direction!==state.flickDirection){
          state.flickDirection=direction;
          state.flickStartAngle=aimAngle;
        }
        // Swing threshold is expressed in the same real weapon velocity used by
        // the normal mouse player. Stick jitter must not count as sword motion.
        if(Math.abs(entity.vel)>sv('swthresh') && (state.swingCooldown||0)<=GameTime){
          drainStamina(entity,sv('stamswing')*staminaMult);
          state.swingCooldown=GameTime+0.35;
          $.FX.hit({x:entity.x,y:entity.y-30,t:(window.I18N ? window.I18N.t('playercontrols.hitSwing') : 'SWING'),life:35,big:false,col:'#ffcc44'});
        }
      } else {
        state.orbitAngle=0; state.orbitStart=RealTime;
        state.flickCount=0; state.flickWindowStart=RealTime;
      }
    }
    state.lastAngle=aimAngle;
    state.attack=attack;
    if(staminaBefore>0 && entity.stamina<=0 && !isExhausted(entity) && typeof applyExhaust==='function') applyExhaust(entity);
  }

  function updateManualCombatStaminaV2(entity, attack, aimAngle, dt, gestureVelocity){
    const staminaBefore=entity.stamina;
    const state=entity._manualCombatStateV2 || (entity._manualCombatStateV2={
      attack:false,lastAngle:null,orbitAngle:0,orbitStart:RealTime,
      flickDirection:0,flickStartAngle:0,flickCount:0,flickWindowStart:RealTime,
      holdDrain:0,swingCooldown:-1
    });
    const melee=!isRangedWeapon(entity) && weaponKeyOf(entity)!=='flail';
    const staminaMult=typeof weaponStaminaMult==='function' ? weaponStaminaMult(entity) : 1;
    const lmbStaminaCost=entity.stamMax*(sv('lmbcost')/100)*weaponLmbStaminaMult(entity);
    if(entity._manualGestureSuppressUntil) state.gestureSuppressUntil=entity._manualGestureSuppressUntil;

    if(melee){
      if((entity.rageBuffEnd||0)>GameTime && attack){
        entity.rage=Math.max(0,(entity.rage||0)-30*dt);
        if(entity.rage>0) entity.rageBuffEnd=Math.max(entity.rageBuffEnd,GameTime+0.1);
      }
      if(isExhausted(entity) && attack) attack=false;
      if((entity.rageBuffEnd||0)<=GameTime && (entity.rage||0)<30 && attack && !state.attack && entity.stamina<lmbStaminaCost){
        attack=false;
      }
      if(attack){
        if(!state.attack){
          entity.lmbHoldStart=GameTime;
          $.S.play(isHeavySwingWeapon(entity)?'hammerSwing':'whoosh');
          if((entity.rageBuffEnd||0)<=GameTime){
            if((entity.rage||0)>=30){
              entity.rage=Math.max(0,(entity.rage||0)-30);
              entity.rageBuffEnd=GameTime+1.0;
              entity._rageTextShown=false;
              $.S.play('rage');
              state.holdDrain=Math.max(0,entity.stamina);
            } else if(entity.stamina>=lmbStaminaCost){
              drainStamina(entity,lmbStaminaCost);
              state.holdDrain=Math.max(0,entity.stamina);
            }
          }
        } else if((entity.rageBuffEnd||0)<=GameTime && state.holdDrain>0){
          drainStamina(entity,state.holdDrain*dt);
        }
        if((entity.rageBuffEnd||0)>GameTime && !entity._rageTextShown && (GameTime-(entity.lmbHoldStart||0))>=0.5){
          entity._rageTextShown=true;
          $.FX.hit({x:entity.x,y:entity.y-50,t:(window.I18N ? window.I18N.t('playercontrols.rage') : 'RAGE!'),life:40,big:true,col:'#ff2020'});
        }
      } else {
        state.holdDrain=0;
        entity.lmbHoldStart=-1;
        if((entity.rageBuffEnd||0)<=GameTime) entity._rageTextShown=false;
      }
    }

    if((state.gestureSuppressUntil||0)>RealTime){
      state.lastAngle=aimAngle;
      state.attack=attack;
      return;
    }
    if(state.lastAngle!==null){
      const delta=$.M.angDiff(aimAngle,state.lastAngle);
      const velocity=Number.isFinite(gestureVelocity) ? gestureVelocity : delta/Math.max(dt,0.001);
      if(!attack && melee){
        if(RealTime-state.orbitStart>sv('orbitwindow')){
          state.orbitAngle=0;
          state.orbitStart=RealTime;
        }
        const orbitDirection=Math.sign(delta);
        if(state.orbitDirection && orbitDirection && orbitDirection!==state.orbitDirection){
          state.orbitAngle=0;
          state.orbitStart=RealTime;
        }
        if(orbitDirection) state.orbitDirection=orbitDirection;
        state.orbitAngle+=Math.abs(delta);
        if(Math.abs(state.orbitAngle)>=Math.PI*2*sv('orbitturns')){
          drainStamina(entity,sv('stamorbit')*staminaMult);
          $.FX.hit({x:entity.x,y:entity.y-30,t:(window.I18N ? window.I18N.t('playercontrols.hitOrbit') : 'ORBIT'),life:35,big:false,col:'#ff8840'});
          $.S.play('whoosh');
          state.orbitAngle=0;
          state.orbitStart=RealTime;
        }

        const direction=Math.sign(velocity);
        const flickMinVel=sv('flickminvel')*0.8;
        const flickMinAmp=sv('flickminamp')*0.9;
        if(RealTime-state.flickWindowStart>sv('flickwindow')){
          state.flickCount=0;
          state.flickWindowStart=RealTime;
        }
        if(Math.abs(velocity)>=flickMinVel && direction && state.flickDirection && direction!==state.flickDirection){
          const amplitude=Math.abs($.M.angDiff(aimAngle,state.flickStartAngle));
          if(amplitude>=flickMinAmp && amplitude<=sv('flickminamp')*sv('flickmaxmult')){
            state.flickCount++;
          }
          state.flickStartAngle=aimAngle;
          if(state.flickCount>=sv('flickcount')){
            drainStamina(entity,manualFlickStaminaCost());
            $.FX.hit({x:entity.x,y:entity.y-25,t:(window.I18N ? window.I18N.t('playercontrols.hitFlick') : 'FLICK'),life:30,big:false,col:'#ffaa20'});
            $.S.play(isHeavySwingWeapon(entity)?'hammerSwing':'whoosh');
            state.flickCount=0;
            state.flickWindowStart=RealTime;
          }
        }
        if(direction && direction!==state.flickDirection){
          state.flickDirection=direction;
          state.flickStartAngle=aimAngle;
        }
        if(Math.abs(entity.vel)>sv('swthresh') && (state.swingCooldown||0)<=GameTime){
          drainStamina(entity,sv('stamswing')*staminaMult);
          state.swingCooldown=GameTime+0.35;
          $.FX.hit({x:entity.x,y:entity.y-30,t:(window.I18N ? window.I18N.t('playercontrols.hitSwing') : 'SWING'),life:35,big:false,col:'#ffcc44'});
          $.S.play(isHeavySwingWeapon(entity)?'hammerSwing':((entity.rageBuffEnd||0)>GameTime?'whooshRage':'whoosh'));
        }
      } else {
        state.orbitAngle=0;
        state.orbitStart=RealTime;
        state.flickCount=0;
        state.flickWindowStart=RealTime;
      }
    }
    state.lastAngle=aimAngle;
    state.attack=attack;
    if(staminaBefore>0 && entity.stamina<=0 && !isExhausted(entity) && typeof applyExhaust==='function') applyExhaust(entity);
  }

  function updateManualEntity(entity, pad, dt){
    if(!entity || !entity._aiState) return;
    const ai=entity._aiState;
    const moveX=axis(pad.axes[0],DEADZONE_MOVE);
    const moveY=axis(pad.axes[1],DEADZONE_MOVE);
    const aimX=axis(pad.axes[2],DEADZONE_AIM);
    const aimY=axis(pad.axes[3],DEADZONE_AIM);
    ai._fakeKeys.a=moveX < -0.25; ai._fakeKeys.d=moveX > 0.25;
    ai._fakeKeys.w=moveY < -0.25; ai._fakeKeys.s=moveY > 0.25;
    const aimMagnitude=Math.hypot(aimX,aimY);
    if(aimMagnitude > 0.1){
      const targetAimAngle=Math.atan2(aimY,aimX);
      if(!padState.aimActive){
        entity._manualGestureSuppressUntil=RealTime+0.3;
      }
      padState.aimActive=true;
      const smoothing=Math.min(1,dt*AIM_SMOOTH_SPEED);
      const prevAimAngle=padState.aimAngle;
      padState.aimAngle+=$.M.angDiff(targetAimAngle,padState.aimAngle)*smoothing;
      entity._manualAimVelocity=$.M.angDiff(padState.aimAngle,prevAimAngle)/Math.max(dt,0.001);
    } else padState.aimActive=false;
    entity._manualAimAngle=padState.aimAngle;
    const center=$.POS.body(entity);
    ai._fakeMX=center.x+Math.cos(padState.aimAngle)*AIM_RADIUS;
    ai._fakeMY=center.y+Math.sin(padState.aimAngle)*AIM_RADIUS;
    ai._fakeMDown=pressed(pad,7) && !isExhausted(entity) && entity.stamina>0;
    entity._manualAttackInput=ai._fakeMDown;

    if(typeof updateRangedWeaponFire==='function' && isRangedWeapon(entity)){
      updateRangedWeaponFire(entity, ai._fakeMDown);
      if(typeof updateCrossbowReloadSound==='function') updateCrossbowReloadSound(entity);
    }
    if(justPressed(pad,0)) dodge(entity,moveX,moveY);
    if(justPressed(pad,4) && typeof throwWeapon==='function') throwWeapon(entity);
    if(justPressed(pad,6)) entity._shieldFlipped=!entity._shieldFlipped;
    if(justPressed(pad,14)) cycleWeapon(entity);
    if(justPressed(pad,15)) cycleShield(entity);
    if(justPressed(pad,12)) ai._styleVals=pick(SWORD_STYLES);
    entity._manualControl=true;
    entity._playerSlot=gamepadSlot;
  }

  function update(dt){
    syncSlots();
    const pad=findGamepad();
    if(gamepadSlot > 0){
      const entity=slots[gamepadSlot].entity;
      if(pad) updateManualEntity(entity,pad,dt);
      else if(entity && entity._aiState){
        const keys=entity._aiState._fakeKeys;
        keys.w=keys.a=keys.s=keys.d=false; entity._aiState._fakeMDown=false;
      }
    }
    if(pad) padState.previousButtons=pad.buttons.map(button=>button.pressed);
  }

  function afterEntityUpdate(entity,dt){
    if(!entity || !entity._manualControl) return;
    const gestureAngle=Number.isFinite(entity._manualAimAngle) ? entity._manualAimAngle : entity.angle;
    updateManualCombatStaminaV2(entity,!!entity._manualAttackInput,gestureAngle,dt,entity._manualAimVelocity);
  }

  function shouldBlockSyntheticGameInput(event){
    return gamepadSlot > 0 && !event.isTrusted &&
      !(typeof isAnyMenuOpen === 'function' && isAnyMenuOpen());
  }
  window.addEventListener('keydown', event=>{ if(shouldBlockSyntheticGameInput(event)) event.stopImmediatePropagation(); }, true);
  window.addEventListener('keyup', event=>{ if(shouldBlockSyntheticGameInput(event)) event.stopImmediatePropagation(); }, true);
  window.addEventListener('mousemove', event=>{ if(shouldBlockSyntheticGameInput(event)) event.stopImmediatePropagation(); }, true);
  window.addEventListener('mousedown', event=>{ if(shouldBlockSyntheticGameInput(event)) event.stopImmediatePropagation(); }, true);
  window.addEventListener('mouseup', event=>{ if(shouldBlockSyntheticGameInput(event)) event.stopImmediatePropagation(); }, true);

  function updateSettingsUI(){
    const select=document.getElementById('gamepad-player-slot');
    if(select) select.value=String(gamepadSlot);
    const status=document.getElementById('gamepad-player-status');
    if(status) status.textContent=gamepadSlot===0
      ? (window.I18N ? window.I18N.t('playercontrols.status.slot0') : 'Gamepad mirrors Player 1 controls')
      : (window.I18N ? window.I18N.t('playercontrols.status.slotN',{slot:gamepadSlot+1}) : `Gamepad controls Player ${gamepadSlot+1}; AI for this character is disabled`);
    const botCount=document.getElementById('sl-botcount');
    if(botCount){
      botCount.disabled=false;
      botCount.title=gamepadSlot>0 ? (window.I18N ? window.I18N.t('playercontrols.botCountTitle') : 'Number of AI bots beyond local players') : '';
    }
    for(const id of ['mob-spawn-btn','dtoggle']){
      const button=document.getElementById(id);
      if(!button) continue;
      button.disabled=false;
      button.style.opacity='';
      button.title=gamepadSlot>0 ? (window.I18N ? window.I18N.t('playercontrols.addBotTitle') : 'Add AI bot to local PvP') : '';
    }
  }
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('gamepad-player-slot')?.addEventListener('change',event=>setGamepadSlot(event.target.value));
    if(gamepadSlot > 0 && typeof dummyOn !== 'undefined') dummyOn=true;
    syncSlots(); updateSettingsUI();
  });

  window.LocalPlayerControls={
    slots,setGamepadSlot,getGamepadSlot:()=>gamepadSlot,update,afterEntityUpdate,
    isLocalPvP:()=>gamepadSlot>0,
    isManualEntity:entity=>!!(entity&&entity._manualControl)
  };
})();

</script>
<script>
// === bundled: src/arena/arena.js ===
// === src/arena/arena.js ===
// Extracted from Build.html; loaded as a classic script to preserve shared runtime state.
// LAYER: ARENA & RENDER — фон арены, отрисовка персонажей/оружия/манекена
// Module file: arena.js
// ════════════════════════════════════════════════════════════════════════════




let _infRootEl=null, _infBoffEl=null;

// ── РИСОВАНИЕ ───────────────────────────────────────────────────────────────
// Offscreen canvas для статичного фона арены
let arenaCanvas = null, arenaCtx = null, arenaDirty = true;
let arenaBgImg = null; // фон, загружаемый из файла (см. ARENA_BG_FOLDER)

const ARENA_BG_FOLDER = 'Source/Background/';
// SPRITE_LISTS.background заполняется в loadAudioDB (см. MODULE: SPRITES)

function pickArenaBackground(){
  const url = pickRandomSprite('background');
  if(!url) return;
  arenaBgImg = loadSpriteImage(url);
  arenaBgImg.addEventListener('load', ()=>{ arenaDirty = true; }, {once:true});
}

function buildArena(){
  arenaCanvas = document.createElement('canvas');
  arenaCanvas.width  = W;
  arenaCanvas.height = H;
  arenaCtx = arenaCanvas.getContext('2d');
  const ac = arenaCtx;

  // Базовый фон: картинка из файла (если загружена) или сплошной цвет.
  // bgbright: 0..5. На 0 — тёмный (как раньше #080b10), на 5 — светлый "бумажный".
  // Интерполяция между тёмным и бумажным цветом по t=bgbright/5.
  const bgbright = sv('bgbright');
  const t = $.M.clamp(bgbright / 5, 0, 1);
  const darkR=8,  darkG=11, darkB=16;   // #080b10
  const paperR=240, paperG=232, paperB=216; // тёплый "бумажный" оттенок
  const bgR = Math.round(darkR + (paperR-darkR)*t);
  const bgG = Math.round(darkG + (paperG-darkG)*t);
  const bgB = Math.round(darkB + (paperB-darkB)*t);

  if(arenaBgImg && arenaBgImg.complete && arenaBgImg.naturalWidth > 0){
    ac.save();
    // brightness-фильтр для картинки: 0..5 -> 0..~1.6 (не делаем совсем белым)
    const imgBrightness = 0.3 + t * 1.3;
    ac.filter = `brightness(${imgBrightness})`;
    const ir = arenaBgImg.naturalWidth / arenaBgImg.naturalHeight;
    const cr = W / H;
    let dw, dh, dx, dy;
    if(ir > cr){ dh = H; dw = H*ir; dx = (W-dw)/2; dy = 0; }
    else { dw = W; dh = W/ir; dx = 0; dy = (H-dh)/2; }
    ac.drawImage(arenaBgImg, dx, dy, dw, dh);
    ac.restore();
  } else {
    ac.fillStyle = `rgb(${bgR},${bgG},${bgB})`;
    ac.fillRect(0,0,W,H);
  }

  // Сетка — отдельный ползунок яркости/прозрачности
  const gridBright = sv('gridbright');
  // На светлом фоне сетка должна быть тёмной, на тёмном — светлой.
  // Берём контрастный к фону цвет линий, прозрачность зависит от gridBright.
  const gridAlpha = Math.min(1, 0.3 * gridBright);
  let gridR, gridG, gridB;
  if(t < 0.5){
    // тёмный фон -> светло-голубая сетка (как раньше)
    gridR=20; gridG=44; gridB=66;
  } else {
    // светлый/бумажный фон -> тёмная сетка
    gridR=90; gridG=80; gridB=60;
  }
  ac.strokeStyle=`rgba(${Math.min(255,Math.round(gridR*gridBright))},${Math.min(255,Math.round(gridG*gridBright))},${Math.min(255,Math.round(gridB*gridBright))},${gridAlpha})`;
  ac.lineWidth=1;
  for(let x=0;x<W;x+=55){ ac.beginPath(); ac.moveTo(x,0); ac.lineTo(x,H); ac.stroke(); }
  for(let y=0;y<H;y+=55){ ac.beginPath(); ac.moveTo(0,y); ac.lineTo(W,y); ac.stroke(); }

  // Виньетка по краям (затемнение) — оставляем как было
  const v=ac.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.85);
  v.addColorStop(0,'transparent'); v.addColorStop(1,'rgba(0,0,0,0.55)');
  ac.fillStyle=v; ac.fillRect(0,0,W,H);

  arenaDirty = false;
}

function drawArena(){
  if(arenaDirty || !arenaCanvas) buildArena();
  ctx.drawImage(arenaCanvas, 0, 0);
}

// ── ЛЁГКИЙ AI ДЛЯ "НЕ-УМНЫХ" БОТОВ (все, кроме текущего D) ────────────────────
// Простая логика: подойти/кружить + аггро-слот (макс N атакующих одновременно,
// см. sl-maxattackers), базовая атака и реактивный додж. Полные тактики
// (фейнты/прокруты/стили меча) тут не используются — это делает "умный" AI (D).
function updateLightweightBot(bot, dt){
  if(!dummyOn || bot.hp<=0) return;
  if(DEATH.pDead || DEATH.dDead) return;
  const pC = $.POS.body(P);
  const bC = $.POS.body(bot);
  const dx = pC.x-bC.x, dy = pC.y-bC.y;
  const dist = Math.hypot(dx,dy)||1;
  const angToPlayer = Math.atan2(dy,dx);
  const cscl = sv('cscl');

botUpdateExhaustion(bot, dt);
  botRegenStamina(bot, dt);

  // Аггро-слот: сколько других ботов ближе к игроку, чем этот
  const others = ALL_BOTS.filter(b=>b!==bot && b.hp>0 && b!==D);
  const rank = others.filter(b=>{
    const oc = $.POS.body(b);
    return Math.hypot(oc.x-pC.x, oc.y-pC.y) < dist;
  }).length;
  const canEngage = rank < engageSlots;

  const engageDist = 60*cscl, orbitDist = 135*cscl;
  let mx=0, my=0;
  if(canEngage){
    if(dist > engageDist*1.1){ mx=Math.cos(angToPlayer); my=Math.sin(angToPlayer); }
    else if(dist < engageDist*0.7){ mx=-Math.cos(angToPlayer); my=-Math.sin(angToPlayer); }
  } else {
    if(bot._orbitDir===undefined) bot._orbitDir = Math.random()<0.5?1:-1;
    const tangentAng = angToPlayer + Math.PI/2*bot._orbitDir;
    mx = Math.cos(tangentAng); my = Math.sin(tangentAng);
    if(dist > orbitDist*1.3){ mx += Math.cos(angToPlayer)*0.6; my += Math.sin(angToPlayer)*0.6; }
    else if(dist < orbitDist*0.7){ mx -= Math.cos(angToPlayer)*0.6; my -= Math.sin(angToPlayer)*0.6; }
    const l=Math.hypot(mx,my)||1; mx/=l; my/=l;
  }

  const maxV = getBotMaxSpeed(bot);

  if(mx||my){
    bot.vx = $.M.lerpDT(bot.vx, mx*maxV, 0.2, dt);
    bot.vy = $.M.lerpDT(bot.vy, my*maxV, 0.2, dt);
  } else {
    bot.vx = $.M.decay(bot.vx, sv('inertia'), dt);
    bot.vy = $.M.decay(bot.vy, sv('inertia'), dt);
  }
  bot.vx = $.M.clamp(bot.vx,-15,15); bot.vy = $.M.clamp(bot.vy,-15,15);
  const step = $.M.step(dt);
  bot.x = $.M.clamp(bot.x+bot.vx*step, 40, W-80);
  bot.y = $.M.clamp(bot.y+bot.vy*step, 40, H-40);
  resolveBoxCollision(bot);

  bot._atkCD = (bot._atkCD||0) - dt;
  bot.prevAngle = bot.angle;
  if(!bot._lwSpinUntil) bot._lwSpinUntil = -1;
  if(!bot._lwSpinCD) bot._lwSpinCD = GameTime + rf(1.0, 2.0);
  if(canEngage && bot._atkCD<=0 && GameTime >= bot._lwSpinCD && bot.stamina>20 && bot.exhausted<=0 && !isRangedWeapon(bot)){
    const dur = Math.max(0.25, sv('spindur') || 0.65);
    bot._atkCD = rf(1.2, 1.0);
    bot._lwSpinUntil = GameTime + dur;
    bot._lwSpinSpeed = (Math.PI * 2 / dur) * (Math.random()<0.5 ? 1 : -1);
    bot._lwSpinCD = GameTime + rf(3.0, 4.0);
  }
  if(GameTime < bot._lwSpinUntil){
    bot.angle += bot._lwSpinSpeed * dt;
    bot.vel = bot._lwSpinSpeed;
  } else if($.IS(bot, 'flail') && bot._flailSwingTarget){
    bot.vel = $.M.lerpDT(bot.vel, bot._flailSwingTarget, 0.18, dt);
    if(Math.abs(bot.vel - bot._flailSwingTarget) < 0.05) bot._flailSwingTarget = 0;
  } else if(!isRangedWeapon(bot)){
    const rel = $.M.angDiff(P.angle, angToPlayer);
    const mirrorAng = angToPlayer - $.M.clamp(rel, -Math.PI/4, Math.PI/4);
    const diff = $.M.angDiff(mirrorAng, bot.angle);
    bot.vel = $.M.decay(bot.vel, 0.88, dt) + diff * 0.45 * weaponSwingSpeedMult(bot);
    bot.angle = $.M.angLerpDT(bot.angle, mirrorAng, 0.24, dt);
  } else {
    bot.angle = $.M.angLerpDT(bot.angle, angToPlayer, 0.24, dt);
    bot.vel = $.M.decay(bot.vel, 0.85, dt);
  }

  bot._dodgeCD = (bot._dodgeCD||0) - dt;
  const playerRageDodgeMult = (P.rageBuffEnd || 0) - GameTime > 1 ? 0.5 : 1;
  if(bot._dodgeCD<=0 && dist < 70*cscl && Math.random() < (sv('botdodgechance')/100)*dt*2*playerRageDodgeMult){
    bot._dodgeCD = 1.5;
    bot._dvx = -Math.cos(angToPlayer)*8;
    bot._dvy = -Math.sin(angToPlayer)*8;
  }
  //if(bot._dvx||bot._dvy){
  //  bot.x = $.M.clamp(bot.x+bot._dvx, 40, W-80);
  //  bot.y = $.M.clamp(bot.y+bot._dvy, 40, H-40);
  //  bot._dvx = $.M.decay(bot._dvx, 0.85, dt);
  //  bot._dvy = $.M.decay(bot._dvy, 0.85, dt);
  //  if(Math.hypot(bot._dvx,bot._dvy)<0.3){ bot._dvx=0; bot._dvy=0; }
  //}
  botUpdateDodge(bot, dt);
}









// ── UPDATE DUMMY (AI Entity) ─────────────────────────────────────────────────
function updateDummy(dt, bot){
  if(!bot) return;
  if(DEATH.dDead || DEATH.pDead) return;
  
  const ai = bot._aiState;
  if(!ai) return;
  // Баффы и реген должны обновляться до любых ранних веток ИИ.
  botUpdateExhaustion(bot, dt);
  botRegenStamina(bot, dt);
  
  // 🔥 ЕСЛИ БОТ ЗАРЯЖАЕТ МАГИЮ - НЕ ДВИГАЕМ ЕГО
  if(!bot._manualControl && bot._magicCharging === true){
    const pBodyC = $.POS.body(P);
    const bBodyC = $.POS.body(bot);
    const aimAngle = Math.atan2(pBodyC.y - bBodyC.y, pBodyC.x - bBodyC.x);
    bot.angle = aimAngle;
    // Стоим на месте
    bot.vx = $.M.lerpDT(bot.vx, 0, 0.9, dt);
    bot.vy = $.M.lerpDT(bot.vy, 0, 0.9, dt);
    const step = $.M.step(dt);
    bot.x = $.M.clamp(bot.x + bot.vx * step, 40, W-80);
    bot.y = $.M.clamp(bot.y + bot.vy * step, 40, H-40);
    return;
  }
  
  // 🔥 ЕСЛИ БОТ В КУЛДАУНЕ - ОТХОДИМ
  if(!bot._manualControl && bot._magicStaffAI && bot._magicStaffAI.state === 'cooldown'){
    const pBodyC = $.POS.body(P);
    const bBodyC = $.POS.body(bot);
    const aimAngle = Math.atan2(pBodyC.y - bBodyC.y, pBodyC.x - bBodyC.x);
    bot.angle = aimAngle;
    
    // Отходим от игрока
    const awayAngle = Math.atan2(bot.y - P.y, bot.x - P.x);
    const targetX = P.x + Math.cos(awayAngle) * 300;
    const targetY = P.y + Math.sin(awayAngle) * 300;
    
    const dx = targetX - bot.x;
    const dy = targetY - bot.y;
    const d = Math.hypot(dx, dy) || 1;
    const maxV = 7 * sv('botspd') * sv('globalspd') * getMod(bot, 'moveSlow', 1);
    bot.vx = $.M.lerpDT(bot.vx, (dx/d) * maxV, 0.22, dt);
    bot.vy = $.M.lerpDT(bot.vy, (dy/d) * maxV, 0.22, dt);
    const step = $.M.step(dt);
    bot.x = $.M.clamp(bot.x + bot.vx*step, 40, W-80);
    bot.y = $.M.clamp(bot.y + bot.vy*step, 40, H-40);
    return;
  }
  
  // ... остальной код updateDummy ...

  
  // Бот меняет стиль меча каждые 5-25 сек
  if(!bot._manualControl && (ai._styleTimer===undefined || GameTime>=ai._styleTimer)){
    ai._styleTimer = GameTime + rf(5,20);
    ai._styleVals = pick(SWORD_STYLES);
  }
  // Бот меняет сторону щита каждые 5-30 сек
  if(!bot._manualControl && (ai._shieldFlipTimer===undefined || GameTime>=ai._shieldFlipTimer)){
    ai._shieldFlipTimer = GameTime + rf(5,25);
    bot._shieldFlipped = !bot._shieldFlipped;
  }
  const fk = ai._fakeKeys;
  const fmX = ai._fakeMX, fmY = ai._fakeMY;
  const fDown = ai._fakeMDown;

  // Состояния усталости и дисбаланса уже обновлены в начале функции.
  const speedMult = getMod(bot, 'moveSlow', 1);

  // Щит бота — замедление и трата стамины
  const _dShDef = shieldDef(bot);
  const _dShWeight = _dShDef ? _dShDef.weight : 0;
  const _dShWrong = _dShDef && shieldSameSideAsSword(bot);
  const _dShBaseMult = _dShDef ? (1 - 0.15 - _dShWeight*0.1) : 1.0;
  const _dShWrongMult = _dShWrong ? 0.8 : 1.0;

  // Движение — пропускаем полностью, если этот бот в этом же кадре уже был
  // передвинут специализированным ranged-контроллером (лук/арбалет/жезл в
  // дальнем режиме, см. bot._rangedMovementHandled в updateAIDispatch).
  // Тот уже сам посчитал bot.vx/vy и применил bot.x/y. Раньше этот блок
  // читал ai._fakeKeys (для таких ботов они пустые/устаревшие), получал
  // mx=my=0 и КАЖДЫЙ КАДР гасил (decayDT) только что выставленную ranged-AI
  // скорость — из-за этого бот с луком, пытаясь отойти от стены, тут же
  // получал скорость обратно к нулю и физически не мог сдвинуться.
  if(!bot._rangedMovementHandled){
    let mx=0, my=0;
    const _dodgeLocked = GameTime < (ai._dodgeLockUntil||0) || GameTime < (bot._moveLockUntil||0);
    if(!_dodgeLocked){
      if(fk.a) mx=-1; if(fk.d) mx=1;
      if(fk.w) my=-1; if(fk.s) my=1;
      if(mx||my){ const l=Math.hypot(mx,my); mx/=l; my/=l; }
    }
    const retreatScale = ai._retreatMode ? 0.6 : 1.0;
    const dbBlockSlow = (bot._blockSlow||0) > GameTime ? sv('blockSlowMult') : 1;
    const botCount = ALL_BOTS.filter(b => b.hp > 0).length;
    const botSpeedMult = Math.max(0.5, 1 - (botCount - 1) * 0.08);

    const maxV = 7 * sv('botspd') * speedMult * retreatScale * dbBlockSlow * sv('globalspd') * botSpeedMult * _dShBaseMult * _dShWrongMult * weaponMoveSpeedMult(bot);
    if(_dodgeLocked){
      bot.vx = $.M.decay(bot.vx, sv('inertia'), dt);
      bot.vy = $.M.decay(bot.vy, sv('inertia'), dt);
    } else if(mx || my){
      bot.vx = $.M.lerpDT(bot.vx, mx*maxV, 0.22, dt);
      bot.vy = $.M.lerpDT(bot.vy, my*maxV, 0.22, dt);
    } else {
      bot.vx = $.M.decay(bot.vx, sv('inertia'), dt);
      bot.vy = $.M.decay(bot.vy, sv('inertia'), dt);
    }
    bot.vx = $.M.clamp(bot.vx, -15, 15); bot.vy = $.M.clamp(bot.vy, -15, 15);
    const step = $.M.step(dt);
    bot.x = $.M.clamp(bot.x + bot.vx*step, 40, W-80);
    bot.y = $.M.clamp(bot.y + bot.vy*step, 40, H-40);
    resolveBoxCollision(bot);
  }

botSpawnDust(bot, dt);

  // В PVP или при ожидании старта — позиция управляется сетью
  if(typeof NET_SYNC!=='undefined' && ($.NET.active() || NET_CORE.isOpen())) return;
  // Тик кулдауна бот-доджа
if(ai._botDodgeCooldown>0) ai._botDodgeCooldown-=dt;
  botUpdateDodge(bot, dt);

  // Рут бота (без компенсации — у бота её нет)
  const drc = { x: bot.x + 5, y: bot.y - 8 };
  const angToFM = Math.atan2(fmY - drc.y, fmX - drc.x);
  const opp = angToFM + Math.PI;
  const distV = dstyle('dist');
  const fdist = Math.hypot(fmX-drc.x, fmY-drc.y);
  const scaledDist = distV * $.M.clamp(fdist/120,0,1);
  bot.tbx = Math.cos(opp)*scaledDist; bot.tby = Math.sin(opp)*scaledDist;
  bot.bx = $.M.lerpDT(bot.bx, bot.tbx, sv('spd'), dt);
  bot.by = $.M.lerpDT(bot.by, bot.tby, sv('spd'), dt);

  // Пивот бота
  bot.pvX += (bot.tpX - bot.pvX)*0.35;
  bot.pvY += (bot.tpY - bot.pvY)*0.35;

  // 🔥 РАСЧЁТ TPX/TPY С УЧЁТОМ ДАЛЬНОБОЙНОГО ОРУЖИЯ
  const ang = Math.atan2(fmY - drc.y, fmX - drc.x);
  const inv = ang + Math.PI;

  // Проверяем, дальнобойное ли оружие у бота
  const isRangedBot = $.IS(bot, 'bow', 'crossbow', 'wand');

  if(!fDown || isRangedBot){
    let dex, dey, dblkVal;
    let eyOffset = 0;
    
    if (isRangedBot) {
      // 🔥 ДЛЯ ЛУКА/АРБАЛЕТА — ИСПОЛЬЗУЕМ СТИЛЬ КАК У ИГРОКА
      const style = getRangedStyle();
      dex = style.ex;      // 0
      dey = style.ey;      // -8
      dblkVal = style.blk; // 0.17
      // Адаптивные смещения отключаем
    } else {
      // Обычное оружие — настройки из слайдеров
      const adaXon = dstyleCb('adaX');
      if(adaXon){
        const t = Math.sin(ang)*Math.sin(ang);
        dex = dstyle('adaXb') + (dstyle('adaXp') - dstyle('adaXb')) * t;
      } else {
        dex = dstyle('ex');
      }
      dey = dstyle('ey');
      dblkVal = dblk();
      
      // Адаптивные смещения для ближнего боя
      const adaYon = dstyleCb('adaY');
      const adaDon = dstyleCb('adaD');
      const ada12on = dstyleCb('ada12');
      if(adaYon){ eyOffset -= $.M.clamp(-Math.sin(ang),0,1)*csv('adaY'); }
      if(adaDon){
        const tc = Math.cos(ang - Math.PI/2);
        eyOffset += $.M.clamp(tc*tc*(tc>0?1:0),0,1)*csv('adaD');
      }
      if(ada12on){
        eyOffset += $.M.clamp(Math.cos((ang+Math.PI/2)*2),0,1)*csv('ada12');
      }
    }
    
    bot.tpX += (Math.cos(inv)*dex - bot.tpX) * dblkVal;
    bot.tpY += (Math.sin(inv)*dey + eyOffset - bot.tpY) * dblkVal;
  } else {
    // ЛКМ зажат — атака (только для ближнего боя, у дальнобойного fDown всегда false)
    const aex = csv('aex'), aey = csv('aey');
    bot.tpX += (Math.cos(ang)*aex - bot.tpX) * sv('as');
    bot.tpY += (Math.sin(ang)*aey - bot.tpY) * sv('as');
  }

  // Угол меча
  const dpivX = drc.x + bot.pvX, dpivY = drc.y + bot.pvY;
  let ta = Math.atan2(fmY - dpivY, fmX - dpivX);
  // 🔥 УЧИТЫВАЕМ ДЕБАФФ ОТ ЩИТА
  // 🔥 УЧИТЫВАЕМ ДЕБАФФ ОТ ЩИТА (убрано, дебафф больше не ставится)
   // 🔥 ДЕБАФФ ДЛЯ БОТА
  const botDebuffMult = getDebuffSwordMult(bot);
  const spdMult2 = botDebuffMult;
  // 🔥 ОБРАБОТКА ЦЕПА — ОТДЕЛЬНО, С ВОЗВРАТОМ
  if($.IS(bot, 'flail')){
    if(bot._manualControl){
      updateFlailSwing(bot, ta, dt);
      bot.prevAngle = bot.angle;
      return;
    }
    // ── ЦЕП: РЕАЛИСТИЧНОЕ ПОВЕДЕНИЕ ДЛЯ БОТА ──
    if(!bot._flailSpinState) {
        bot._flailSpinState = 'idle'; // idle | spinning | retracting
        bot._flailSpinAngle = 0;
        bot._flailSpinDir = Math.random() < 0.5 ? 1 : -1;
        bot._flailSpinSpeed = 4.0;
        bot._flailTimer = 0;
    }
    
    bot._flailTimer -= dt;
    
    // ── МЕНЯЕМ СОСТОЯНИЕ КАЖДЫЕ 1-3 СЕКУНДЫ ──
    if(bot._flailTimer <= 0){
        const r = Math.random();
        if(r < 0.4){
            // 40% — вращение
            bot._flailSpinState = 'spinning';
            bot._flailSpinDir = Math.random() < 0.5 ? 1 : -1;
            bot._flailSpinSpeed = 3.0 + Math.random() * 3.0;
            bot._flailTimer = 0.8 + Math.random() * 1.5; // 0.8-2.3 сек вращения
        } else if(r < 0.7){
            // 30% — пауза (цепь складывается)
            bot._flailSpinState = 'idle';
            bot._flailTimer = 0.5 + Math.random() * 1.0; // 0.5-1.5 сек паузы
        } else {
            // 30% — резкая смена направления
            bot._flailSpinState = 'spinning';
            bot._flailSpinDir *= -1;
            bot._flailSpinSpeed = 4.0 + Math.random() * 2.0;
            bot._flailTimer = 0.5 + Math.random() * 1.0;
        }
    }
    
    // ── ПРИМЕНЯЕМ СОСТОЯНИЕ ──
    let fakeAng;
    if(bot._flailSpinState === 'spinning'){
        // Вращаем прицел по кругу
        bot._flailSpinAngle += bot._flailSpinDir * bot._flailSpinSpeed * dt;
        const spinRadius = 80;
        const fakeX = drc.x + Math.cos(bot._flailSpinAngle) * spinRadius;
        const fakeY = drc.y + Math.sin(bot._flailSpinAngle) * spinRadius;
        fakeAng = Math.atan2(fakeY - dpivY, fakeX - dpivX);
    } else {
        // Idle — смотрим на игрока (цепь будет складываться)
        fakeAng = ta;
    }
    
    // Раскручиваем цепь с правильным углом
    updateFlailSwing(bot, fakeAng, dt);
    
    // Если в режиме idle — принудительно ускоряем складывание
    if(bot._flailSpinState === 'idle'){
        bot._flailExt = Math.max(0, (bot._flailExt || 0) - 2.0 * dt);
    }
    
    bot.prevAngle = bot.angle;
    return;
  }
  
  // ── ОСТАЛЬНОЕ ОРУЖИЕ (НЕ ЦЕП) ──
  if(hasMod(bot, 'weaponRecoil')){
  bot._disbalanceAngularVelocity = (bot._disbalanceAngularVelocity || 0) * Math.pow(0.12, dt);
  bot.angle += bot._disbalanceAngularVelocity * dt;
  bot.vel = bot._disbalanceAngularVelocity;
} else {
    bot.vel = $.M.decay(bot.vel, 0.6, dt) + $.M.angDiff(ta, bot.angle)*0.4*weaponSwingSpeedMult(bot);
    bot.angle = $.M.angLerpDT(bot.angle, ta, 0.28*spdMult2, dt);
  }
  bot.prevAngle = bot.angle;
}








function updateChargeShake(ent, dt){
  if(!ent) return;
  
  // Определяем, заряжается ли оружие
  const key = weaponKeyOf(ent);
  let isCharging = false;
  let chargeStart = 0;
  let chargeTime = 1.0;
  let intensityMult = 1.0;
  
  if(key === 'wand') {
    isCharging = ent._wandCharging || false;
    chargeStart = ent._wandChargeStart || 0;
    chargeTime = wandChargeTimeFor(ent);
    intensityMult = 1.2;
  } else if(key === 'magicstaff') {
    isCharging = ent._magicCharging || false;
    chargeStart = ent._magicChargeStart || 0;
    chargeTime = MAGICSTAFF_CHARGE_FULLTIME;
    intensityMult = 1.0;
  } else if(key === 'bow') {
    isCharging = ent._bowCharging || false;
    chargeStart = ent._bowChargeStart || 0;
    chargeTime = BOW_RELOAD;
    intensityMult = 0.8;
  } else if(ent._shieldDashCharging) {
    isCharging = true;
    chargeStart = ent._shieldDashChargeStart || 0;
    chargeTime = ent._shieldDashChargeMax || 3.0;
    intensityMult = 1.6;
  }
  
  if(isCharging && chargeTime > 0) {
    const progress = Math.min(1, (GameTime - chargeStart) / chargeTime);
    const intensity = 0.3 + progress * 1.5 * intensityMult;
    const time = GameTime * 20;
    const seed = ent._chargeSeed || 0;
    
    ent._chargeShakeX = Math.sin(time * 1.3 + seed) * intensity * 0.8 +
                        Math.sin(time * 2.7 + seed * 1.7) * intensity * 0.4;
    ent._chargeShakeY = Math.cos(time * 1.7 + seed * 0.7) * intensity * 0.6 +
                        Math.sin(time * 3.1 + seed * 2.3) * intensity * 0.3;
    ent._chargeShakeAngle = Math.sin(time * 2.1 + seed * 1.3) * intensity * 0.02 +
                            Math.cos(time * 3.7 + seed * 0.5) * intensity * 0.01;
  } else {
    // Плавное затухание
    ent._chargeShakeX = (ent._chargeShakeX || 0) * 0.9;
    ent._chargeShakeY = (ent._chargeShakeY || 0) * 0.9;
    ent._chargeShakeAngle = (ent._chargeShakeAngle || 0) * 0.9;
    if(Math.abs(ent._chargeShakeX) < 0.01) ent._chargeShakeX = 0;
    if(Math.abs(ent._chargeShakeY) < 0.01) ent._chargeShakeY = 0;
    if(Math.abs(ent._chargeShakeAngle) < 0.001) ent._chargeShakeAngle = 0;
  }
}











let boxesOn = false;

function drawBoxes(){
  if(!boxesOn) return;
  for(const b of BOXES){
    // тень
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(b.x+4, b.y+6, b.w, b.h);
    // основа ящика
    ctx.fillStyle='#2a1e10';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // верхняя грань
    ctx.fillStyle='#4a3218';
    ctx.fillRect(b.x+2, b.y+2, b.w-4, b.h*0.35);
    // доски — горизонтальные линии
    ctx.strokeStyle='#1a1008'; ctx.lineWidth=1;
    for(let i=1;i<3;i++){
      const ly = b.y + b.h * i/3;
      ctx.beginPath(); ctx.moveTo(b.x+2,ly); ctx.lineTo(b.x+b.w-2,ly); ctx.stroke();
    }
    // вертикальная полоска по центру
    ctx.beginPath(); ctx.moveTo(b.x+b.w/2,b.y+2); ctx.lineTo(b.x+b.w/2,b.y+b.h-2); ctx.stroke();
    // рамка
    ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=1.5;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    // блик
    ctx.strokeStyle='rgba(120,80,30,0.25)'; ctx.lineWidth=1;
    ctx.strokeRect(b.x+2, b.y+2, b.w-4, b.h-4);
  }
}

function drawBowArrow(ent){
  if(!ent || $.NOT(ent, 'bow')) return;
  if(!ent._bowCharging) return;
  
  const tip = $.POS.tip(ent);
  const progress = Math.min(1, (GameTime - ent._bowChargeStart) / BOW_RELOAD);
  
  // Дрожание
  const intensity = 0.3 + progress * 0.7;
  const time = GameTime * 25;
  const seed = ent._bowSeed || 0;
  const shakeX = Math.sin(time * 1.7 + seed) * 0.6 * intensity;
  const shakeY = Math.cos(time * 2.3 + seed * 1.3) * 0.8 * intensity;
  const shakeAngle = Math.sin(time * 3.1 + seed * 0.7) * 0.015 * intensity;
  
  const arrowUrl = ent._bowArrowUrl || (ent._bowArrowUrl = pickRandomSprite('arrow'));
  const img = arrowUrl ? loadSpriteImage(arrowUrl) : null;
  
  ctx.save();
  ctx.translate(tip.x + shakeX, tip.y + shakeY);
  ctx.rotate(ent.angle + shakeAngle);
  
  ctx.globalAlpha = 0.5 + progress * 0.5;
  
  // 🔥 РАЗМЕР СТРЕЛЫ (маленький)
  const arrowSize = 4 + progress * 3;
  
  if(img && img.complete && img.naturalWidth > 0){
    // 🔥 ПРАВИЛЬНЫЕ ПРОПОРЦИИ
    const aspect = img.naturalWidth / img.naturalHeight;
    const w = arrowSize;
    const h = arrowSize / aspect; // ширина = arrowSize, высота = arrowSize / aspect
    
    // 🔥 ПОВОРОТ НА 90° (чтобы остриё смотрело вперёд)
    ctx.rotate(Math.PI / 2);
    
    // 🔥 СМЕЩЕНИЕ: остриё в точке (0,0), т.е. сдвигаем на -w/2 по X
    ctx.drawImage(img, -w/4, -h/4, w, h);
  } else {
    // Рисованная стрела
    ctx.rotate(Math.PI / 2);
    ctx.strokeStyle = '#c8a878';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-arrowSize * 0.2, 0);
    ctx.lineTo(arrowSize * 0.8, 0);
    ctx.stroke();
    
    ctx.fillStyle = '#c0c8d8';
    ctx.beginPath();
    ctx.moveTo(arrowSize * 0.85, 0);
    ctx.lineTo(arrowSize * 0.7, -3);
    ctx.lineTo(arrowSize * 0.7, 3);
    ctx.closePath();
    ctx.fill();
  }
  
  // Свечение
  if(progress > 0.3){
    const glowAlpha = progress * 0.3;
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 20 + progress * 15);
    grad.addColorStop(0, `rgba(255,220,150,${glowAlpha * 0.5})`);
    grad.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 20 + progress * 15, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.globalAlpha = 1;
  ctx.restore();
}

    ctx.beginPath(); ctx.moveTo(pivX, pivY); ctx.lineTo(pivX+P._vcX, pivY+P._vcY); ctx.stroke();

function drawSwordSprite(ctx2, img, length, glowColor, glowBlur, centerGrip, weaponKey){
  const width = length * spriteAspectFor(img);
  if(glowColor){ ctx2.shadowColor = glowColor; ctx2.shadowBlur = glowBlur; }
  
  // ✅ Для копья — хват ближе к острию (40% от длины)
  if(weaponKey === 'spear'){
    const gripOffset = length * 0.3; // хват на 40% от основания (ближе к острию)
    ctx2.drawImage(img, -width/2, gripOffset, width, -length);
  }
  else if(centerGrip){
    // Посох — по центру
    ctx2.drawImage(img, -width/2, length/2, width, -length);
  } else {
    // Меч, кинжал, топор, молот — за рукоять
    const hiltShift = length * SWORD_HILT_OFFSET;
    ctx2.drawImage(img, -width/2, hiltShift, width, -length);
  }
  
  ctx2.shadowBlur = 0;
}


function updateMagicStaffShake(ent, dt){
  if(!ent || !ent._magicCharging) {
    // Плавно возвращаем в исходное положение
    ent._magicShakeX = (ent._magicShakeX || 0) * 0.9;
    ent._magicShakeY = (ent._magicShakeY || 0) * 0.9;
    ent._magicShakeAngle = (ent._magicShakeAngle || 0) * 0.9;
    return;
  }
  
  const progress = Math.min(1, (GameTime - ent._magicChargeStart) / MAGICSTAFF_CHARGE_FULLTIME);
  const intensity = 0.3 + progress * 1.5; // усиливается со временем
  
  // Случайное дрожание с синусоидальной составляющей
  const time = GameTime * 20;
  const seed = ent._magicSeed || 0;
  
  ent._magicShakeX = Math.sin(time * 1.3 + seed) * intensity * 0.8 +
                      Math.sin(time * 2.7 + seed * 1.7) * intensity * 0.4;
  ent._magicShakeY = Math.cos(time * 1.7 + seed * 0.7) * intensity * 0.6 +
                      Math.sin(time * 3.1 + seed * 2.3) * intensity * 0.3;
  ent._magicShakeAngle = Math.sin(time * 2.1 + seed * 1.3) * intensity * 0.02 +
                          Math.cos(time * 3.7 + seed * 0.5) * intensity * 0.01;
}


function drawWeaponWithShake(ent, pivX, pivY){
  if(!ent) return;
  
  const weaponKey = weaponKeyOf(ent);
  const isBow = weaponKey === 'bow';
  const isMagicStaff = weaponKey === 'magicstaff';
  
  if(!isBow && !isMagicStaff) return;
  
  const img = ent._weaponImg;
  if(!img || !img.complete || img.naturalWidth <= 0) return;
  
  // Определяем прогресс зарядки
  let progress = 0;
  if(isBow && ent._bowCharging){
    progress = Math.min(1, (GameTime - ent._bowChargeStart) / BOW_RELOAD);
  } else if(isMagicStaff && ent._magicCharging){
    progress = Math.min(1, (GameTime - ent._magicChargeStart) / MAGICSTAFF_CHARGE_FULLTIME);
  }
  
  ctx.save();
  ctx.translate(pivX, pivY);
  
  let shakeX = 0, shakeY = 0, shakeAngle = 0;
  let scaleY = 1, skewX = 0;
  let baseScale = 1.0;
  let maxScale = 1.0;
  let bowScale = 1.0;
  
  if(progress > 0.05){
    const intensity = 0.3 + progress * 0.7;
    const time = GameTime * 25;
    const seed = ent._bowSeed || ent._magicSeed || 0;
    
    // 🔥 ДЛЯ МАГИЧЕСКОГО ПОСОХА — СИЛЬНЕЕ ТРЯСКА
    const shakeMult = isMagicStaff ? 2.0 : 1.0;
    
    shakeX = Math.sin(time * 1.7 + seed) * 0.6 * intensity * shakeMult;
    shakeY = Math.cos(time * 2.3 + seed * 1.3) * 0.8 * intensity * shakeMult;
    shakeAngle = Math.sin(time * 3.1 + seed * 0.7) * 0.015 * intensity * shakeMult;
    
    if(isBow){
      // Сжатие по Y при натяжении лука
      scaleY = 1 - progress * 0.18;
      skewX = progress * 0.12;
      baseScale = 0.75;
      maxScale = 1.0;
      bowScale = baseScale + (maxScale - baseScale) * progress;
    } else if(isMagicStaff){
      // 🔥 ДЛЯ МАГИЧЕСКОГО ПОСОХА — СВЕЧЕНИЕ И ТРЯСКА
      scaleY = 1 - progress * 0.05;
      skewX = progress * 0.03;
      baseScale = 0.9;
      maxScale = 1.1;
      bowScale = baseScale + (maxScale - baseScale) * progress;
    }
  }
  
  ctx.translate(shakeX, shakeY);
  ctx.rotate(ent.angle + Math.PI/2 + shakeAngle);
  
  // Применяем скейл
  if(isBow || isMagicStaff){
    ctx.scale(bowScale, bowScale * scaleY);
    ctx.transform(1, 0, skewX * 0.4, 1, 0, 0);
  }
  
  // 🔥 СВЕЧЕНИЕ ДЛЯ МАГИЧЕСКОГО ПОСОХА
  if(isMagicStaff && ent._magicCharging && progress > 0.1){
    const glowIntensity = 0.3 + progress * 0.7;
    const glowSize = 20 + progress * 40;
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
    grad.addColorStop(0, `rgba(100, 200, 255, ${glowIntensity * 0.5})`);
    grad.addColorStop(0.5, `rgba(80, 180, 255, ${glowIntensity * 0.25})`);
    grad.addColorStop(1, 'rgba(40, 120, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Скейл оружия
  const swScale = effSwordScale(ent) * sv('swlen') * (isBot(ent) ? sv('botswordscale') : 1);
  ctx.scale(swScale, swScale);
  
  const baseLen = weaponLenFor(ent);
  const width = baseLen * spriteAspectFor(img);
  const centerGrip = CENTER_GRIP_CATEGORIES.includes(weaponDefFor(ent).category);
  
  if(weaponKey === 'flail'){
    drawFlailSprite(ctx, ent, baseLen, null, 0);
  } else {
    drawSwordSprite(ctx, img, baseLen, null, 0, centerGrip, weaponKey);
  }
  
  ctx.restore();
}

function drawSword(pivX, pivY, angle){
  const swScale = effSwordScale(P) * sv('swlen');
  const BASE_L = weaponLenFor(P);
  const centerGrip = CENTER_GRIP_CATEGORIES.includes(weaponDefFor(P).category);
  const weaponKey = weaponDefFor(P).key;
  const spd = Math.abs(P.vel);
  const meleePoseActive = $.A.meleeHold(P, mDown);
  let shapeRot = 0;
  if(!meleePoseActive){
    const dx = mX - W/2, dy = mY - H/2;
    const halfDiag = Math.hypot(W, H) / 2;
    const t = $.M.clamp((dx - dy) / halfDiag, -1, 1);
    const amplitude = sv('srot') * Math.PI / 180;
    shapeRot = -t * amplitude;
  }
  const sox = meleePoseActive ? 0 : sv('sox');
  const soy = meleePoseActive ? 0 : sv('soy');
    // 🔥 ПРОЗРАЧНОСТЬ ОТ ДЕБАФФА
  const _exhAlpha = getDebuffAlpha(P);
  
  // 🔥 ДЛЯ ЛУКА — ИСПОЛЬЗУЕМ СПЕЦИАЛЬНУЮ ФУНКЦИЮ С ДРОЖАНИЕМ
  if(weaponKey === 'bow'){
    ctx.save();
    ctx.globalAlpha = _exhAlpha;
    drawWeaponWithShake(P, pivX, pivY);
    ctx.restore();
    return;
  }
  
  // 🔥 ЕДИНАЯ ТРЯСКА ДЛЯ ЖЕЗЛА И МАГИЧЕСКОГО ПОСОХА
  let shakeX = 0, shakeY = 0, shakeAngle = 0;
  if($.E.chargeShake(P)){
    shakeX = P._chargeShakeX || 0;
    shakeY = P._chargeShakeY || 0;
    shakeAngle = P._chargeShakeAngle || 0;
  }
  
  ctx.save();
  ctx.globalAlpha = _exhAlpha;
  ctx.translate(pivX + shakeX, pivY + shakeY);
  ctx.rotate(angle + Math.PI/2 + shakeAngle);
  ctx.translate(soy, -sox);
  ctx.rotate(shapeRot);
  ctx.scale(swScale, swScale);

  const rageActive = P.rageBuffEnd > GameTime;
  let glowColor = null, glowBlur = 0;
  if(rageActive){
    glowColor = 'rgba(255,40,0,0.9)';
    glowBlur = 18 + spd * 15;
  }

  const img = P._weaponImg;
  if(weaponKey === 'flail'){
    drawFlailSprite(ctx, P, BASE_L, glowColor, glowBlur);
  } else if(img && img.complete && img.naturalWidth > 0){
    drawSwordSprite(ctx, img, BASE_L, glowColor, glowBlur, centerGrip, weaponKey);
  }
  ctx.restore();
}

// ── РИСОВАНИЕ ЩИТА ──────────────────────────────────────────────────────────
function drawShield(ent, cursorX){
  const def = shieldDef(ent);
  if(!def || !def.url) return;
  const img = ent._shieldImg;
  const imgReady = img && img.complete && img.naturalWidth > 0;

  const CHAR_H = CHAR_SPRITE_H * sv('cscl') * 1.2;
  const shH = CHAR_H * def.scale;
  const aspectRatio = (imgReady && img.naturalHeight>0) ? (img.naturalWidth/img.naturalHeight) : 0.75;
  const shW = shH * aspectRatio;
  ent._shieldW = shW; ent._shieldH = shH; ent._shieldType = ent.shield;

  const held = typeof shieldHeld === 'function' && shieldHeld(ent);
  const sc = shieldCenter(ent, cursorX);
  if(!sc) return;
  
  // Башенный (3) и большой (2) щиты — дополнительный offset от тела
  if(ent.shield===3) sc.x += sc.side * shW * 0.2;
  if(ent.shield===2) sc.x += sc.side * shW * 0.2;
  
  const _shExhMult = (ent.exhausted > 0 || ent.unbalanced > 0) ? 0.85 : 1.0;
  const _shExhOffY = (ent.exhausted > 0 || ent.unbalanced > 0) ? shH * 0.15 : 0;

  const _rawTilt = Math.sin(ent.angle) * (15*Math.PI/180);
  const _maxTilt = 15*Math.PI/180;
  const shieldAngle = $.M.clamp(_rawTilt, -_maxTilt, _maxTilt);

  const _shDisabled = $.E.shieldOff(ent);
  ent._shieldAlpha = held ? (_shDisabled ? 0.3 : 1.0) : 0.25;

  const _shBackMult = held ? 1.0 : 0.85;
  const _shWf = shW * _shExhMult * _shBackMult;
  const _shHf = shH * _shExhMult * _shBackMult;
  const _dashCharging = ent._shieldDashCharging && held;
  const _dashChargePower = Math.max(0, Math.min(1, ent._shieldDashChargePower || 0));
  ctx.save();
  ctx.globalAlpha = ent._shieldAlpha;
  ctx.translate(sc.x, sc.y + _shExhOffY);
  if(_dashCharging){
    const shake = (1 + _dashChargePower * 2.5);
    ctx.translate(
      (ent._chargeShakeX || 0) * shake,
      (ent._chargeShakeY || 0) * shake
    );
    ctx.rotate((ent._chargeShakeAngle || 0) * 1.5);
  }
  ctx.rotate(shieldAngle);
  if(imgReady){
    if(_dashCharging){
      ctx.shadowColor = '#60ccff';
      ctx.shadowBlur = _dashChargePower * 50;
    }
    if(_dashCharging) ctx.globalAlpha = ent._shieldAlpha * (0.45 + _dashChargePower * 0.55);
    ctx.drawImage(img, -_shWf/2, -_shHf/2, _shWf, _shHf);
  } else {
    ctx.fillStyle = 'rgba(100,180,255,0.5)';
    ctx.strokeStyle = '#4af';
    ctx.lineWidth = 2;
    ctx.fillRect(-_shWf/2, -_shHf/2, _shWf, _shHf);
    ctx.strokeRect(-_shWf/2, -_shHf/2, _shWf, _shHf);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Persistent status indicators are drawn with the character, rather than as
// one-frame hitFX particles. This makes them visible at every frame rate.
function drawStatusEffects(ent, cscl){
  const c = $.POS.body(ent);
  const headY = c.y - 30 * cscl;
  const t = GameTime;
  ctx.save();

  if(isUnbalanced(ent)){
    const effectScale = 0.6;
    // Wide horizontal ellipse around the head. Scale and alpha pulse by the
    // star's orbit phase, giving depth without allocating transient FX.
    for(let i = 0; i < 4; i++){
      const phase = t * 3.2 + i * Math.PI / 2;
      const depth = (Math.sin(phase) + 1) * 0.5;
      const x = c.x + Math.cos(phase) * 22 * effectScale * cscl;
      const y = headY + Math.sin(phase) * 8 * effectScale * cscl;
      const size = (3.2 + depth * 3.8) * effectScale * cscl;
      ctx.globalAlpha = 0.35 + depth * 0.65;
      ctx.fillStyle = '#ffe066';
      ctx.shadowColor = '#c88000';
      ctx.shadowBlur = 4 + depth * 5;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(phase * 0.7);
      ctx.beginPath();
      for(let p = 0; p < 10; p++){
        const radius = p % 2 === 0 ? size : size * 0.42;
        const angle = -Math.PI / 2 + p * Math.PI / 5;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if(p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  ctx.restore();
}

function drawChar(ent, cscl, torsoCol, headCol){
  const bx = ent.x + 5 + ent.bx;
  const by = ent.y - 8 + ent.by;
  ctx.save();
  ctx.translate(bx, by);
  ctx.scale(cscl, cscl);
  const _hitTiltElapsed = GameTime - (ent._hitTiltT0!==undefined ? ent._hitTiltT0 : -99);
  const _hitTilt = (ent._hitTiltAmp||0) * Math.exp(-Math.max(0,_hitTiltElapsed) * 10);
  ctx.rotate((ent.vx||0)*0.02 + _hitTilt);

  // тень
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(0,22,18,7,0,0,Math.PI*2); ctx.fill();

  const flash = ent.hitFlash > GameTime;
  const img = ent._skinImg;

  // Ширина из реальных пропорций PNG (без искажения аспекта)
  let spriteW = 16; // дефолт пока картинка не загрузилась
  if(img && img.naturalWidth > 0 && img.naturalHeight > 0){
    spriteW = CHAR_SPRITE_H * (img.naturalWidth / img.naturalHeight);
  }

  // Мягкое белое свечение позади игрока (у бота — нет) — радиальный градиент,
  // без видимого сплошного круга, только затухающее гало.

(function(){
  'use strict';

  function t(key, fallback, vars){
    return window.I18N ? window.I18N.t(key, vars) : fallback;
  }

  function clampPercent(value, max){
    const limit = Number(max) > 0 ? Number(max) : 100;
    const safeValue = Number(value) || 0;
    return Math.max(0, Math.min(100, (safeValue / limit) * 100));
  }

  function setBarWidth(selector, value, max){
    const el = document.querySelector(selector);
    if(el) el.style.width = clampPercent(value, max).toFixed(1) + '%';
  }

  function setRageBar(el, value){
    if(!el) return;
    const rage = Number(value) || 0;
    el.style.width = clampPercent(rage, 100).toFixed(1) + '%';
    el.style.background = rage >= 50 ? '#2f8cff' : '#777f88';
  }

  function setTextIfPresent(selector, text){
    const el = document.querySelector(selector);
    if(el) el.textContent = text || '';
  }

  function entityStatusText(entity){
    if(!entity) return '';
    if(typeof isUnbalanced === 'function' && isUnbalanced(entity)){
      return t('hud.unbalanced', 'UNBALANCED');
    }
    if(typeof isExhausted === 'function' && isExhausted(entity)){
      return t('hud.botExhausted', 'EXHAUSTED');
    }
    if(entity._debuffActive){
      return t('hud.debuff', 'DEBUFF');
    }
    return '';
  }

  function botPhaseText(bot){
    if(!bot) return '';
    const ai = bot._aiState || {};
    const style = ai.style || ai.profile || '';
    const phase = ai.phase || ai.state || '';
    if(style === 'probing'){
      const probingMap = {
        approach: 'hud.probingApproach',
        strike: 'hud.probingStrike',
        retreat: 'hud.probingRetreat',
        pause: 'hud.probingPause',
        mirrorBlock: 'hud.probingMirrorBlock'
      };
      return t('hud.probingPhase', 'PROBING', {
        state: t(probingMap[phase] || 'hud.probingPause', 'PAUSE')
      });
    }
    if(style === 'harass'){
      const harassMap = {
        approach: 'hud.harassApproach',
        strike: 'hud.harassStrike',
        orbit: 'hud.harassOrbit'
      };
      return t('hud.harassPhase', 'HARASS', {
        phase: t(harassMap[phase] || 'hud.harassApproach', 'APPROACH')
      });
    }
    const genericMap = {
      attack: 'hud.phaseAttack',
      retreat: 'hud.phaseRetreat',
      rest: 'hud.phaseRest'
    };
    return genericMap[phase] ? t(genericMap[phase], '') : '';
  }

  function updateMainHudEntity(prefix, entity, options){
    if(!entity) return;
    const maxHp = entity.maxHp || 100;
    const maxStam = entity.stamMax || 100;
    setBarWidth('#' + prefix + '-hp', entity.hp, maxHp);
    setBarWidth('#' + prefix + '-stam', entity.stamina, maxStam);
    setRageBar(document.querySelector('#' + prefix + '-rage'), entity.rage);
    if(options && options.statusSelector){
      setTextIfPresent(options.statusSelector, entityStatusText(entity));
    }
    if(options && options.buffSelector){
      const rageActive = (entity.rageBuffEnd || 0) > (typeof GameTime !== 'undefined' ? GameTime : 0);
      setTextIfPresent(options.buffSelector, rageActive ? t('hud.rageBuff', 'RAGE 2x') : '');
    }
  }

  function updateLocalSlotHud(slotEl, entity){
    if(!slotEl) return;
    slotEl.style.display = entity ? 'block' : 'none';
    if(!entity) return;
    const hpBar = slotEl.querySelector('[data-hp]');
    const stamBar = slotEl.querySelector('[data-stam]');
    const rageBar = slotEl.querySelector('[data-rage]');
    if(hpBar) hpBar.style.width = clampPercent(entity.hp, entity.maxHp || 100).toFixed(1) + '%';
    if(stamBar) stamBar.style.width = clampPercent(entity.stamina, entity.stamMax || 100).toFixed(1) + '%';
    setRageBar(rageBar, entity.rage);
  }

  function updateHUD(){
    if(typeof P !== 'undefined'){
      updateMainHudEntity('hud-p', P, {
        statusSelector: '#hud-p-status',
        buffSelector: '#hud-p-buff'
      });
    }

    const botHud = document.getElementById('hud-bot');
    const hasDummy = typeof dummyOn !== 'undefined' && dummyOn && typeof D !== 'undefined' && !!D;
    if(botHud){
      botHud.style.opacity = hasDummy ? '1' : '0';
    }
    if(hasDummy){
      updateMainHudEntity('hud-b', D, {
        statusSelector: '#hud-b-status'
      });
      const manualSlot = D._manualControl && Number.isInteger(D._playerSlot) ? D._playerSlot : -1;
      setTextIfPresent('#hud-b-label', manualSlot >= 0 ? `PLAYER ${manualSlot + 1}` : t('hud.botLabel', 'BOT'));
      setTextIfPresent('#hud-b-phase', manualSlot >= 0 ? '' : botPhaseText(D));
    }

    const localPvp = typeof LocalPlayerControls !== 'undefined' && LocalPlayerControls.isLocalPvP();
    const slots = localPvp && Array.isArray(window.PLAYER_SLOTS) ? window.PLAYER_SLOTS : [];
    updateLocalSlotHud(document.getElementById('hud-player-3'), slots[2] && slots[2].source ? slots[2].entity : null);
    updateLocalSlotHud(document.getElementById('hud-player-4'), slots[3] && slots[3].source ? slots[3].entity : null);
  }

  window.updateHUD = updateHUD;
})();
