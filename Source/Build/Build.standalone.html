}
    if(Math.abs(w.angVel) < 0.004) w.angVel = 0;

    // ── Урон при попадании в кого-либо ──
    const flySpd = Math.hypot(w.vx, w.vy);
    if(!deflected && flySpd > 2.5 && !(GameTime < (w._noDamageUntil||0))){
      const candidates = [P, ...ALL_BOTS];
      for(const ent of candidates){
        if(!ent || ent.hp <= 0 || ent._awaitingReveal) continue;
        if(ent === w.owner && GameTime < (w.ownerImmuneUntil||0)) continue;
        const c = $.POS.body(ent);

        const d = Math.hypot(c.x - w.x, c.y - w.y);
        if(d < hitR){
          const wDefHit = WEAPON_TYPES[w.weaponType] || WEAPON_TYPES[0];
          const dmgBase = wDefHit.dmgBase != null ? wDefHit.dmgBase : 8;
          const dmgPerSpeed = wDefHit.dmgPerSpeed != null ? wDefHit.dmgPerSpeed : 6;
          const maxDmgPct = wDefHit.maxDmgPercent != null ? wDefHit.maxDmgPercent : 0.20;
          let dmg = Math.round(flySpd * dmgPerSpeed + dmgBase);
          
          if (isBot(w.owner) && (wDefHit.key==='spear' || wDefHit.key==='staff')) dmg = Math.round(dmg * 1.5);
          const _defScale = (isBot(ent) ? sv('cscl') * sv('botscale') : sv('cscl')) || 1;
          dmg = Math.round(dmg / _defScale);
          dmg = Math.min(dmg, Math.max(1, Math.round(MAX_HP * maxDmgPct)));
          
          applyDamage(ent, dmg, w.owner, {

          });
          
          const nx = d > 0.1 ? (c.x - w.x)/d : 0, ny = d > 0.1 ? (c.y - w.y)/d : -1;
          ent.vx += nx * 6; ent.vy += ny * 6;

          w.x = c.x - nx*hitR; w.y = c.y - ny*hitR;

          w._noDamageUntil = GameTime + 0.5;
          w._noPickupUntil = GameTime + 0.5;
          break;
        }
      }
    }

    if((w._noPickupUntil||0) > GameTime) continue;

    // ── Подбор оружия ──
    const candidates = [P, ...ALL_BOTS];
    let picked = false;
    for(const ent of candidates){
      if(!ent || ent.hp <= 0 || ent.hasWeapon !== false || ent._awaitingReveal) continue;
      if(ent === w.owner && GameTime < (w.ownerPickupBlockUntil||0)) continue;
      const c = $.POS.body(ent);
      if(Math.hypot(c.x - w.x, c.y - w.y) < PICKUP_R){

        DROPPED_WEAPONS.splice(i,1);
        picked = true;
        break;
      }
    }
    if(picked) continue;

}
// Брошенный/выбитый цеп — как и в руке, состоит из навершия + колец, но
// упрощённо: ВСЕГДА ровно 3 звена, и они "провисают" в сторону, откуда
// летит оружие (имитация того, что цепь при броске отстаёт по инерции) —
// каждое следующее звено (ближе к навершию) смещено сильнее предыдущего.
const DROPPED_FLAIL_RING_COUNT = 3;
const DROPPED_FLAIL_LAG_STEP = 4; // px смещения на звено (в локальных координатах)
function drawDroppedFlail(w, rot){
  const headImg  = w.img;
  const ring1Img = w.ring1Img;
  const ring2Img = w.ring2Img || ring1Img;
  const L = w.len || (SWORD_LEN * 0.7);
  const headLen = FLAIL_HEAD_LEN;

  const chainLen = Math.max(0, L - headLen);
  const ringLen = Math.max(FLAIL_RING_LEN, chainLen / DROPPED_FLAIL_RING_COUNT);

  // ✅ Исправлено: lagFactor вычисляется из скорости
  const spd = Math.hypot(w.vx||0, w.vy||0);
  let lagFactor = 0;
  if(spd > 0.3){
    const originAngle = Math.atan2(-(w.vy||0), -(w.vx||0));
    const lagDirLocalX = Math.cos(originAngle - rot);
    // Нормализуем lagFactor от -1 до 1
    lagFactor = $.M.clamp(lagDirLocalX * Math.min(1, spd/5), -1, 1);
  }
  
  // Провисание цепи (как в drawFlailSprite)
  const normalizedLag = $.M.clamp(lagFactor, -1, 1);
  const lagAmount = normalizedLag * 3; // макс 3px смещения

  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.rotate(rot);

  const totalH = L + headLen * 0.15;
  let cursor = totalH/2;
  
  // Рисуем кольца
  for(let i = 0; i < DROPPED_FLAIL_RING_COUNT; i++){
    const ringImg = (i % 2 === 0) ? ring1Img : ring2Img;
    const t = (i + 1) / DROPPED_FLAIL_RING_COUNT;
    const ringLag = lagAmount * t * 0.5;
    
    if(ringImg && ringImg.complete && ringImg.naturalWidth > 0){
      const rw = ringLen * spriteAspectFor(ringImg);
      ctx.drawImage(ringImg, -rw/2 + ringLag, cursor, rw, -ringLen);
    }
    cursor -= ringLen;
  }
  
  // Рисуем навершие
  if(headImg && headImg.complete && headImg.naturalWidth > 0){
    const hw = FLAIL_HEAD_LEN * spriteAspectFor(headImg);
    const headLag = lagAmount * 0.8;
    const extraOffset = -ringLen * 0.1;
    ctx.drawImage(headImg, -hw/2 + headLag, cursor + extraOffset, hw, -FLAIL_HEAD_LEN);
  }
  
  ctx.restore();
}

function drawDroppedWeapons(){
  for(const w of DROPPED_WEAPONS){
    const img = w.img || (w.url ? loadSpriteImage(w.url) : null);
    if(!img || !img.complete || img.naturalWidth <= 0) continue;
    const wDef = WEAPON_TYPES[w.weaponType] || WEAPON_TYPES[0];
    const rot = w.rot !== undefined ? w.rot : 0;
    if(wDef.key === 'flail'){
      drawDroppedFlail(w, rot);
      continue;
    }
    const L = w.len || (SWORD_LEN * (wDef.scale != null ? wDef.scale : 1));
    const isCenterGrip = CENTER_GRIP_CATEGORIES.includes(wDef.category);
    const weaponKey = wDef.key; // ← ключ оружия
    
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.rotate(rot);
    
    const width = L * spriteAspectFor(img);
    
    // ✅ Для копья — центр смещён к острию
    if(weaponKey === 'spear'){
      const gripOffset = L * 0.4;
      const totalH = L + gripOffset;
      // 🔥 СМЕЩАЕМ ТАК, ЧТОБЫ ВРАЩЕНИЕ БЫЛО ВОКРУГ ЦЕНТРА
      const centerOffset = totalH / 2 - gripOffset;
      ctx.drawImage(img, -width/2, -centerOffset*2, width, totalH);
    }
    else if(isCenterGrip){
      ctx.drawImage(img, -width/2, -L/2, width, L);
    } else {
      const hiltShift = L * SWORD_HILT_OFFSET;
      const totalH = L + hiltShift;
      ctx.drawImage(img, -width/2, -totalH/2, width, totalH);
    }
    
    ctx.restore();
  }
}

// ════════════════ END MODULE: SPRITES (loader part below in loadAudioDB) ════

// ┌─ SOUND_BLOCK: папки для каждого типа звука ─────────────────────────────
// ════════════════════════════════════════════════════════════════════════
// МОДУЛЬ ДАЛЬНЕГО БОЯ: Жезл (магия) и Арбалет (стрелы)
// ────────────────────────────────────────────────────────────────────────
// Самостоятельный блок поверх существующей боевой системы:
//  • Для этих 2 видов оружия ЛКМ полностью заменяет и обычный замах/флик,
//    и бафф ярости — вместо этого ЛКМ стреляет (см. правки в update()).
//  • Новый класс "снаряд" (PROJECTILES) — в отличие от DROPPED_WEAPONS его
//    нельзя подобрать; при попадании/затухании он лопается и пропадает.
//  • ИИ: арбалет держит дистанцию и стреляет издалека (кайтинг), жезл
//    циклически переключается между обычным ближним боем и "режимом
//    дальнего боя"; если противник подходит вплотную — жезл прерывает
//    дальний режим и уходит в обычный ближний бой.
//  • ПРИМЕЧАНИЕ ПО СЕТИ: как и обычные броски оружия (throwWeapon/
//    DROPPED_WEAPONS), которые сейчас тоже НЕ транслируются по NET_SYNC,
//    эта механика пока локальная — полноценно работает в бою с ботами и
//    оффлайн, но снаряды не реплицируются на второй клиент в PvP-дуэли.
// ════════════════════════════════════════════════════════════════════════

function weaponKeyOf(ent){
  const d = weaponDefFor(ent);
  return d ? d.key : null;
}
// Молот/посох/жезл/копьё/цеп — используют отдельные звуки взмаха и удара
// (HammerSwing / Damage/Hummer), а не стандартные звуки меча.
// ✅ Цеп добавлен в список: раньше звучал как меч (whoosh/damage), теперь
// звук кручения/удара цепа — как у молота (более тяжёлый, гулкий).
function isHeavySwingWeapon(ent){
  return $.IS(ent, 'hammer', 'staff', 'wand', 'spear', 'flail', 'halberd');
}
function isHeavySwingWeaponType(weaponTypeIdx){
  const d = WEAPON_TYPES[weaponTypeIdx];
  const k = d ? d.key : null;
  return $.ISK(k, 'hammer', 'staff', 'wand', 'spear', 'flail', 'halberd', 'magicstaff');
}
function isRangedWeapon(ent){
  return $.IS(ent, 'wand', 'crossbow', 'bow', 'magicstaff');
}

// Мировые координаты кончика оружия в руке entity (используется, чтобы
// магический снаряд жезла вылетал из наконечника, а не из центра тела).
function weaponTipPos(ent){
  const piv = $.POS.pivot(ent);
  const reach = weaponReach(ent) * sv('swlen') * (isBot(ent) ? sv('botswordscale') : 1);
  return { x: piv.x + Math.cos(ent.angle) * reach, y: piv.y + Math.sin(ent.angle) * reach };
}

<script>
// === bundled: src/combat/flail.js ===
// === src/combat/flail.js ===
// Extracted from Build.html; loaded as a classic script to preserve shared runtime state.
// LAYER: WEAPONS: FLAIL — модуль цепа (динамическая длина, инерция)
// Module file: flail.js
// ════════════════════════════════════════════════════════════════════════════

// Цеп рисуется из 3 частей: навершие (ent._weaponImg) на самом конце цепи +
// вереница колец (чередуя ent._flailRing1Img / _flailRing2Img), заполняющая
// расстояние от рукояти до навершия. Кольца — ФИКСИРОВАННОГО размера
// (вариант "А"): при удлинении цепи колец физически становится больше,
// при укорачивании — меньше (а не растягиваются/сжимаются как одна деталь).
const FLAIL_HEAD_LEN = 32;  // локальный размер навершия (увеличен в 2 раза)
const FLAIL_RING_LEN = 11;  // локальный размер одного звена цепи
const FLAIL_MAX_LAG_PX = 50; // макс. боковой "провис" цепи у самого кончика (в местных единицах, база до слайдера)

function drawFlailSprite(ctx2, ent, length, glowColor, glowBlur){
    if(glowColor){ ctx2.shadowColor = glowColor; ctx2.shadowBlur = glowBlur; }

    const headImg  = ent._weaponImg;       // кончик = навершие (из Tip/)
    const ring1Img = ent._flailRing1Img;   // кольцо 1 (из Ring/)
    const ring2Img = ent._flailRing2Img;   // кольцо 2 (из Ring/)

    // Длина цепи = общая длина - навершие
    const chainLen = Math.max(0, length - FLAIL_HEAD_LEN);
    const ringCount = Math.max(2, chainLen > 0 ? Math.floor(chainLen / FLAIL_RING_LEN) : 2);
    const actualRingLen = Math.max(FLAIL_RING_LEN, chainLen / ringCount);

    // Провисание
    const lagFactor = ent._flailLagVel != null ? ent._flailLagVel : (ent.vel || 0);
    const normalizedLag = $.M.clamp(lagFactor / (sv('swthresh') || 1), -1, 1);
    const lagAmount = normalizedLag * 3;

    const hiltShift = length * SWORD_HILT_OFFSET * 0.4;
    let cursor = hiltShift;

    // ── 1️⃣ СНАЧАЛА РИСУЕМ КОЛЬЦА ──
    for(let i = 0; i < ringCount; i++){
        const ringImg = (i % 2 === 0) ? ring1Img : ring2Img;
        const t = (i + 1) / ringCount;
        const ringLag = lagAmount * t * 0.5;
        
        if(ringImg && ringImg.complete && ringImg.naturalWidth > 0){
            const rw = actualRingLen * spriteAspectFor(ringImg);
            ctx2.drawImage(ringImg, -rw/2 + ringLag, cursor, rw, -actualRingLen);
        }
        cursor -= actualRingLen;
    }
    
    // ── 2️⃣ ПОТОМ КОНЧИК В КОНЦЕ (ПОСЛЕ КОЛЕЦ) ──
    if(headImg && headImg.complete && headImg.naturalWidth > 0){
        const hw = FLAIL_HEAD_LEN * spriteAspectFor(headImg);
        const headLag = lagAmount * 0.9; // сильнее провисание на конце
        ctx2.drawImage(headImg, -hw/2 + headLag, cursor + 2, hw, -FLAIL_HEAD_LEN);
    }
    
    ctx2.shadowBlur = 0;
}

// Возвращает длину клинка для рендера с учётом масштаба вида оружия
// ── МОДУЛЬ ЦЕПА (flail): динамическая длина цепи ────────────────────────────
// Длина цепи не статична — она "разматывается" от скорости вращения оружия
// (ent.vel — та же угловая скорость замаха, что используется для урона мечом).
// FLAIL_MIN_SCALE — цепь сложена (длина как у кинжала, scale=0.4);
// FLAIL_MAX_SCALE — цепь полностью раскручена (длиннее огромного меча).
const FLAIL_MIN_SCALE = 0.4;
// ✅ Увеличено в 1.4 раза (было 2.2) — цеп на полном раскруте теперь достаёт
// заметно дальше.
const FLAIL_MAX_SCALE = 2.2 * 1.4; // = 3.08
// Насколько плавно pFlailExt/bFlailExt едет к целевому значению — не мгновенно,
// но достаточно отзывчиво, чтобы цепь ощутимо реагировала на скорость замаха
// (параметр в том же формате, что и у lerpDT в других местах файла: 0..1).
// ✅ Понижено (было 0.35) — растягивание цепи ощущалось слишком быстрым/резким.
const FLAIL_EXT_SMOOTH_RATE = 0.22;
// ✅ У бота цепь растягивалась ЕЩЁ быстрее, чем у игрока (bot.vel быстро выходит
// на целевую величину через свой отдельный lerp в updateDummy/updateBotAI до
// того, как попадёт сюда) — принудительно замедляем растяжение у бота до 0.7
// от скорости игрока, чтобы бот не раскручивался быстрее/резче игрока.
const FLAIL_EXT_BOT_MULT = 0.7;

const FLAIL_MAX_EXT_TRIGGER = 0.97; // порог, при котором считаем "цепь раскручена до конца"
const FLAIL_STAM_BONUS = 50;
const FLAIL_STAM_BONUS_CD = 3; // сек

// ── Инерция цепи при остановке/развороте вращения ───────────────────────────
// Раньше цепь можно было остановить мгновенно: как только vel падал/менял
// знак, target для _flailExt тут же обрушивался, и цепь (визуально) сжималась
// обратно почти как прямая палка. Физически цепь должна ещё какое-то время
// докручиваться по инерции, продолжая уменьшаться САМА, а не по новому
// управляющему вводу — и в это время игрок/бот не должен иметь возможность
// снова мгновенно раскрутить или остановить её через ввод (контроль вращений
// временно отбирается). Срабатывает только если цепь была раскручена больше
// чем на FLAIL_INERTIA_RING_TRIGGER звеньев — на коротком, почти сложенном
// цепе инерция не нужна и всё работает как раньше.
const FLAIL_INERTIA_RING_TRIGGER = 3;
const FLAIL_INERTIA_LOCK_TIME = 0.55; // сек — на столько отбирается контроль вращений цепи
const FLAIL_INERTIA_DECAY = 0.93;     // затухание _flailExt во время инерции (ближе к 1 = дольше крутится)

// Сколько звеньев цепи соответствует данному значению ext — используется,
// чтобы синхронно с drawFlailSprite решить, "раскручена ли цепь больше 3 звеньев".
function flailRingCountForExt(ext){
  const scale = FLAIL_MIN_SCALE + (FLAIL_MAX_SCALE - FLAIL_MIN_SCALE) * $.M.clamp(ext || 0, 0, 1);
  const length = SWORD_LEN * scale;
  const chainLen = Math.max(0, length - FLAIL_HEAD_LEN);
  return Math.max(2, chainLen > 0 ? Math.round(chainLen / FLAIL_RING_LEN) : 2);
}






// ── МОДУЛЬ ЦЕПА: ЕДИНАЯ механика — используется и для игрока, и для ЛЮБОГО
// бота через одну и ту же функцию (раньше у бота была отдельная, более
// простая логика растяжения — из-за этого поведение отличалось от игрока).
// targetAng — угол на цель (курсор у игрока / положение противника у бота),
// rawDt — РЕАЛЬНАЯ дельта кадра (не фиксированный физический тик).

function updateFlailSwing(ent, targetAng, rawDt){
    // ⚠️ КОНСТАНТЫ В САМОМ НАЧАЛЕ
    // ⚠️ КОНСТАНТЫ В САМОМ НАЧАЛЕ
    const FLAIL_GROW_MIN_ANGLE = isBot(ent) ? 0.15 : 0.65; // +0.1 для игрока
    const FLAIL_GROW_MIN_SPEED = isBot(ent) ? 0.4 : 1.8;   // +0.2 для игрока
    
    if (ent._flailState === undefined) {
        ent._flailState = 'FOLLOW';
        ent._flailExt = 0;
        ent._flailSpinSpeed = 0;
        ent._flailDirection = 1;
        ent._flailFreeAngle = ent.angle;
        ent._flailPrevCursorAngle = targetAng;
        ent._flailTimeInState = 0;
        ent._flailAccumAngle = 0;
        ent._flailAccumDir = 0;
        ent._flailPrevAngle = ent.angle;
        ent._flailWasAtMax = false;
    }

    const cursorDelta = $.M.angDiff(targetAng, ent._flailPrevCursorAngle || targetAng);
    ent._flailPrevCursorAngle = targetAng;

    const MAX_CURSOR_DELTA = 0.5;
    const clampedDelta = $.M.clamp(cursorDelta, -MAX_CURSOR_DELTA, MAX_CURSOR_DELTA);

    const isMouseMoving = Math.abs(clampedDelta) > 0.005;
    const mouseSpeed = Math.abs(clampedDelta) / Math.max(rawDt, 0.001);
    const mouseDirection = Math.sign(clampedDelta) || 1;

    // ── Накопитель устойчивого вращения ──
    if (isMouseMoving) {
        // ДЛЯ БОТОВ: ускоряем накопление в 3 раза
        const accumMult = isBot(ent) ? 3.0 : 2.0;
        if (ent._flailAccumDir === 0 || mouseDirection === ent._flailAccumDir) {
            ent._flailAccumAngle = (ent._flailAccumAngle || 0) + Math.abs(clampedDelta) * accumMult;
        } else {
            ent._flailAccumAngle = Math.abs(clampedDelta) * accumMult;
        }
        ent._flailAccumDir = mouseDirection;
    } else {
        ent._flailAccumAngle = Math.max(0, (ent._flailAccumAngle || 0) - 2.0 * rawDt);
        if (ent._flailAccumAngle <= 0) ent._flailAccumDir = 0;
    }

    // БОТЫ: принудительно считаем, что они всегда "двигают курсор"
    const isRealSpin = isMouseMoving
        && (mouseSpeed > FLAIL_GROW_MIN_SPEED || isBot(ent))
        && (ent._flailAccumAngle >= FLAIL_GROW_MIN_ANGLE || (isBot(ent) && ent._flailAccumAngle > 0.01));

    const chainLen = Math.max(0, weaponLenFor(ent) - FLAIL_HEAD_LEN);
    const ringCount = Math.max(2, chainLen > 0 ? Math.floor(chainLen / FLAIL_RING_LEN) : 2);
    const isShort = ringCount <= 4;
    const isLong = ringCount > 4;

    const directionChanged = isMouseMoving && mouseDirection !== ent._flailDirection;

    // ── СОСТОЯНИЕ 1: FOLLOW ──
       if (ent._flailState === 'FOLLOW') {
        // Если мы в процессе плавного поворота - не вмешиваемся
        if (!ent._flailIsLerping) {
            ent.angle = $.M.angLerpDT(ent.angle, targetAng, 0.25, rawDt);
        }
        if (isRealSpin && isLong) {
            ent._flailState = 'SPIN';
            ent._flailFreeAngle = ent.angle;
            ent._flailDirection = mouseDirection;
            ent._flailSpinSpeed = Math.min(5.0, mouseSpeed * 0.8);
            // Боты получают бонусную скорость
            if(isBot(ent)) ent._flailSpinSpeed = Math.min(5.0, ent._flailSpinSpeed * 1.5);
            // Сбрасываем lerp если начали вращение
            ent._flailIsLerping = false;
        } else if (isRealSpin) {
            ent._flailExt = Math.min(1, ent._flailExt + 0.5 * rawDt);
            ent._flailIsLerping = false;
        } else {
            ent._flailExt = Math.max(0, ent._flailExt - 1.5 * rawDt);
        }
    }

    // ── СОСТОЯНИЕ 2: SPIN ──
        if (ent._flailState === 'SPIN') {
        if (isMouseMoving && mouseDirection === ent._flailDirection) {
            const targetSpeed = Math.min(5.0, mouseSpeed * 0.8);
            const speedDiff = targetSpeed - ent._flailSpinSpeed;
            ent._flailSpinSpeed += speedDiff * Math.min(1, 4.0 * rawDt);
            ent._flailSpinSpeed = Math.min(5.0, ent._flailSpinSpeed);
        }
        if (directionChanged || !isMouseMoving) {
            // 🌀 ПЛАВНЫЙ ПЕРЕХОД В RETRACT (сохраняем скорость)
            ent._flailState = 'RETRACT';
            ent._flailTimeInState = 0;
            // НЕ ОБНУЛЯЕМ ent._flailSpinSpeed!
        }
        ent._flailFreeAngle += ent._flailDirection * ent._flailSpinSpeed * 1.5 * rawDt;
        ent.angle = ent._flailFreeAngle;
        ent._flailExt = Math.min(1, ent._flailExt + 0.1 * rawDt);
    }

    // ── СОСТОЯНИЕ 3: RETRACT ──
    if (ent._flailState === 'RETRACT') {
        // 🔄 ПРОВЕРЯЕМ: если игрок снова начал крутить - переходим обратно в SPIN
        // НО с более высоким порогом, чтобы цепь не дёргалась от малейшего движения!
        const RESUME_MIN_ANGLE = isBot(ent) ? 0.05 : 0.35; // Для игрока нужно накопить 0.35 рад (20°)
        const RESUME_MIN_SPEED = isBot(ent) ? 0.2 : 1.2;   // И скорость должна быть выше
        
        const isSpinningAgain = isMouseMoving && 
            mouseSpeed > RESUME_MIN_SPEED &&
            ent._flailAccumAngle >= RESUME_MIN_ANGLE &&
            isLong &&
            ent._flailExt > 0.05; // Не переходить если цепь уже почти скрутилась
        
        if (isSpinningAgain) {
            // Возобновляем вращение, но с плавным набором скорости
            ent._flailState = 'SPIN';
            ent._flailDirection = mouseDirection;
            // Скорость растёт плавно от текущей, а не резко
            const targetSpinSpeed = Math.min(5.0, mouseSpeed * 0.6);
            ent._flailSpinSpeed = ent._flailSpinSpeed * 0.6 + targetSpinSpeed * 0.4;
            ent._flailFreeAngle = ent.angle;
            ent._flailIsLerping = false;
            // Сбрасываем накопленный угол, чтобы не было мгновенного повторного перехода
            ent._flailAccumAngle = 0;
            // Не уменьшаем _flailExt дальше
            return;
        }
        
        // ⚡ ВРАЩЕНИЕ ПРОДОЛЖАЕТСЯ (инерция) - НЕ ЗАТУХАЕТ, ПОКА ЦЕПЬ НЕ СКРУТИТСЯ
        ent._flailFreeAngle += ent._flailDirection * ent._flailSpinSpeed * 1.5 * rawDt;
        ent.angle = ent._flailFreeAngle;
        
        // Медленное скручивание цепи
        ent._flailExt = Math.max(0, ent._flailExt - 0.84 * rawDt);
        
        // Когда цепь полностью скрутилась - начинаем плавный поворот к курсору
        if (ent._flailExt <= 0) {
            ent._flailState = 'FOLLOW';
            // Сохраняем текущий угол для плавного перехода
            const currentAngle = ent.angle;
            ent._flailSpinSpeed = 0;
            
            // Запоминаем угол, с которого начинаем lerp
            ent._flailLerpStartAngle = currentAngle;
            ent._flailLerpTargetAngle = targetAng;
            ent._flailLerpTimer = 0;
            ent._flailLerpDuration = 1.0; // 1 секунда на плавный поворот
            ent._flailIsLerping = true;
        }
    }
    // ── ПЛАВНЫЙ LERP ПОСЛЕ СКРУЧИВАНИЯ ──
    if (ent._flailIsLerping) {
        ent._flailLerpTimer += rawDt;
        const progress = Math.min(1, ent._flailLerpTimer / ent._flailLerpDuration);
        
        // Плавный переход (ease-in-out)
        const eased = progress < 0.5 
            ? 2 * progress * progress 
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        
        // Интерполируем угол
        let diff = $.M.angDiff(ent._flailLerpTargetAngle, ent._flailLerpStartAngle);
        ent.angle = ent._flailLerpStartAngle + diff * eased;
        
        // Завершили lerp
        if (progress >= 1) {
            ent._flailIsLerping = false;
            ent.angle = ent._flailLerpTargetAngle;
        }
    }

    // ── Угловая скорость ──
    if (ent._flailPrevAngle !== undefined && ent._flailPrevAngle !== null) {
        const MAX_ANGLE_STEP = 8 * rawDt;
        const rawStep = $.M.angDiff(ent.angle, ent._flailPrevAngle);
        const clampedStep = Math.max(-MAX_ANGLE_STEP, Math.min(MAX_ANGLE_STEP, rawStep));
        ent.angle = ent._flailPrevAngle + clampedStep;
    }
    const realAngVel = (ent._flailPrevAngle !== undefined && ent._flailPrevAngle !== null)
        ? $.M.angDiff(ent.angle, ent._flailPrevAngle) / Math.max(rawDt, 0.004)
        : 0;
    ent._flailPrevAngle = ent.angle;
    ent.vel = realAngVel;
    ent._flailLagVel = ent.vel;

    // ── Бонус стамины за полную раскрутку ──
    const atMax = ent._flailExt >= FLAIL_MAX_EXT_TRIGGER;
    if (atMax && !ent._flailWasAtMax && GameTime >= (ent._flailStamCD||0)) {
        ent.stamina = Math.min(ent.stamMax||100, (ent.stamina||0) + FLAIL_STAM_BONUS);
        ent._flailStamCD = GameTime + FLAIL_STAM_BONUS_CD;
        const c = $.POS.body(ent);
        $.FX.hit({x:c.x, y:c.y-40, t:'⚡ РАЗГОН!', life:35, big:false, col:'#ffdd44'});
    }
    ent._flailWasAtMax = atMax;
}













// Сброс состояния цепа при смене оружия на НЕ-цеп — чтобы при повторном
// взятии цепа состояние стартовало заново с FOLLOW, а не "зависало".
function updateFlailExtension(ent, dt){
  if(!ent) return;
  if(weaponKeyOf(ent) !== 'flail'){
    ent._flailExt = 0;
    ent._flailState = undefined;
    ent._flailWasAtMax = false;
  }
}





// Текущий эффективный "scale" цепа — заменяет статичное def.scale из таблицы.
function flailScaleFor(ent){
  const ext = $.M.clamp(ent._flailExt || 0, 0, 1);
  return FLAIL_MIN_SCALE + (FLAIL_MAX_SCALE - FLAIL_MIN_SCALE) * ext;
}

    const angle = Math.random() * Math.PI * 2;
    const dist = radius * (0.6 + Math.random() * 0.4);
    const speed = 0.5 + progress * 1.5;
    
    // Particle starts near center and drifts outward
    const outwardAngle = angle;
    const vx = Math.cos(outwardAngle) * speed * (0.3 + Math.random() * 0.3);
    const vy = Math.sin(outwardAngle) * speed * (0.3 + Math.random() * 0.3);
    
    MAGICSTAFF_CHARGE_FX.push({
      x: c.x + Math.cos(angle) * dist * 0.1,
      y: c.y + Math.sin(angle) * dist * 0.1 - 10,
      vx: vx,
      vy: vy,
      life: 1,
      maxLife: 0.6 + progress * 0.4 + Math.random() * 0.3,
      r: 1.5 + progress * 3 + Math.random() * 2,
      alpha: 0.3 + progress * 0.5,
      targetX: c.x + Math.cos(angle) * dist,
      targetY: c.y + Math.sin(angle) * dist - 10,
      type: 'charge'
    });
  }
}


function drawMagicStaffChargeFX(){
  // Update existing particles
  for(const p of MAGICSTAFF_CHARGE_FX){
    if(p.targetX !== undefined && p.targetY !== undefined){
      p.x += (p.targetX - p.x) * 0.05;
      p.y += (p.targetY - p.y) * 0.05;
    }
    if(p.vx !== undefined && p.vy !== undefined){
      p.x += p.vx * 0.05;
      p.y += p.vy * 0.05;
    }
    p.life -= 0.02;
    p.alpha *= 0.995;
  }
  
  // Filter out dead particles
  MAGICSTAFF_CHARGE_FX = MAGICSTAFF_CHARGE_FX.filter(p => {
    return p.life > 0 && 
           p.alpha > 0.01 && 
           isFinite(p.x) && 
           isFinite(p.y) && 
           isFinite(p.r) &&
           p.r > 0;
  });
  
  // Draw all particles
  for(const p of MAGICSTAFF_CHARGE_FX){
    const a = p.life * p.alpha;
    if(a < 0.01) continue;
    
    // Safety check for invalid values
    if(!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.r) || p.r <= 0) continue;
    
    ctx.save();
    ctx.globalAlpha = a * 0.8;
    
    // Glow with radius
    const radius = Math.max(1, p.r * 2); // Ensure positive radius
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
    
    if(p.type === 'particle'){
      grad.addColorStop(0, `rgba(180, 230, 255, ${a * 0.9})`);
      grad.addColorStop(0.3, `rgba(120, 200, 255, ${a * 0.6})`);
      grad.addColorStop(1, `rgba(60, 150, 255, 0)`);
    } else if(p.type === 'explosion'){
      grad.addColorStop(0, `rgba(255, 230, 200, ${a * 0.9})`);
      grad.addColorStop(0.3, `rgba(255, 200, 150, ${a * 0.6})`);
      grad.addColorStop(1, `rgba(200, 150, 100, 0)`);
    } else if(p.type === 'wave'){
      grad.addColorStop(0, `rgba(200, 240, 255, ${a * 0.8})`);
      grad.addColorStop(0.5, `rgba(150, 220, 255, ${a * 0.4})`);
      grad.addColorStop(1, `rgba(80, 180, 255, 0)`);
    } else {
      grad.addColorStop(0, `rgba(100, 200, 255, ${a * 0.9})`);
      grad.addColorStop(0.3, `rgba(80, 180, 255, ${a * 0.6})`);
      grad.addColorStop(1, `rgba(40, 120, 255, 0)`);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Bright core
    ctx.shadowColor = 'rgba(200, 240, 255, 0.5)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = `rgba(255, 255, 255, ${a * 0.7})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1, p.r * 0.4), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.restore();
  }
}

// ••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
function applyDamage(defender, damage, attacker, options){
const dC2 = $.POS.body(defender);

  if(!defender || defender.hp <= 0) return;
  if(typeof FactionRules!=='undefined'){
    if(!FactionRules.canDamage(attacker,defender)) return;
    FactionRules.contact(attacker,defender);
  }

  if(damage <= 0) return;
  if(defender._hitCD !== undefined && defender._hitCD >= GameTime) return;
// ─── OPTIONS ───
  const opts = options || {};
  const isMagic = opts.isMagic || false;

  const isExplosion = opts.isExplosion || false;
  const isProjectile = opts.isProjectile || false;
 
  const knockbackMult = opts.knockbackMult || 1.0;
  const hitstopFrames = opts.hitstopFrames || 4;

  const shakePower = opts.shakePower || (damage > 15 ? 5 : 3);
  const textColor = opts.textColor || '#ff4040';
  const bloodCount = opts.bloodCount || 8;
  const textSuffix = opts.textSuffix || '';
 
  const spawnLightning = opts.spawnLightning || null;
  const playSoundOpt = opts.playSound !== undefined ? opts.playSound : true;

  // ─── DAMAGE APPLICATION ───
  const finalDmg = Math.min(damage, Math.max(1, Math.round(MAX_HP * 0.70))); // 70% max per hit
  defender.hp = Math.max(0, defender.hp - finalDmg);
  defender._hitCD = Math.max(defender._hitCD || -1, GameTime + 0.4);
  defender.hitFlash = GameTime + 0.3;
  defender._healthBarUntil = GameTime + 3;
  if(attacker) attacker._healthBarUntil = GameTime + 3;

  // ─── LIGHTNING EFFECT ───
  if(spawnLightning && typeof spawnLightningHit === 'function'){
    const dC = $.POS.body(defender);
    spawnLightningHit(
      spawnLightning.fromX, 
      spawnLightning.fromY, 
      dC.x, 
      dC.y, 
      spawnLightning.intensity
    );
  }

  // ─── KNOCKBACK ───
  if(attacker && knockbackMult > 0){
    const aC = $.POS.body(attacker);
    const dC = $.POS.body(defender);
    const dx = dC.x - aC.x;
    const dy = dC.y - aC.y;
    const len = Math.hypot(dx, dy) || 1;
    const kb = sv('bodyKB') * 0.5 * knockbackMult;
    defender.vx += (dx / len) * kb;
    defender.vy += (dy / len) * kb;
  }
  

  
  // ─── BLOOD ───

  for(let i = 0; i < bloodCount; i++){
    const angle = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 6;
    if(typeof spawnBlood === 'function'){
      spawnBlood(
        dC2.x + (Math.random() - 0.5) * 20,
        dC2.y + (Math.random() - 0.5) * 20,
        Math.cos(angle) * spd,
        Math.sin(angle) * spd
      );
    }
  }
  
  // ─── BLOOD POOL ───
  if(typeof spawnBloodPool === 'function'){
    spawnBloodPool(dC2.x, dC2.y, finalDmg);
  }
  
  // ─── DAMAGE TEXT ───
  let label = '-' + finalDmg;
  if(isMagic) label += ' ✨';
  if(isExplosion) label += ' 💥';
  if(isProjectile) label += ' ➹';
  if(textSuffix) label += ' ' + textSuffix;
  
  $.FX.hit({
    x: dC2.x,
    y: dC2.y - 35 - (Math.random() - 0.5) * 8, // slight vertical randomness
    t: label,
    life: 45,
    big: finalDmg > 15,
    col: textColor
  });
  
  // ─── HITSTOP ───
  if(typeof triggerHitstop === 'function'){
    triggerHitstop(hitstopFrames, shakePower);
  }
  
  // ─── SOUND ───
  if(playSoundOpt !== false){
    if(isMagic || isExplosion){
      $.S.play('magicHit');
      if(finalDmg > 30) $.S.play('clashHard');
    } else if(isProjectile){
      $.S.play('arrowHit');
    } else {
      $.S.play(isHeavySwingWeapon(attacker) ? 'damageHammer' : 'damage');
    }
  }
  
  // ─── DEATH ───
  if(defender.hp <= 0){
    if(typeof handleCombatDeath === 'function') handleCombatDeath(defender);
  }
}

// Creates wood splinters and feather fragments when an arrow is blocked.
let ARROW_SHATTER_FX = []; // {x,y,vx,vy,life,maxLife,rot,rotSpd,len,kind}
function spawnArrowShatter(x, y, incomingAngle){
  const n = 7;
  const backAngle = incomingAngle + Math.PI; // opposite to incoming trajectory
  for(let i = 0; i < n; i++){
    const spread = (Math.random()-0.5) * 1.8; // wider spread, not too focused backwards
    const a = backAngle + spread;
    const spd = 1.5 + Math.random()*3.5;
    const isFeather = i < 2; // the first two are feathers (lighter)
    ARROW_SHATTER_FX.push({
      x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 1, // slight upward bias for visual variety
      life: 1, maxLife: 1,
      rot: Math.random()*Math.PI*2, rotSpd: (Math.random()-0.5)*10,
      len: isFeather ? 5+Math.random()*3 : 8+Math.random()*8,
      kind: isFeather ? 'feather' : 'shaft',
    });
  }
}
function updateArrowShatterFX(dt){
  for(let i = ARROW_SHATTER_FX.length-1; i >= 0; i--){
    const p = ARROW_SHATTER_FX[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += dt*9; // gravity, pulling fragments down
    p.vx *= 0.96; p.vy *= 0.98;
    p.rot += p.rotSpd*dt;
    p.life -= dt*1.8;
    if(p.life <= 0) ARROW_SHATTER_FX.splice(i,1);
  }
}
function drawArrowShatterFX(){
  for(const p of ARROW_SHATTER_FX){
    const a = $.M.clamp(p.life / p.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if(p.kind === 'feather'){
      ctx.fillStyle = '#e8d9b8';
      ctx.fillRect(-p.len/2, -1.5, p.len, 3);
    } else {
      ctx.strokeStyle = '#8a5a30';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-p.len/2,0); ctx.lineTo(p.len/2,0); ctx.stroke();
    }
    ctx.restore();
  }
}

// Plays a reload sound when the weapon is ready to fire again (GameTime >= _rangedShotCD)
// and prevents spamming by using _reloadSoundPlayed flag.
function updateCrossbowReloadSound(ent){
  const key = weaponKeyOf(ent);
  if(key !== 'crossbow' && key !== 'bow') return;
  if(ent._reloadSoundPlayed) return;
  if(ent._rangedShotCD == null) return;
  if(GameTime >= ent._rangedShotCD){
    if(key === 'crossbow') {
      $.S.play('crossbowReload');
    } else if(key === 'bow') {
      $.S.play('bowReload');
    }
    ent._reloadSoundPlayed = true;
  }
}

// ─── PROJECTILES UPDATE ────────────────────────────────────────────────────
// Updates all projectiles: movement, blocking by blade/shield, damage to entities.
function updateProjectiles(dt){
  const step = $.M.step(dt);
  const BOUND_L = 40, BOUND_R = W-80, BOUND_T = 40, BOUND_B = H-40;
  for(let i = PROJECTILES.length-1; i >= 0; i--){
    const w = PROJECTILES[i];
    w.x += w.vx*step; w.y += w.vy*step;

    // ─── OUT OF BOUNDS OR TOO OLD ───
    if(w.x < BOUND_L-60 || w.x > BOUND_R+60 || w.y < BOUND_T-60 || w.y > BOUND_B+60 || (GameTime - w.bornAt) > 3.0){
      PROJECTILES.splice(i,1); continue;
    }

    // ─── ARROW DRAG & FADE ──────────────────────────────────────────────
    if(w.kind === 'arrow'){
      w.vx = $.M.decay(w.vx, 0.996, dt/2);
      w.vy = $.M.decay(w.vy, 0.996, dt/2);
      if(Math.hypot(w.vx,w.vy) < CROSSBOW_PROJ_SPEED*0.35){
        w.fade = (w.fade!=null ? w.fade : 1) - dt*1.5;
        if(w.fade <= 0){ PROJECTILES.splice(i,1); continue; }
      }
    }

    // ─── BLOCK CHECK (blade/shield) ─────────────────────────────────────
    let blocked = false, blockedByBlade = false, blockedByShield = false, blocker = null;
    const defenders = [P, ...ALL_BOTS];
    const wSpd = Math.hypot(w.vx, w.vy);
    const wPrevX = w.x - w.vx, wPrevY = w.y - w.vy;
    
    for(const ent of defenders){
      if(!ent || ent.hp <= 0 || ent._awaitingReveal) continue;
      if(ent === w.owner && GameTime < w.ownerImmuneUntil) continue;
      
      // ─── BLADE BLOCK ──────────────────────────────────────────────────
      if(ent.hasWeapon !== false && !isExhausted(ent)){
        const piv = $.POS.pivot(ent);
        const reach = weaponReach(ent) * sv('swlen') * (isBot(ent)?sv('botswordscale'):1);
        const tipX = piv.x + Math.cos(ent.angle)*reach, tipY = piv.y + Math.sin(ent.angle)*reach;
        // Use 'tip' collision only for weapons where the blade is only at the tip
        // (e.g., spear) — otherwise use full blade length.
        const isTipOnly = weaponCollisionType(ent) === 'tip';
        const segStartX = isTipOnly ? (piv.x + (tipX-piv.x)*0.7) : piv.x;
        const segStartY = isTipOnly ? (piv.y + (tipY-piv.y)*0.7) : piv.y;
        const segDX=tipX-segStartX, segDY=tipY-segStartY, segL2=segDX*segDX+segDY*segDY||1;
        // Calculate distance from projectile to blade segment, with thickness.
        // For 'tip' weapons, only the tip area blocks projectiles.
        let BLOCK_R = 14;
        if(w.kind === 'wand') BLOCK_R = 28;
        else if(w.kind === 'arrow' && isTipOnly) BLOCK_R = 7;
        
        const t = $.M.clamp(((w.x-segStartX)*segDX+(w.y-segStartY)*segDY)/segL2, 0, 1);
        const nearX=segStartX+t*segDX, nearY=segStartY+t*segDY;
        let hitBlade = Math.hypot(w.x-nearX, w.y-nearY) < BLOCK_R;
        
        if(!hitBlade && wSpd > BLOCK_R){
          const t2 = $.M.clamp(((segStartX-wPrevX)*w.vx+(segStartY-wPrevY)*w.vy)/(wSpd*wSpd||1), 0, 1);
          const nearPathX = wPrevX + w.vx*t2, nearPathY = wPrevY + w.vy*t2;
          const t3 = $.M.clamp(((nearPathX-segStartX)*segDX+(nearPathY-segStartY)*segDY)/segL2, 0, 1);
          const bladeX2 = segStartX+t3*segDX, bladeY2 = segStartY+t3*segDY;
          if(Math.hypot(nearPathX-bladeX2, nearPathY-bladeY2) < BLOCK_R) hitBlade = true;
        }
        if(hitBlade){ blocked = true; blockedByBlade = true; blocker = ent; break; }
      }
      
      // ─── SHIELD BLOCK ──────────────────────────────────────────────────
      if(typeof shieldHeld === 'function' && shieldHeld(ent) && ent._shieldSide !== undefined){
        const shc = $.POS.body(ent);
        const scx = shc.x + ent._shieldSide*20*0.9, scy = shc.y + Math.sin(ent.angle)*14;
        const halfW=(ent._shieldW||20)/2, halfH=(ent._shieldH||30)/2;
        if(Math.abs(w.x-scx)<halfW+12 && Math.abs(w.y-scy)<halfH+12){
          blocked = true;
          blockedByShield = true;
          blocker = ent;
          applyShieldBlockFX(w.x, w.y, null, blocker, {waveAngle: Math.atan2(w.vy, w.vx), hitstopMag:0});
          break;
        }
      }
    }
    
    if(blocked){
      // ─── STAMINA COST FOR BLOCKING ─────────────────────────────────
      const staminaTarget = w.owner || blocker;
      if(staminaTarget){
        const projStamCost = blockStaminaCost(staminaTarget, true);
        drainStamina(staminaTarget, projStamCost);
if(staminaTarget.stamina <= 0 && !isExhausted(staminaTarget)){
  applyExhaust(staminaTarget);
}
      }
      $.S.play(w.kind==='wand' ? 'magicHit' : 'arrowHit');
      if(blockedByBlade){
        const flySpdAtBlock = Math.hypot(w.vx, w.vy);
        const strongHit = flySpdAtBlock > 6;
        $.FX.hit({x:w.x, y:w.y-8, t:'⚔', life:18, big:strongHit, col:'#ffdd88'});
        $.S.play(strongHit ? 'clashHard' : 'clash');
        if(typeof triggerHitstop === 'function') triggerHitstop(strongHit?3:2, strongHit?3:1.5);
        if(blocker) addRage(blocker, clashRageGain());
      } else {
        $.FX.hit({x:w.x,y:w.y-8,t:'⚔',life:16,big:false,col:'#ffdd88'});
        if(typeof triggerHitstop === 'function') triggerHitstop(2,2);
      }
      if(w.kind === 'wand'){
        spawnWandExplosion(w.x, w.y);
      } else {
        spawnArrowShatter(w.x, w.y, w.rot);
      }
      PROJECTILES.splice(i,1); continue;
    }

    // ─── HIT CHECK ──────────────────────────────────────────────────────
    let hit = false;
    for(const ent of defenders){
      if(!ent || ent.hp <= 0 || ent._awaitingReveal) continue;
      if(ent === w.owner && GameTime < w.ownerImmuneUntil) continue;
      const c = $.POS.body(ent);
      const hitR = 22 * (isBot(ent) ? sv('cscl')*sv('botscale') : sv('cscl'));
      const d = Math.hypot(c.x-w.x, c.y-w.y);
      if(d < hitR){
        // ─── BOT DODGE ─────────────────────────────────────────────────
        if(isBot(ent) && (!ent._aiState || ent._aiState.enabled !== false)){
          if(!w._dodgeRolled) w._dodgeRolled = new Set();
          if(!w._dodgeRolled.has(ent)){
            w._dodgeRolled.add(ent);
            if(Math.random() < PROJECTILE_DODGE_CHANCE){
              const dodgeDir = Math.random() < 0.5 ? -1 : 1;
              const perpX = -Math.sin(w.rot)*dodgeDir, perpY = Math.cos(w.rot)*dodgeDir;
              ent.vx += perpX*4; ent.vy += perpY*4;
              $.FX.hit({x:c.x, y:c.y-20, t:(window.I18N ? window.I18N.t('ranged.botDodge') : 'DODGE!'), life:30, big:false, col:'#8fd6ff'});
              continue;
            }
          }
        }
        
        // ─── DAMAGE CAP ──────────────────────────────────────────────────
        const maxPct = w.maxDmgPct || (w.kind === 'wand' ? WAND_MAX_DMG_PCT : CROSSBOW_MAX_DMG_PCT);
        let dmg = Math.round(w.dmg);
        dmg = Math.min(dmg, Math.max(1, Math.round(MAX_HP*maxPct)));
        
        // ─── LIGHTNING EFFECT ──────────────────────────────────────────
        if(w.kind === 'wand' && w.shooterPos){
          const intensity = Math.min(1, (w.dmg || 10) / 30);
          spawnLightningHit(w.shooterPos.x, w.shooterPos.y, c.x, c.y, intensity);
        }
        
        // ••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
        // ─── UNIFIED applyDamage CALL ───
        // ••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
        const isMagic = w.kind === 'wand';
        
        applyDamage(ent, dmg, w.owner, {
          isMagic: isMagic,
          isProjectile: true,
          knockbackMult: isMagic ? 1.5 : 1.0,
          hitstopFrames: isMagic ? 5 : 3,
          shakePower: dmg > 15 ? (isMagic ? 6 : 4) : 3,
          textColor: isMagic ? '#c090ff' : '#ff8844',
          textSuffix: isMagic ? '✨' : '➹',
          bloodCount: isMagic ? 6 : 4,
          playSound: false
        });
        
        // ─── EXTRA KNOCKBACK ───────────────────────────────────────────
        const nx = d>0.1?(c.x-w.x)/d:0, ny = d>0.1?(c.y-w.y)/d:-1;
        const kb = w.kind==='wand' ? 14 : 8;
        ent.x += nx*kb*0.7; ent.y += ny*kb*0.7;
        
        // ─── EXPLOSION EFFECT ─────────────────────────────────────────
        if(w.kind === 'wand') spawnWandExplosion(w.x, w.y);
        
        // ─── SOUND ─────────────────────────────────────────────────────
        $.S.play(w.kind==='wand' ? 'magicHit' : 'arrowHit');
        
        hit = true; break;
      }
    }
    if(hit){ PROJECTILES.splice(i,1); continue; }
  }
}

// ─── AI PRE-DODGE ──────────────────────────────────────────────────────────
// Gives bots a chance to dodge projectiles BEFORE they get close
// (PROJECTILE_PREDODGE_CHANCE). Unlike regular dodge, this happens early,
// before the projectile reaches the bot, and it's a proactive sidestep.
// This makes bots much harder to hit at range, while regular dodge
// (PROJECTILE_DODGE_CHANCE) is a last-second evasion.
function updateProjectileDodgeAI(){
  if(!dummyOn || PROJECTILES.length === 0) return;
  for(const w of PROJECTILES){
    if(!w.owner) continue;
    const spd = Math.hypot(w.vx, w.vy);
    if(spd < 0.1) continue;
    const dirX = w.vx/spd, dirY = w.vy/spd;
    for(const bot of ALL_BOTS){
      if(!bot || bot.hp <= 0 || bot._awaitingReveal || bot === w.owner) continue;
      if(bot._aiState && bot._aiState.enabled === false) continue; // Mannequin (T) — not controlled by AI
      if(!w._preDodgeRolled) w._preDodgeRolled = new Set();
      if(w._preDodgeRolled.has(bot)) continue;

      const bc = $.POS.body(bot);
      const toBotX = bc.x - w.x, toBotY = bc.y - w.y;
      const along = toBotX*dirX + toBotY*dirY; // Distance along projectile trajectory to bot
      if(along <= 0 || along > 260) continue;   // Projectile already passed or too far
      const perp = Math.abs(toBotX*(-dirY) + toBotY*dirX); // Perpendicular distance "off course" from bot
      if(perp > 46) continue; // Too far off course — won't hit

      w._preDodgeRolled.add(bot);
      if(Math.random() < PROJECTILE_PREDODGE_CHANCE){
        const dodgeDir = Math.random() < 0.5 ? -1 : 1;
        bot._dvx = (bot._dvx||0) + (-dirY)*dodgeDir*7;
        bot._dvy = (bot._dvy||0) + (dirX)*dodgeDir*7;
        $.FX.hit({x:bc.x, y:bc.y-24, t:(window.I18N ? window.I18N.t('ranged.botDodge') : 'DODGE!'), life:26, big:false, col:'#8fd6ff'});
      }
    }
  }
}

function drawProjectiles(){
  for(const w of PROJECTILES){
    if(w.kind === 'wand'){
      const r = 18; // Visual radius 2x larger (was 9)
      ctx.save();
      const grad = ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,r*2.2);
      grad.addColorStop(0,'rgba(210,150,255,0.95)');
      grad.addColorStop(0.5,'rgba(150,80,255,0.5)');
      grad.addColorStop(1,'rgba(150,80,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(w.x,w.y,r*2.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f0e0ff';
      ctx.beginPath(); ctx.arc(w.x,w.y,r*0.55,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      const fadeA = w.fade != null ? $.M.clamp(w.fade,0,1) : 1;

      // ─── TRAIL ──────────────────────────────────────────────────────
      if(!w._trail) w._trail = [];
      const last = w._trail[w._trail.length-1];
      if(!last || Math.hypot(w.x-last.x, w.y-last.y) > 1){
        w._trail.push({x:w.x, y:w.y});
        if(w._trail.length > 10) w._trail.shift();
      }
      if(w._trail.length > 1){
        ctx.save();
        for(let ti = 0; ti < w._trail.length-1; ti++){
          const t0 = w._trail[ti], t1 = w._trail[ti+1];
          const frac = (ti+1) / w._trail.length;
          ctx.globalAlpha = frac * 0.5 * fadeA;
          ctx.strokeStyle = '#ffdf9a';
          ctx.lineWidth = 3 * frac;
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(t0.x,t0.y); ctx.lineTo(t1.x,t1.y); ctx.stroke();
        }
        ctx.restore();
      }

      const url = w._arrowUrl || (w._arrowUrl = pickRandomSprite('arrow'));
      const img = url ? loadSpriteImage(url) : null;
      ctx.save();
      ctx.globalAlpha = fadeA;
      // ─── GLOW ────────────────────────────────────────────────────────
      ctx.shadowColor = 'rgba(255,215,140,0.95)';
      ctx.shadowBlur = 16;
      if(img && img.complete && img.naturalWidth > 0){
        const L = 34;
        ctx.translate(w.x,w.y);
        // Fix: arrows are drawn horizontally by default (T_Arrow_01.png is horizontal)
        // ctx.rotate(Math.PI/2);
        ctx.rotate(w.rot);
        const width = L * spriteAspectFor(img);
        ctx.drawImage(img, -L/2, -width/2, L, width);
      } else {
        // Fallback if sprite not loaded — draw simple arrow
        ctx.translate(w.x,w.y); ctx.rotate(w.rot);
        ctx.strokeStyle = '#d9c08a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(16,0); ctx.stroke();
      }
      ctx.restore();
      // Extra glow behind the arrow (independent of rot)
      const glowGrad = ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,10);
      glowGrad.addColorStop(0,'rgba(255,225,160,0.55)');
      glowGrad.addColorStop(1,'rgba(255,225,160,0)');
      ctx.save();
      ctx.globalAlpha = fadeA;
      ctx.fillStyle = glowGrad;
      ctx.beginPath(); ctx.arc(w.x,w.y,10,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
}
function updateCrossbowBotAI(dt, bot){
  const target = typeof FactionRules!=='undefined' ? FactionRules.getBotTarget(bot) : P;
  if(!target) return;
  if(target.hp <= 0) return;
  const dist = Math.hypot(target.x-bot.x, target.y-bot.y);
  const aimAngle = Math.atan2(target.y-bot.y, target.x-bot.x);
  bot.prevAngle = bot.angle;
  bot.angle = aimAngle;

  // ─── STATE MANAGEMENT ──────────────────────────────────────────────────
  const AVOID_DIST_ENTER = 5 * CELL_PX;
  const AVOID_DIST_EXIT  = 6.4 * CELL_PX;
  const MELEE_PANIC_ENTER = 110;
  const MELEE_PANIC_EXIT  = 170;

  if(bot._cbDecisionCD == null) bot._cbDecisionCD = 0;
  if(bot._cbPanicState == null) bot._cbPanicState = false;
  if(bot._cbAvoidState == null) bot._cbAvoidState = false;
  bot._cbDecisionCD -= rawDt;

  if(bot._cbPanicState){ if(dist > MELEE_PANIC_EXIT) bot._cbPanicState = false; }
  else { if(dist < MELEE_PANIC_ENTER) bot._cbPanicState = true; }
  if(bot._cbAvoidState){ if(dist > AVOID_DIST_EXIT) bot._cbAvoidState = false; }
  else { if(dist < AVOID_DIST_ENTER) bot._cbAvoidState = true; }

  if(bot._cbDecisionCD <= 0 || bot._cbPanicState){
    bot._cbDecisionCD = 0.15 + Math.random()*0.2;
    let mx=0, my=0;
    const prevMode = bot._cbLastMode;
    if(bot._cbPanicState){
      mx=-Math.cos(aimAngle); my=-Math.sin(aimAngle);
      bot._cbLastMode = 'panic';
    } else if(bot._cbAvoidState){
      mx=-Math.cos(aimAngle)*0.8; my=-Math.sin(aimAngle)*0.8;
      bot._cbLastMode = 'avoid';
    } else {
      if(prevMode !== 'wander') bot._cbWanderTarget = null;
      if(bot._cbWanderTarget == null || Math.hypot(bot._cbWanderTarget.x-bot.x, bot._cbWanderTarget.y-bot.y) < 40){
        bot._cbWanderTarget = { x: randRange(60, W-100), y: randRange(60, H-60) };
      }
      const wdx = bot._cbWanderTarget.x-bot.x, wdy = bot._cbWanderTarget.y-bot.y;
      const wl = Math.hypot(wdx,wdy) || 1;
      mx = wdx/wl; my = wdy/wl;
      bot._cbLastMode = 'wander';
    }
    // ─── WALL AVOIDANCE ──────────────────────────────────────────────
    const WALL_MARGIN = 130;
    const _bl=40, _br=W-80, _bt=40, _bb=H-40;
    const dL=bot.x-_bl, dR=_br-bot.x, dT=bot.y-_bt, dB=_bb-bot.y;
    let wallX=0, wallY=0;
    if(dL<WALL_MARGIN) wallX += (WALL_MARGIN-dL)/WALL_MARGIN;
    if(dR<WALL_MARGIN) wallX -= (WALL_MARGIN-dR)/WALL_MARGIN;
    if(dT<WALL_MARGIN) wallY += (WALL_MARGIN-dT)/WALL_MARGIN;
    if(dB<WALL_MARGIN) wallY -= (WALL_MARGIN-dB)/WALL_MARGIN;
    if(wallX||wallY){
      mx += wallX*1.3; my += wallY*1.3;
      const mLen=Math.hypot(mx,my);
      if(mLen>0.001){ mx/=mLen; my/=mLen; }
    }
    const jitter = (Math.random()-0.5) * 0.5;
    mx += -Math.sin(aimAngle)*jitter; my += Math.cos(aimAngle)*jitter;
    bot._cbMoveX = mx; bot._cbMoveY = my;
  }
  let mx = bot._cbMoveX||0, my = bot._cbMoveY||0;

  // ─── SPEED ─────────────────────────────────────────────────────────────
  const exhMult = getMod(bot, 'moveSlow', 1);
  const unbMult = hasMod(bot, 'weaponRecoil') ? 0.3 : 1;
  const speedMult = exhMult * unbMult;
  const _dShDef = shieldDef(bot);
  const _dShWeight = _dShDef ? _dShDef.weight : 0;
  const _dShWrong = _dShDef && shieldSameSideAsSword(bot);
  const _dShBaseMult = _dShDef ? (1 - 0.15 - _dShWeight*0.1) : 1.0;
  const _dShWrongMult = _dShWrong ? 0.8 : 1.0;
  const botCount = ALL_BOTS.filter(b => b.hp > 0).length;
  const botSpeedMult = Math.max(0.5, 1 - (botCount - 1) * 0.08);
  const retreatScale = bot._cbPanicState ? 1.0 : 0.85;
  const dbBlockSlow = (bot._blockSlow||0) > GameTime ? sv('blockSlowMult') : 1;
  const maxV = 6 * sv('botspd') * speedMult * retreatScale * dbBlockSlow * sv('globalspd') * botSpeedMult * _dShBaseMult * _dShWrongMult * weaponMoveSpeedMult(bot);
  
  bot.vx = $.M.lerpDT(bot.vx, mx*maxV, 0.16, dt);
  bot.vy = $.M.lerpDT(bot.vy, my*maxV, 0.16, dt);
  bot.vx = $.M.clamp(bot.vx,-15,15); bot.vy = $.M.clamp(bot.vy,-15,15);
  const step = $.M.step(dt);
  bot.x = $.M.clamp(bot.x+bot.vx*step, 40, W-80);
  bot.y = $.M.clamp(bot.y+bot.vy*step, 40, H-40);
  resolveBoxCollision(bot);

// The rest of updateCrossbowBotAI is handled by updateDummy(), so we don't
// duplicate physics here — this ensures exhausted doesn't get stuck per frame.

// ─── FIRE LOGIC (bow/crossbow) ───────────────────────────────────────────
  let ready = bot.stamina > 0 && bot.exhausted <= 0 && !(GameTime < (bot._rangedShotCD||0));

  const _wKey = weaponKeyOf(bot);

  // ─── BOW: limit hold time ────────────────────────────────────────────
  if(_wKey === 'bow'){
    if(bot._bowCharging){
      if(bot._bowHoldLimit === undefined){
        bot._bowHoldLimit = rf(1, 5) + 1; // 1..6 seconds
      }
      if(GameTime - bot._bowChargeStart >= bot._bowHoldLimit){
        ready = false; // Force release in updateRangedWeaponFire
      }
    } else {
      bot._bowHoldLimit = undefined; // Reset after release
    }
  }

  // ─── CROSSBOW: extra random delay after reload ──────────────────────
  const _prevRangedCD = bot._rangedShotCD || 0;

  updateRangedWeaponFire(bot, ready, aimAngle);

  // ─── CROSSBOW: add random delay (40% chance) ────────────────────────
  if(_wKey === 'crossbow' && bot._rangedShotCD > _prevRangedCD && Math.random() < 0.4){
    bot._rangedShotCD += rf(1, 2) + 1; // Add 1..3 seconds
  }

  updateCrossbowReloadSound(bot);
}

// ─── DECISION: SHOULD WE USE MAGIC? ──────────────────────────────────────

  if(bot._wandMode == null) bot._wandMode = 'melee';

  const CLOSE_RANGE = 90;

  if(bot._wandMode === 'ranged' && dist < CLOSE_RANGE){

  if(GameTime >= bot._wandModeUntil){

else if(dist > PREF_DIST*1.3){ mx=Math.cos(aimAngle); my=Math.sin(aimAngle); }

updateRangedWeaponFire(bot, fireHeld, aimAngle);
return true;
}

// -- ШАРИКИ ------------------------------------------------------------------
const BALLS = [];
let ballsActive = false;
let ballSpawnTimer = 0;

function spawnBall(){
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const rc0 = $.POS.root();
  if(side === 0){ x = Math.random()*W; y = -16; }
  else if(side === 1){ x = W+16; y = Math.random()*H; }
  else if(side === 2){ x = Math.random()*W; y = H+16; }
  else { x = -16; y = Math.random()*H; }
  // целимся прямо в тело игрока (не рут), небольшой разброс

  const targetY = rc0.y + P.by + (Math.random()-0.5)*30;
  const ang = Math.atan2(targetY - y, targetX - x);
  const spd = rf(4.5,3.0);
  const vx = Math.cos(ang) * spd;
  const vy = Math.sin(ang) * spd;

               initVx: vx, initVy: vy }); // запоминаем начальную скорость
}

    btn.style.borderColor = '#aa3030';
    btn.style.background = '#2a0e0e';

    btn.style.borderColor = '#5a1a1a';
    btn.style.background = '#1a0e0e';
  }
});

function updateBalls(dt){
  if(!ballsActive) return;
  const step = $.M.step(dt);
  ballSpawnTimer += dt;
  if(ballSpawnTimer > 0.9){ ballSpawnTimer = 0; spawnBall(); }

  const pivX = $.POS.root().x + P.pvX;
  const pivY = $.POS.root().y + P.pvY;
  const swLen = weaponReach(P) * sv('swlen');

  // позиция наконечника и ПРЕДЫДУЩЕГО наконечника (для sweep-коллизии)
  const tipX = pivX + Math.cos(P.angle) * swLen;
  const tipY = pivY + Math.sin(P.angle) * swLen;
  const prevTipX = pivX + Math.cos(P.angle - P.vel*0.8) * swLen;
  const prevTipY = pivY + Math.sin(P.angle - P.vel*0.8) * swLen;

  for(let i = BALLS.length-1; i >= 0; i--){
    const b = BALLS[i];

    // мягкое наведение на тело игрока (homing)
    if(b.hit === 0){
      const rc1 = $.POS.root();
      const targetX = rc1.x + P.bx, targetY = rc1.y + P.by;
      const angToPlayer = Math.atan2(targetY - b.y, targetX - b.x);
      const homingStr = 0.012;
      b.vx += Math.cos(angToPlayer) * homingStr * step;
      b.vy += Math.sin(angToPlayer) * homingStr * step;
      const spd2 = Math.hypot(b.vx, b.vy);
      const maxSpd = Math.hypot(b.initVx, b.initVy) * 1.15;
      if(spd2 > maxSpd){ b.vx = b.vx/spd2*maxSpd; b.vy = b.vy/spd2*maxSpd; }
    }

    b.x += b.vx*step; b.y += b.vy*step;
    b.life-=step;
    if(b.hit > 0) b.hit-=step;

    // -- Коллизия с мечом -------------------------------------------------
    let hit = false;
    if(b.hit === 0){
      const BLADE_W = 6;
      for(const [ax,ay,bx2,by2] of [
        [pivX, pivY, tipX, tipY],
        [pivX, pivY, prevTipX, prevTipY],
      ]){
        if(hit) break;
        const {d, nx, ny, t} = distPointToSegment(b.x, b.y, ax, ay, bx2, by2);
        if(d < b.r + BLADE_W){
          const bladeX = Math.cos(P.angle), bladeY = Math.sin(P.angle);
          const alongBlade = Math.abs(nx*bladeX + ny*bladeY);
          if(alongBlade > 0.8) continue;

          const swordSpd = Math.abs(P.vel) * 200;
          b.vx = nx*(5 + swordSpd*0.06) + bladeX*swordSpd*0.035;
          b.vy = ny*(5 + swordSpd*0.06) + bladeY*swordSpd*0.035;
          b.hit = 22;
          $.FX.hit({x: b.x, y: b.y-14, t:'вњ¦', life:28, big:false});
          
          const aikb = sv('bodyKB') * 0.5;
          if(aikb > 0){
            const rc1 = $.POS.root();
            const bodyCX1 = rc1.x + P.bx, bodyCY1 = rc1.y + P.by;
            const kbAng = Math.atan2(bodyCY1 - b.y, bodyCX1 - b.x);
            P.vx += Math.cos(kbAng) * aikb;
            P.vy += Math.sin(kbAng) * aikb;
          }
          hit = true;
        }
      }
    }

    // -- ПОПАДАНИЕ ШАРИКА В ТЕЛО ИГРОКА ----------------------------------
    {
      const rc0 = $.POS.root();
      const bodyCX = rc0.x + P.bx;
      const bodyCY = rc0.y + P.by;
      const BODY_HIT_R = 18 * sv('cscl');
      
      if(b.hit === 0){
        const d = Math.hypot(b.x - bodyCX, b.y - bodyCY);
        if(d < BODY_HIT_R + b.r && (P._ballHitCD||0) <= GameTime){
          P._ballHitCD = GameTime + 0.5;
          const dmg = Math.round(Math.hypot(b.vx, b.vy) * 4);
          
          // ================================================================
          // ?? ЕДИНЫЙ ВЫЗОВ applyDamage
          // ================================================================
          applyDamage(P, dmg, null, {
            isMagic: false,
            isExplosion: false,
            knockbackMult: 0.5,
            hitstopFrames: 4,
            shakePower: 4,
            textColor: '#ff4040',
            textSuffix: 'вљЅ',
            bloodCount: 8,
            playSound: true
          });
          
          // -- ДОПОЛНИТЕЛЬНЫЕ ЭФФЕКТЫ (специфичные для шариков) --
          const nx = (bodyCX - b.x)/(d||1), ny = (bodyCY - b.y)/(d||1);
          const kbf = sv('bodyKB') * 0.5;
          P.vx += nx * kbf; P.vy += ny * kbf;
          b.vx = nx * 3; b.vy = ny * 3 - 1;
          b.hit = 30;
          BALLS.splice(i, 1);
        }
      }
    }

    if(b.life <= 0 || b.x < -120 || b.x > W+120 || b.y < -120 || b.y > H+120){
      BALLS.splice(i, 1);
    }
  }
}

function drawBalls(){
  for(const b of BALLS){
    const alpha = Math.min(1, b.life / 60);
    ctx.save();
    ctx.globalAlpha = alpha;
    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(b.x+3, b.y+5, b.r*0.8, b.r*0.4, 0, 0, Math.PI*2); ctx.fill();
    // шар
    const g = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.1, b.x, b.y, b.r);
    if(b.hit > 0){
      g.addColorStop(0, '#fff8c0'); g.addColorStop(0.4, '#ffcc40'); g.addColorStop(1, '#cc6010');
    } else {
      g.addColorStop(0, '#e0f0ff'); g.addColorStop(0.4, '#4090d0'); g.addColorStop(1, '#0a2850');
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    // блик
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.25, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

const BOXES = [];
function initBoxes(){
  BOXES.length = 0;
  BOXES.push(
    { x: W/2+120, y: H/2-60,  w: 55, h: 55 },
    { x: W/2-180, y: H/2+80,  w: 55, h: 55 },
    { x: W/2+60,  y: H/2+130, w: 70, h: 40 },
    { x: W/2-80,  y: H/2-130, w: 40, h: 70 }
  );
}

// ─── BOX COLLISION ──────────────────────────────────────────────────────
// Push entities out of boxes and reflect velocity (partial).
function resolveBoxCollision(ent){
  if(!boxesOn) return;
  const BODY_R = 14 * sv('cscl');
  const bCX = ent.x + 5 + ent.bx;
  const bCY = ent.y - 8 + ent.by;
  for(const b of BOXES){
    const nearX = $.M.clamp(bCX, b.x, b.x + b.w);
    const nearY = $.M.clamp(bCY, b.y, b.y + b.h);
    const dx = bCX - nearX, dy = bCY - nearY;
    const dist = Math.hypot(dx, dy);
    if(dist < BODY_R && dist > 0){
      const pen = BODY_R - dist;
      const nx = dx/dist, ny = dy/dist;
      const penC = Math.min(pen, 6);
      ent.x += nx * penC; ent.y += ny * penC;
      const dot = ent.vx*nx + ent.vy*ny;
      if(dot < 0){ ent.vx -= dot*nx*1.2; ent.vy -= dot*ny*1.2; }
    }
  }
}

// ─── ENTITY COLLISION ──────────────────────────────────────────────────
// Keep living characters from occupying the same body space. This is separate
// from faction damage rules: allies collide too, but still cannot hurt each other.
function resolveEntityCollision(a, b){
  if(!a || !b || a===b || a.hp<=0 || b.hp<=0) return;
  const ca=$.POS.body(a), cb=$.POS.body(b);
  let dx=cb.x-ca.x, dy=cb.y-ca.y;
  let dist=Math.hypot(dx,dy);
  const minDist=28*sv('cscl');
  if(dist>=minDist) return;
  if(dist<0.001){ dx=1; dy=0; dist=1; }
  const nx=dx/dist, ny=dy/dist;
  const correction=Math.min((minDist-dist)*0.5,6);
  a.x-=nx*correction; a.y-=ny*correction;
  b.x+=nx*correction; b.y+=ny*correction;
  const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(relative<0){
    const impulse=-relative*0.5;
    a.vx-=nx*impulse; a.vy-=ny*impulse;
    b.vx+=nx*impulse; b.vy+=ny*impulse;
  }
}

function updateAtkPoints(ent, opponent, dt){
  const exC = $.POS.center(ent);
  const opC = $.POS.body(opponent);
  const toOp = Math.atan2(opC.y - exC.y, opC.x - exC.x);
  const movAng = Math.atan2(ent.vy, ent.vx);
  const movSpd = Math.hypot(ent.vx, ent.vy);

  // +1 if moving toward opponent
  if(movSpd > 0.5 && Math.abs($.M.angDiff(movAng, toOp)) < Math.PI/2)
    ent.atkPts += dt * 1;

  // +1 if weapon tip is close to opponent's body
  const piv = $.POS.pivot(ent);
  const tipX = piv.x + Math.cos(ent.angle) * weaponReach(ent);
  const tipY = piv.y + Math.sin(ent.angle) * weaponReach(ent);
  if(Math.hypot(tipX - opC.x, tipY - opC.y) < 30) ent.atkPts += dt * 1;

  // +1 for fast swing
  if(Math.abs(ent.vel) > sv('swthresh')) ent.atkPts += dt * 1;

  // +2 for LMB click (only for player)
  if(ent === P && mDown) ent.atkPts += dt * 2;

  // Decay
  ent.atkPts *= Math.pow(0.92, dt*60);
}

function determineAttacker(){
  P.isAttacker   = P.atkPts >= D.atkPts;
  D.isAttacker   = D.atkPts > P.atkPts;
}

// ─── BLOCK/COUNTER LOGIC ──────────────────────────────────────────────
// Safe counter window: after a successful block, the defender gets 1.5s
// to counterattack without stamina cost.
const SAFE_COUNTER_WINDOW = 1.5;
function openSafeCounterWindow(defender){
  if(defender && cb('safecounter')){
    defender._safeCounterUntil = GameTime + SAFE_COUNTER_WINDOW;
  }
}
function blockStaminaCost(attacker, ignoreLmbExemption = false, blockType = 'weapon'){
  // A successful block gives its defender 1.5 seconds to make a counterattack.
  // If that counterattack is blocked too, it costs no stamina.
  if(attacker && cb('safecounter') && (attacker._safeCounterUntil || 0) >= GameTime){
    attacker._safeCounterUntil = 0;
    return 0;
  }
  // Default cost: 2/3 of stamblock, scaled for bots.
  if(!ignoreLmbExemption && attacker === P && mDown) return 0;
  const shieldPlayerMult = blockType === 'shield' && attacker === P ? (1 / 3) : 1;
  return sv('stamblock') * (2 / 3) * (isBot(attacker) ? 1.2 : 1) * shieldPlayerMult;
}
function disbalanceComboDebug(ent, text, col = '#ffcc44'){
  if(!cb('unbcombodbg') || ent !== P) return;
  const c = $.POS.body(ent);
  spawnFloatingText(ent, text, { x:c.x, y:c.y-58, col });
}

function updateDisbalanceCombo(attacker, defender){
  const windowDuration = Math.max(0.1, sv('unbcombo') || 2);
  // swordHit() is called only for a confirmed weapon clash. Its `defender`
  // is already the fighter who blocked the current attacking weapon, so an
  // extra LMB/AI-input check here incorrectly discarded most real blocks.
  const defenderCanBlock = defender && defender.hasWeapon !== false &&
    !isRangedWeapon(defender) && weaponKeyOf(defender) !== 'flail';

  // Final step: the same fighter who made the block now lands a strong
  // weapon-on-weapon swing or an active LMB lunge against the same opponent.
  const combo = attacker && attacker._disbalanceCombo;
  const isLmbLunge =
    (attacker === P && mDown && P.lmbWasDown &&
      (GameTime - (P.lmbHoldStart || -99)) <= 0.18) ||
    (attacker === D && typeof AI !== 'undefined' &&
      ((AI._pokeDodgeActive && (GameTime - (D._pokeStartTime || -99)) <= 0.3) ||
       (AI._lungeActive && AI._lungePhase === 'lunge')));
  const isStrongSwing = Math.abs(attacker.vel) > sv('swthresh') * 2.5;
  if(combo && GameTime - combo.startedAt <= windowDuration &&
     combo.target === defender &&
     (isStrongSwing || isLmbLunge)){
    delete attacker._disbalanceCombo;
    const chance = Math.min(100, combo.blocks * 40);
    const triggered = Math.random() * 100 < chance;
    if(triggered && !isUnbalanced(defender)) applyDisbalance(defender, attacker);
    disbalanceComboDebug(attacker,
      triggered
        ? (isLmbLunge ? `LUNGE — DISBALANCE! (${chance}%)` : `SWING — DISBALANCE! (${chance}%)`)
        : `DISBALANCE FAIL (${chance}%)`,
      triggered ? '#ff8830' : '#ff4040');
    return triggered;
  }

  if(!defenderCanBlock) return false;

  // Every weapon block adds a stack and restarts the expiration timer.
  const state = defender._disbalanceCombo;
  const expired = state && GameTime - state.startedAt > windowDuration;
  const blocks = state && state.target === attacker && !expired ? state.blocks + 1 : 1;
  defender._disbalanceCombo = { target: attacker, blocks, startedAt: GameTime };
  disbalanceComboDebug(defender,
    `Block: ${blocks}x → ${Math.min(100, blocks * 30)}%`,
    '#409cff');
  return false;
}

function swordHit(entA, entB){
  const attacker = entA.isAttacker ? entA : entB;
  const defender = entA.isAttacker ? entB : entA;
  openSafeCounterWindow(defender);
  const disbalanceTriggered = updateDisbalanceCombo(attacker, defender);
  if(disbalanceTriggered) return;
  const cost = blockStaminaCost(attacker);
  drainStamina(attacker, cost);
  if(attacker.stamina <= 0 && !isExhausted(attacker)){
    applyExhaust(attacker);
    return;
  }
}

// ─── SEGMENT DISTANCE ──────────────────────────────────────────────────
function segSegDist(ax,ay,bx,by,cx,cy,dx,dy){
  const d1x=bx-ax,d1y=by-ay,d2x=dx-cx,d2y=dy-cy,d12x=ax-cx,d12y=ay-cy;
  const a=d1x*d1x+d1y*d1y, e=d2x*d2x+d2y*d2y;
  if(a<0.001&&e<0.001) return {d:Math.hypot(ax-cx,ay-cy),mx:(ax+cx)/2,my:(ay+cy)/2};
  let s,t;
  if(a<0.001){t=$.M.clamp((d2x*d12x+d2y*d12y)/e,0,1);s=0;}
  else{const c2=d1x*d12x+d1y*d12y;
    if(e<0.001){s=$.M.clamp(-c2/a,0,1);t=0;}
    else{const b2=d1x*d2x+d1y*d2y,den=a*e-b2*b2;
      s=den>0.001?$.M.clamp((b2*(d2x*d12x+d2y*d12y)-e*c2)/den,0,1):0;
      t=$.M.clamp((b2*s+(d2x*d12x+d2y*d12y))/e,0,1);
      s=$.M.clamp((-c2+b2*t)/a,0,1);t=$.M.clamp((b2*s+(d2x*d12x+d2y*d12y))/e,0,1);}}
  const px=ax+s*d1x,py=ay+s*d1y,qx=cx+t*d2x,qy=cy+t*d2y;
  return {d:Math.hypot(px-qx,py-qy),mx:(px+qx)/2,my:(py+qy)/2,px,py,qx,qy,s,t};
}

// ─── SWORD COLLISION DETECTION ──────────────────────────────────────
// Detects weapon clashes: blade + stamina + knockback + hitstop.
function checkSwordCollision(entA, entB, dt){

  // A local player may reuse a bot entity. Skip only two actual AI actors,
  // never an AI actor fighting a locally controlled player slot.
  const aIsPlayer=typeof FactionRules!=='undefined' && FactionRules.isPlayer(entA);
  const bIsPlayer=typeof FactionRules!=='undefined' && FactionRules.isPlayer(entB);
  if(isBot(entA) && isBot(entB) && !aIsPlayer && !bIsPlayer) return;
  
  // ─── IF EITHER HAS NO WEAPON ──────────────────────────────────────
  if(entA.hasWeapon === false || entB.hasWeapon === false) {
    const pivA = $.POS.pivot(entA);
    const pivB = $.POS.pivot(entB);
    const swA = weaponReach(entA) * sv('swlen');
    const swB = weaponReach(entB) * sv('swlen') * (isBot(entB)?sv('botswordscale'):1);
    const tipAx = pivA.x + Math.cos(entA.angle)*swA;
    const tipAy = pivA.y + Math.sin(entA.angle)*swA;
    const tipBx = pivB.x + Math.cos(entB.angle)*swB;
    const tipBy = pivB.y + Math.sin(entB.angle)*swB;
    
    checkBladeVsBody(entA, entB, pivA.x, pivA.y, tipAx, tipAy);
    checkBladeVsBody(entB, entA, pivB.x, pivB.y, tipBx, tipBy);
    return;
  }
  
  const pivA = $.POS.pivot(entA);
  const pivB = $.POS.pivot(entB);

  // ─── BLADE SEGMENTS ──────────────────────────────────────────────
  // spanA/spanB already include BLADEFIXSCALE (see weaponColliderSpan) — that's
  // the real blade length, not just the physical model. This avoids the old
  // problem where only the tip collided, making clashes feel inconsistent.
  const dirAx = Math.cos(entA.angle), dirAy = Math.sin(entA.angle);
  const dirBx = Math.cos(entB.angle), dirBy = Math.sin(entB.angle);
  const spanA = weaponColliderSpan(entA);
  const spanBraw = weaponColliderSpan(entB);
  const botScaleB = isBot(entB) ? sv('botswordscale') : 1;
  const spanB = { back: spanBraw.back * botScaleB, front: spanBraw.front * botScaleB };

  const frontLenA = spanA.front * sv('swlen');
  const backLenA  = spanA.back  * sv('swlen');
  const frontLenB = spanB.front * sv('swlen');
  const backLenB  = spanB.back  * sv('swlen');

  const tipAx = pivA.x + dirAx*frontLenA;
  const tipAy = pivA.y + dirAy*frontLenA;
  const tipBx = pivB.x + dirBx*frontLenB;
  const tipBy = pivB.y + dirBy*frontLenB;
  const backAx = pivA.x - dirAx*backLenA;
  const backAy = pivA.y - dirAy*backLenA;
  const backBx = pivB.x - dirBx*backLenB;
  const backBy = pivB.y - dirBy*backLenB;

  // ─── HANDRANGE ────────────────────────────────────────────────────
  // Hand-to-hand/weapon clash range: how far from pivot the hand/blade tip is.
  const handFrontLenA = Math.min(HANDRANGE, frontLenA);
  const handFrontLenB = Math.min(HANDRANGE, frontLenB);
  const handBackLenA  = Math.min(HANDRANGE, backLenA);
  const handBackLenB  = Math.min(HANDRANGE, backLenB);

  const bladeAx = pivA.x + dirAx*handFrontLenA;
  const bladeAy = pivA.y + dirAy*handFrontLenA;
  const bladeBx = pivB.x + dirBx*handFrontLenB;
  const bladeBy = pivB.y + dirBy*handFrontLenB;
  const backHandAx = pivA.x - dirAx*handBackLenA;
  const backHandAy = pivA.y - dirAy*handBackLenA;
  const backHandBx = pivB.x - dirBx*handBackLenB;
  const backHandBy = pivB.y - dirBy*handBackLenB;

  // ─── BODY HIT RANGE ──────────────────────────────────────────────
  // checkBladeVsBody uses BLADEFIXSCALE already (same as for sword-vs-sword),
  // so it's consistent with the blade collision logic.
const BODY_HIT_RATIO = 0.82; // 82% of total weapon length for body hits
const bodySwA = weaponReach(entA) * sv('swlen') * BODY_HIT_RATIO;
const bodySwB = weaponReach(entB) * sv('swlen') * (isBot(entB)?sv('botswordscale'):1) * BODY_HIT_RATIO;
  const bodyTipAx = pivA.x + dirAx*bodySwA;
  const bodyTipAy = pivA.y + dirAy*bodySwA;
  const bodyTipBx = pivB.x + dirBx*bodySwB;
  const bodyTipBy = pivB.y + dirBy*bodySwB;

  if(entA._bladeCD === undefined) entA._bladeCD = -1;

  // ─── BLADE VS BLADE (weapon clash) ──────────────────────────────
  // We test two segments: front (blade) and back (if any) for each weapon.
  const segsA = [[bladeAx,bladeAy, tipAx,tipAy]];
  if(spanA.back > 0) segsA.push([backHandAx,backHandAy, backAx,backAy]);
  const segsB = [[bladeBx,bladeBy, tipBx,tipBy]];
  if(spanB.back > 0) segsB.push([backHandBx,backHandBy, backBx,backBy]);

  if(!isWeaponDisabled(entA) && !isWeaponDisabled(entB)){
    let res = null;
    for(const sa of segsA){
      for(const sb of segsB){
        const r = segSegDist(sa[0],sa[1],sa[2],sa[3], sb[0],sb[1],sb[2],sb[3]);
        if(!res || r.d < res.d) res = r;
      }
    }
    if(res.d < BLADE_W){
    const sep = BLADE_W - res.d;
    const nx = res.px!==undefined ? (res.px-res.qx)/(res.d||1) : Math.cos(entA.angle+Math.PI/2);
    const ny = res.py!==undefined ? (res.py-res.qy)/(res.d||1) : Math.sin(entA.angle+Math.PI/2);
    const swres = sv('swres');

    const sepClamped = Math.min(sep, 8);
    // This contact is evaluated every simulation tick. Without time scaling,
    // slow motion applies the same full positional shove many more times and
    // a held blade can tow the opponent at near-normal (or higher) speed.
    const contactStep = Math.min(1, $.M.step(dt));
    entA.x += nx*sepClamped*0.5*contactStep;
    entA.y += ny*sepClamped*0.5*contactStep;
    entB.x -= nx*sepClamped*0.5*contactStep;
    entB.y -= ny*sepClamped*0.5*contactStep;

    const dotA = entA.vx*nx + entA.vy*ny;
    if(dotA > 0){ entA.vx -= dotA*nx*swres; entA.vy -= dotA*ny*swres; }
    const dotB = entB.vx*nx + entB.vy*ny;
    if(dotB < 0){ entB.vx -= dotB*nx*swres; entB.vy -= dotB*ny*swres; }

    const aikb = sv('bodyKB');
    if(aikb > 0){
      const spdA = Math.hypot(entA.vx, entA.vy);
      const spdB = Math.hypot(entB.vx, entB.vy);
      const MOVE_THRESH = 1.0;
      if(spdA > MOVE_THRESH){
        const mxA = entA.vx/spdA, myA = entA.vy/spdA;
        const proj = Math.max(0, mxA*(-nx) + myA*(-ny));
        entB.vx -= mxA * aikb * 0.4 * proj * contactStep;
        entB.vy -= myA * aikb * 0.4 * proj * contactStep;
      } else {
        entB.vx -= nx * aikb * 0.3 * contactStep;
        entB.vy -= ny * aikb * 0.3 * contactStep;
      }
      if(spdB > MOVE_THRESH){
        const mxB = entB.vx/spdB, myB = entB.vy/spdB;
        const proj = Math.max(0, mxB*nx + myB*ny);
        entA.vx -= mxB * aikb * 0.4 * proj * contactStep;
        entA.vy -= myB * aikb * 0.4 * proj * contactStep;
      } else {
        entA.vx -= nx * aikb * 0.3 * contactStep;
        entA.vy -= ny * aikb * 0.3 * contactStep;
      }
    }
    
    if(entA._bladeCD <= GameTime){
      entA._bladeCD = GameTime + 0.1;
      const strongSwing = Math.abs(entA.vel) > sv('swthresh')*2.5 || Math.abs(entB.vel) > sv('swthresh')*2.5;
      doClash(entA, entB, res, strongSwing);
      swordHit(entA, entB);
      if(strongSwing) $.S.play('clashHard'); else $.S.play('clash');
      if(typeof triggerHitstop==='function') triggerHitstop(strongSwing?3:2, strongSwing?3:1.5);
      entA._clashFrame = GameTime;
      entB._clashFrame = GameTime;
      const rageGain = 100/sv('rageper') * 0.5;
      addRage(entA, rageGain);
      addRage(entB, rageGain);
      const _otherBot = entA===P ? entB : (entB===P ? entA : null);
      if(_otherBot && isBot(_otherBot)) switchSmartBot(_otherBot);
      aiNotifyContact();
    }
    } // End of blade clash handling
  }

  // ─── BLADE VS BODY ──────────────────────────────────────────────
  checkBladeVsBody(entA, entB, pivA.x, pivA.y, bodyTipAx, bodyTipAy);
  checkBladeVsBody(entB, entA, pivB.x, pivB.y, bodyTipBx, bodyTipBy);
  
  // ─── CROWN SWITCH ──────────────────────────────────────────────────
  const _crownReady = (GameTime - _lastCrownSwitchTime) >= CROWN_SWITCH_COOLDOWN;
  if(_crownReady && isBot(entA) && entA._aiState?._isMain && entB === P){
    if(Math.random() < 0.25){
      const alive = ALL_BOTS.filter(b => b !== entA && b.hp > 0);
      if(alive.length > 0){
        const newMain = alive[Math.floor(Math.random() * alive.length)];
      }
    }
  }
  if(_crownReady && isBot(entB) && entB._aiState?._isMain && entA === P){
  }
} // End of checkSwordCollision

// ─── BLADE VS BODY ──────────────────────────────────────────────────────
// Checks if the attacker's weapon tip hits the defender's body.
function checkBladeVsBody(attacker, defender, pivX, pivY, tipX2, tipY2) {
  // Skip if opponent is already dead
  if (DEATH.pDead || DEATH.dDead) return;
  // Skip if weapon is disabled (e.g., during disarm)
  if (isWeaponDisabled(attacker)) return;
  // In PvP, the player (P) is controlled locally; the opponent (D) is the remote player.
  if (defender === P && attacker === D && typeof NET_SYNC !== 'undefined' && $.NET.active()) return;
  // Iframes: dodge impulse overrides hit
  if (defender === P && Math.hypot(P._dvx || 0, P._dvy || 0) > 200) return;
  
  const bC = $.POS.body(defender);
  const key = weaponKeyOf(attacker);
  
  // ============================================================
  // ─── SPEAR SPECIFIC HANDLING ──────────────────────────────────
  // ============================================================
  if (key === 'spear') {
    const _dirX = Math.cos(attacker.angle);
    const _dirY = Math.sin(attacker.angle);
    
    // Full reach of the spear (including blade)
    const fullReach = weaponLenFor(attacker) * effSwordScale(attacker) * sv('swlen') * (isBot(attacker) ? sv('botswordscale') : 1);
    
    // Spear damage zone is only the tip, not the whole shaft
    // This keeps it consistent with the regular blade collision
    const SPEAR_RATIO = 0.68; // ~70% of the shaft is the tip (0.7–0.85)
    
    // Tip position (only the pointed end)
    const tipX_adj = pivX + _dirX * fullReach * SPEAR_RATIO;
    const tipY_adj = pivY + _dirY * fullReach * SPEAR_RATIO;
    
    // Distance to body center (for damage)
    const distToBody = Math.hypot(bC.x - tipX_adj, bC.y - tipY_adj);
    const BODY_HIT_R = 14;
    const hitR = BODY_HIT_R * sv('cscl');
    

    
    if (distToBody >= hitR) {
    return;
    }

    // ------------------------------------------------------------
    // BOT DODGE (only for AI-controlled bots)
    // ------------------------------------------------------------
    if (defender === D && attacker === P && typeof AI !== 'undefined' && AI.enabled !== false &&
        !(typeof NET_SYNC !== 'undefined' && $.NET.active()) &&
        !(AI._botDodgeCooldown > 0) && D.stamina >= D.stamMax * 0.5) {

      const botCount = ALL_BOTS.filter(b => b.hp > 0).length;
      const scaledChancePct = Math.max(20, 100 - botCount * 10);
      const playerRageDodgeMult = (P.rageBuffEnd || 0) - GameTime > 1 ? 0.5 : 1;
      const finalChance = Math.min(sv('botdodgechance'), scaledChancePct) / 100 * playerRageDodgeMult;

      if (Math.random() < finalChance) {
        AI._botDodgeCooldown = 1.5;
        AI._dodgeLockUntil = GameTime + 0.35;
        let awayX = D.x - P.x,
            awayY = D.y - P.y;
        const canDodgeToward = Math.hypot(D.x - P.x, D.y - P.y) >= 400;
        if (canDodgeToward && Math.random() < (sv('botdodgetoward') / 100)) {
          awayX = -awayX; awayY = -awayY;
        }
        const awayLen = Math.hypot(awayX, awayY) || 1;
        D._dvx = (awayX / awayLen) * 8;
        D._dvy = (awayY / awayLen) * 8;
        D._hitCD = GameTime + 0.35;
        if (typeof spawnDust === 'function')
          for (let i = 0; i < 8; i++) spawnDust(D.x, D.y, -awayX / awayLen * 8, -awayY / awayLen * 8);
        $.FX.hit({ x: D.x, y: D.y - 30, t: (window.I18N ? window.I18N.t('common.dodge') : 'DODGE'), life: 35, big: false, col: 'rgba(200,200,200,0.6)' });
        $.S.play('dodgeSound');
        return;
      }
    }
    
    // ------------------------------------------------------------
    // SHIELD BLOCK
    // ------------------------------------------------------------
    if (typeof shieldHeld === 'function' && shieldHeld(defender)) {
      const _shSc = shieldCenter(defender, attacker === P ? mX : (typeof P !== 'undefined' ? P.x : W / 2));
      if (_shSc) {
        const _shW2 = defender._shieldW || 20,
              _shH2 = defender._shieldH || 30;
        const _shL = _shSc.x - _shW2 / 2,
              _shR = _shSc.x + _shW2 / 2;
        const _shT = _shSc.y - _shH2 / 2,
              _shB = _shSc.y + _shH2 / 2;
        if (tipX_adj >= _shL && tipX_adj <= _shR && tipY_adj >= _shT && tipY_adj <= _shB) {
          const _mx2 = (bC.x + tipX_adj) / 2,
                _my2 = (bC.y + tipY_adj) / 2;
          if ((defender._shieldAlpha || 1) > 0.4) {
            applyShieldBlockFX(_mx2, _my2, attacker, defender);
            const _bvx = (tipX_adj - bC.x),
                  _bvy = (tipY_adj - bC.y),
                  _bl = Math.hypot(_bvx, _bvy) || 1;
            attacker.vx -= _bvx / _bl * 3;
            attacker.vy -= _bvy / _bl * 3;
            
            if (weaponHasFlag(attacker, 'knockback_hammer')) {
              defender.vx -= _bvx / _bl * 18;
              defender.vy -= _bvy / _bl * 18;
              defender.unbalanced = Math.max(defender.unbalanced, 0.8);
            }
            if (weaponHasFlag(attacker, 'knockback_staff')) {
              defender.vx -= _bvx / _bl * 8;
              defender.vy -= _bvy / _bl * 8;
              defender.unbalanced = Math.max(defender.unbalanced, 0.4);
            }
            defender._hitCD = GameTime + 0.3;
            return;
          }
        }
      }
    }
    
    // ------------------------------------------------------------
    // DAMAGE APPLICATION
    // ------------------------------------------------------------
    if (defender._hitCD === undefined) defender._hitCD = -1;
    if (defender._hitCD >= GameTime) return;
    
    if (attacker.exhausted > 0) return;
    if (attacker.hasWeapon === false) return;
    
    // ------------------------------------------------------------
    // DAMAGE CALCULATION
    // ------------------------------------------------------------
    let dmg = Math.round(6 + Math.abs(attacker.vel) * 20);
    
    // ─── POKE ──────────────────────────────────────────────────────
    const _isPoke = (attacker === P && mDown && P.lmbWasDown && (GameTime - (P.lmbHoldStart || -99)) <= 0.18) ||
                    (attacker === D && typeof AI !== 'undefined' && AI._pokeDodgeActive && (GameTime - (D._pokeStartTime || -99)) <= 0.3) ||
                    (attacker === D && typeof AI !== 'undefined' && AI._lungeActive && AI._lungePhase === 'lunge');
    if (_isPoke) dmg = Math.round(dmg * 1.5);
    dmg = Math.max(20, dmg);
    
    // ─── MODIFIERS ────────────────────────────────────────────────
