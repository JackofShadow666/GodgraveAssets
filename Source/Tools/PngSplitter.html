<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PNG Splitter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.8em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.85em;
            opacity: 0.7;
            color: white;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .control-panel {
            background: rgba(30, 30, 45, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            height: fit-content;
        }

        .results-panel {
            background: rgba(30, 30, 45, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            margin-bottom: 15px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: rgba(255,255,255,0.1);
        }

        .upload-icon {
            font-size: 32px;
        }

        .preview-mini {
            margin-top: 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .preview-mini canvas {
            max-width: 100%;
            max-height: 120px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: 0.2s;
            background: repeating-conic-gradient(#404050 0% 25%, #303040 0% 50%) 50% / 20px 20px;
        }

        .preview-mini canvas:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }

        .tooltip {
            position: fixed;
            background: rgba(0,0,0,0.9);
            color: #ff6b6b;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(8px);
            border: 1px solid #ff6b6b;
            white-space: nowrap;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 5px;
        }

        .mode-buttons {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid #667eea;
            background: transparent;
            color: #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #404050;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .value-display {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }

        .file-name-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #404050;
            border-radius: 8px;
            font-size: 12px;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: #404050; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-info { background: #17a2b8; color: white; }

        .btn-small { padding: 4px 8px; font-size: 11px; }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .progress-container {
            margin: 10px 0;
            display: none;
        }

        .progress-bar {
            height: 20px;
            background: #404050;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .stats-compact {
            background: rgba(102, 126, 234, 0.15);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #ccc;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .color-picker-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            max-height: 100px;
            overflow-y: auto;
            padding: 5px;
        }

        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid #555;
            cursor: pointer;
            transition: 0.1s;
            position: relative;
            flex-shrink: 0;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }

        .color-swatch.bg-mode {
            border: 2px solid #ff6b6b;
        }

        .color-swatch .delete-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .object-card {
            background: rgba(26, 26, 46, 0.9);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 1px solid #404050;
            cursor: grab;
            transition: 0.2s;
            position: relative;
        }

        .object-card:active { cursor: grabbing; }
        .object-card.dragging { opacity: 0.5; }
        .object-card.drag-over { border-color: #667eea; transform: scale(1.02); }

        .object-card img {
            max-width: 100%;
            max-height: 80px;
            margin-bottom: 6px;
            border-radius: 6px;
            pointer-events: none;
        }

        .object-number {
            position: absolute;
            top: -8px;
            left: -8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .object-name { font-size: 11px; font-weight: 600; color: #e0e0e0; margin: 5px 0; word-break: break-all; }
        .object-size { font-size: 9px; color: #aaa; }
        .button-row { display: flex; gap: 5px; justify-content: center; margin-top: 8px; }

        .footer {
            text-align: center;
            padding: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }

        .batch-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .fullscreen-img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
            cursor: default;
        }

        .close-fullscreen {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 24px;
            cursor: pointer;
            z-index: 1001;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #667eea; border-radius: 3px; }

        @media (max-width: 800px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎨 PNG Splitter</h1>
    </div>

    <div class="main-grid">
        <div class="control-panel">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div style="font-size: 12px;">PNG файл</div>
                <input type="file" id="fileInput" accept="image/png" style="display: none;">
            </div>

            <div class="preview-mini" id="miniPreview" style="display: none;">
                <canvas id="miniCanvas" width="280" height="120"></canvas>
                <div style="font-size: 10px; color: #667eea; margin-top: 4px;" id="pipetteHint">🎨 клик для выбора цвета фона</div>
            </div>

            <div class="control-group">
                <label>🔍 режим поиска</label>
                <div class="mode-buttons">
                    <button class="mode-btn active" id="modeAlpha">🎨 прозрачность</button>
                    <button class="mode-btn" id="modeColor">🌈 по цвету фона</button>
                </div>
            </div>

            <div class="control-group" id="colorSettings" style="display: none;">
                <label>🎨 цвета фона (игнорируются)</label>
                <div class="color-picker-group" id="colorList"></div>
                <button class="btn btn-info btn-small" id="autoDetectColorsBtn" style="margin-top:6px; width:100%;">🤖 авто-определить цвета фона</button>
            </div>

            <div class="control-group" id="toleranceGroup" style="display: none;">
                <label>🎚️ допуск (отклонение)</label>
                <div class="slider-container">
                    <input type="range" id="toleranceSlider" min="0" max="100" value="20">
                    <span class="value-display" id="toleranceValue">20</span>
                </div>
            </div>

            <div class="control-group">
                <label>📏 мин. размер объекта</label>
                <div class="slider-container">
                    <input type="range" id="minSizeSlider" min="10" max="500" value="50">
                    <span class="value-display" id="minSizeValue">50 px</span>
                </div>
            </div>

            <div class="control-group">
                <label>📝 базовое имя</label>
                <input type="text" id="baseFileName" class="file-name-input" placeholder="имя_файла">
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar"><div class="progress-fill" id="progressFill">0%</div></div>
                <div class="progress-text" id="progressText" style="font-size: 10px;">готов</div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="processBtn" disabled style="flex:2">🚀 найти объекты</button>
                <button class="btn btn-secondary" id="resetBtn" style="flex:1">сброс</button>
            </div>
            <div class="button-group">
                <button class="btn btn-success" id="downloadAllBtn" disabled>💾 скачать ZIP</button>
                <button class="btn btn-warning" id="downloadSequentialBtn" disabled>📄 скачать всё (по очереди)</button>
            </div>
        </div>

        <div class="results-panel">
            <div id="statsCompact" class="stats-compact">⚡ загрузите PNG</div>
            <div class="batch-bar" id="batchBar" style="display: none;">
                <button class="btn-small btn-secondary" id="undoBtn" disabled>↩️ отменить</button>
                <button class="btn-small btn-danger" id="removeAllBtn">удалить все</button>
                <button class="btn-small btn-success" id="restoreAllBtn">восстановить все</button>
                <button class="btn-small btn-warning" id="sortByPosBtn">сортировка по позиции</button>
                <button class="btn-small btn-info" id="fillHolesBtn">🕳️ заполнить дырки</button>
                <button class="btn-small btn-info" id="trimEdgesBtn" style="background:#fd7e14;">✂️ обрезка краёв</button>
                <button class="btn-small btn-info" id="blurEdgesBtn" style="background:#20c997;">💧 размытие границ</button>
                <button class="btn-small" id="autoFilterBtn" style="background:#6f42c1; color:white;">✨ авто-фильтр</button>
            </div>
            <div id="resultsGrid" class="results-grid"></div>
        </div>
    </div>

    <div class="footer">by Jack of Shadow</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
    let originalImage = null, originalImageData = null;
    let allObjects = [];
    let removedIds = new Set();
    let dragSrcId = null;
    let bgColors = [];
    let currentFileName = "";
    let currentMode = "alpha";
    let historySnapshot = null; // {allObjects, removedIds} - для отмены последней операции

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const downloadSequentialBtn = document.getElementById('downloadSequentialBtn');
    const resetBtn = document.getElementById('resetBtn');
    const fillHolesBtn = document.getElementById('fillHolesBtn');
    const undoBtn = document.getElementById('undoBtn');
    const trimEdgesBtn = document.getElementById('trimEdgesBtn');
    const blurEdgesBtn = document.getElementById('blurEdgesBtn');
    const autoFilterBtn = document.getElementById('autoFilterBtn');
    const minSizeSlider = document.getElementById('minSizeSlider');
    const minSizeValue = document.getElementById('minSizeValue');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const resultsGrid = document.getElementById('resultsGrid');
    const statsCompact = document.getElementById('statsCompact');
    const baseFileName = document.getElementById('baseFileName');
    const toleranceSlider = document.getElementById('toleranceSlider');
    const toleranceValue = document.getElementById('toleranceValue');
    const colorList = document.getElementById('colorList');
    const autoDetectColorsBtn = document.getElementById('autoDetectColorsBtn');
    const colorSettings = document.getElementById('colorSettings');
    const toleranceGroup = document.getElementById('toleranceGroup');
    const miniCanvas = document.getElementById('miniCanvas');
    const miniPreview = document.getElementById('miniPreview');
    const batchBar = document.getElementById('batchBar');
    const removeAllBtn = document.getElementById('removeAllBtn');
    const restoreAllBtn = document.getElementById('restoreAllBtn');
    const sortByPosBtn = document.getElementById('sortByPosBtn');
    const modeAlpha = document.getElementById('modeAlpha');
    const modeColor = document.getElementById('modeColor');
    const pipetteHint = document.getElementById('pipetteHint');

    let miniCtx = miniCanvas.getContext('2d');

    function showTooltip(text, x, y, isSuccess = true) {
        const existing = document.querySelector('.tooltip');
        if (existing) existing.remove();
        
        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip';
        tooltip.textContent = text;
        tooltip.style.left = (x + 15) + 'px';
        tooltip.style.top = (y - 30) + 'px';
        tooltip.style.color = isSuccess ? '#6bff6b' : '#ff6b6b';
        tooltip.style.borderColor = isSuccess ? '#6bff6b' : '#ff6b6b';
        document.body.appendChild(tooltip);
        
        setTimeout(() => {
            if (tooltip) tooltip.remove();
        }, 2000);
    }

    toleranceSlider.oninput = () => toleranceValue.innerText = toleranceSlider.value;
    minSizeSlider.oninput = () => minSizeValue.innerText = minSizeSlider.value + ' px';
    baseFileName.oninput = () => { if (allObjects.length) displayResults(); };

    modeAlpha.onclick = () => {
        currentMode = "alpha";
        modeAlpha.classList.add('active');
        modeColor.classList.remove('active');
        colorSettings.style.display = 'none';
        toleranceGroup.style.display = 'none';
        pipetteHint.style.opacity = '0.5';
    };
    modeColor.onclick = () => {
        currentMode = "color";
        modeColor.classList.add('active');
        modeAlpha.classList.remove('active');
        colorSettings.style.display = 'block';
        toleranceGroup.style.display = 'block';
        pipetteHint.style.opacity = '1';
    };

    function renderColorSwatches() {
        colorList.innerHTML = '';
        bgColors.forEach((c, idx) => {
            const sw = document.createElement('div');
            sw.className = 'color-swatch bg-mode';
            sw.style.backgroundColor = `rgb(${c.r},${c.g},${c.b})`;
            const badge = document.createElement('div');
            badge.className = 'delete-badge';
            badge.innerHTML = '✕';
            badge.onclick = (e) => {
                e.stopPropagation();
                bgColors.splice(idx,1);
                renderColorSwatches();
            };
            sw.appendChild(badge);
            colorList.appendChild(sw);
        });
        const addBtn = document.createElement('div');
        addBtn.className = 'color-swatch';
        addBtn.style.background = '#333';
        addBtn.style.display = 'flex';
        addBtn.style.alignItems = 'center';
        addBtn.style.justifyContent = 'center';
        addBtn.innerHTML = '+';
        addBtn.onclick = () => {
            if (currentMode === "color") {
                showTooltip('🎨 кликните на миниатюру, чтобы выбрать цвет фона', window.innerWidth/2, window.innerHeight/2, false);
            } else {
                showTooltip('⚠️ сначала включите режим "по цвету фона"', window.innerWidth/2, window.innerHeight/2, false);
            }
        };
        colorList.appendChild(addBtn);
    }

    // АВТО-ОПРЕДЕЛЕНИЕ ЦВЕТОВ ФОНА
    // Алгоритм:
    // 1. Берём фиксированные "контрольные точки" по краям изображения с разных сторон
    //    (углы + середины сторон) - это даёт 5 уникальных цветов фона с разных краёв
    // 2. Дополняем кластеризацией по всему изображению (с повышенным весом краёв)
    //    для оставшихся 5 цветов - ловит градиенты/паттерны, не попавшие в точки
    // 3. Итог: до 10 цветов фона, без дублей (близкие цвета объединяются)
    function autoDetectBackgroundColors() {
        if (!originalImageData) {
            showTooltip('⚠️ сначала загрузите изображение', window.innerWidth/2, window.innerHeight/2, false);
            return;
        }

        const w = originalImageData.width;
        const h = originalImageData.height;
        const data = originalImageData.data;
        const TOTAL_COLORS = 10;
        const EDGE_POINT_COUNT = 5;
        const BIN_SIZE = 16; // размер бина квантования (0-255 -> 16 уровней)
        const MERGE_DIST = 28; // макс. евклидово расстояние для объединения

        const getPixel = (x, y) => {
            x = Math.max(0, Math.min(w - 1, Math.round(x)));
            y = Math.max(0, Math.min(h - 1, Math.round(y)));
            const idx = (y * w + x) * 4;
            return {r: data[idx], g: data[idx+1], b: data[idx+2], a: data[idx+3]};
        };

        // Шаг 1: контрольные точки с разных сторон изображения
        // (4 угла + центр верхнего края), даём небольшой отступ, чтобы не попасть
        // на сжатие/артефакты крайнего пикселя
        const M = Math.max(1, Math.round(Math.min(w, h) * 0.02)); // отступ ~2%
        const edgePoints = [
            {x: M, y: M},                 // верхний левый угол
            {x: w - 1 - M, y: M},         // верхний правый угол
            {x: M, y: h - 1 - M},         // нижний левый угол
            {x: w - 1 - M, y: h - 1 - M}, // нижний правый угол
            {x: Math.floor(w / 2), y: M}  // середина верхнего края
        ];

        const edgeColors = [];
        for (const pt of edgePoints) {
            const px = getPixel(pt.x, pt.y);
            if (px.a < 10) continue; // прозрачная точка - не подходит как цвет фона
            edgeColors.push({r: px.r, g: px.g, b: px.b});
        }

        // Шаг 2: квантование и подсчёт частот по всему изображению
        // (пиксели по периметру получают доп. вес)
        const binCounts = new Map();
        const addPixel = (r, g, b, weight) => {
            const qr = Math.round(r / BIN_SIZE) * BIN_SIZE;
            const qg = Math.round(g / BIN_SIZE) * BIN_SIZE;
            const qb = Math.round(b / BIN_SIZE) * BIN_SIZE;
            const key = qr + ',' + qg + ',' + qb;
            let entry = binCounts.get(key);
            if (!entry) {
                entry = {count: 0, rSum: 0, gSum: 0, bSum: 0};
                binCounts.set(key, entry);
            }
            entry.count += weight;
            entry.rSum += r * weight;
            entry.gSum += g * weight;
            entry.bSum += b * weight;
        };

        const EDGE_WEIGHT = 4;
        const PERIMETER = 2; // толщина "рамки" по краям изображения

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = (y * w + x) * 4;
                const a = data[idx + 3];
                if (a < 10) continue; // полностью прозрачные пиксели пропускаем
                const r = data[idx], g = data[idx+1], b = data[idx+2];
                const isEdge = (x < PERIMETER || y < PERIMETER || x >= w - PERIMETER || y >= h - PERIMETER);
                addPixel(r, g, b, isEdge ? EDGE_WEIGHT : 1);
            }
        }

        // список бинов -> кластеры со средним цветом, сортировка по частоте
        let clusters = [];
        for (const entry of binCounts.values()) {
            clusters.push({
                r: entry.rSum / entry.count,
                g: entry.gSum / entry.count,
                b: entry.bSum / entry.count,
                count: entry.count
            });
        }
        clusters.sort((a, b) => b.count - a.count);

        // объединяем близкие по тону кластеры (греедли, начиная с самых частых)
        const merged = [];
        for (const c of clusters) {
            let target = null;
            for (const m of merged) {
                const dr = c.r - m.r, dg = c.g - m.g, db = c.b - m.b;
                const dist = Math.sqrt(dr*dr + dg*dg + db*db);
                if (dist <= MERGE_DIST) { target = m; break; }
            }
            if (target) {
                const totalCount = target.count + c.count;
                target.r = (target.r * target.count + c.r * c.count) / totalCount;
                target.g = (target.g * target.count + c.g * c.count) / totalCount;
                target.b = (target.b * target.count + c.b * c.count) / totalCount;
                target.count = totalCount;
            } else {
                merged.push({r: c.r, g: c.g, b: c.b, count: c.count});
            }
        }
        merged.sort((a, b) => b.count - a.count);

        // Шаг 3: собираем итоговый список - сначала точки с краёв,
        // затем дополняем кластерами, пропуская дубли (близкие к уже выбранным)
        const result = [];
        const isDuplicate = (c) => {
            for (const r of result) {
                const dr = c.r - r.r, dg = c.g - r.g, db = c.b - r.b;
                if (Math.sqrt(dr*dr + dg*dg + db*db) <= MERGE_DIST) return true;
            }
            return false;
        };

        // сначала точки с краёв (до EDGE_POINT_COUNT, без дублей)
        for (const c of edgeColors) {
            if (result.length >= EDGE_POINT_COUNT) break;
            if (!isDuplicate(c)) result.push({r: c.r, g: c.g, b: c.b});
        }

        // затем дополняем кластерами до TOTAL_COLORS
        for (const c of merged) {
            if (result.length >= TOTAL_COLORS) break;
            const rc = {r: Math.round(c.r), g: Math.round(c.g), b: Math.round(c.b)};
            if (!isDuplicate(rc)) result.push(rc);
        }

        // если краевых точек не хватило (например, все прозрачные/дубли) -
        // дозаполняем оставшимися кластерами уже сделано выше, но на случай
        // нехватки edgeColors раньше TOTAL_COLORS - merged покрывает остаток

        if (result.length === 0) {
            showTooltip('⚠️ не удалось определить цвета фона', window.innerWidth/2, window.innerHeight/2, false);
            return;
        }

        bgColors = result.map(c => ({
            r: Math.round(c.r),
            g: Math.round(c.g),
            b: Math.round(c.b)
        }));

        renderColorSwatches();
        showTooltip(`✅ найдено ${bgColors.length} цвет(ов) фона`, window.innerWidth/2, 100, true);
    }


    miniPreview.onclick = (e) => {
        if (currentMode !== "color") {
            showTooltip('⚠️ включите режим "по цвету фона"', e.clientX, e.clientY, false);
            return;
        }
        if (!originalImageData) {
            showTooltip('⚠️ сначала загрузите изображение', e.clientX, e.clientY, false);
            return;
        }
        
        const rect = miniCanvas.getBoundingClientRect();
        const scaleX = originalImageData.width / miniCanvas.width;
        const scaleY = originalImageData.height / miniCanvas.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;
        
        if (mouseX >= 0 && mouseX < originalImageData.width && mouseY >= 0 && mouseY < originalImageData.height) {
            const idx = (Math.floor(mouseY) * originalImageData.width + Math.floor(mouseX)) * 4;
            const color = {
                r: originalImageData.data[idx],
                g: originalImageData.data[idx+1],
                b: originalImageData.data[idx+2]
            };
            bgColors.push(color);
            renderColorSwatches();
            showTooltip(`✅ добавлен цвет RGB(${color.r},${color.g},${color.b})`, e.clientX, e.clientY, true);
        }
    };

    function loadImage(file) {
        currentFileName = file.name.replace('.png', '');
        baseFileName.value = currentFileName;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                const maxW = 280, maxH = 120;
                let w = img.width, h = img.height;
                if (w > maxW) { h = h * maxW / w; w = maxW; }
                if (h > maxH) { w = w * maxH / h; h = maxH; }
                miniCanvas.width = w; miniCanvas.height = h;
                miniCtx.drawImage(img, 0, 0, w, h);
                
                const fullCanvas = document.createElement('canvas');
                fullCanvas.width = img.width; fullCanvas.height = img.height;
                const ctx = fullCanvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                originalImageData = ctx.getImageData(0,0, img.width, img.height);
                miniPreview.style.display = 'block';
                processBtn.disabled = false;
                resultsGrid.innerHTML = '';
                statsCompact.innerHTML = '✅ загружено, нажмите "найти объекты"';
                allObjects = []; removedIds.clear();
                bgColors = [];
                renderColorSwatches();
                showTooltip('✅ изображение загружено!', window.innerWidth/2, 100, true);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }

    function findObjects(imgData, minSize, bgColors, tolerance, mode) {
        const w = imgData.width, h = imgData.height;
        const data = imgData.data;
        const visited = new Uint8Array(w * h);
        const objects = [];
        
        const isBackground = (x, y) => {
            if (x < 0 || x >= w || y < 0 || y >= h) return true;
            const idx = (y * w + x) * 4;
            if (mode === "alpha") {
                return data[idx + 3] < 10;
            } else {
                const r = data[idx], g = data[idx+1], b = data[idx+2];
                for (const col of bgColors) {
                    const dr = Math.abs(r - col.r);
                    const dg = Math.abs(g - col.g);
                    const db = Math.abs(b - col.b);
                    if (dr <= tolerance && dg <= tolerance && db <= tolerance) return true;
                }
                return false;
            }
        };
        
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = y * w + x;
                if (visited[idx] === 0 && !isBackground(x, y)) {
                    const queue = [{x, y}];
                    const pixels = [];
                    visited[idx] = 1;
                    
                    let minX = w, minY = h, maxX = 0, maxY = 0;
                    
                    while (queue.length) {
                        const {x: cx, y: cy} = queue.shift();
                        pixels.push({x: cx, y: cy});
                        minX = Math.min(minX, cx);
                        minY = Math.min(minY, cy);
                        maxX = Math.max(maxX, cx);
                        maxY = Math.max(maxY, cy);
                        
                        const nx = [cx+1, cx-1, cx, cx];
                        const ny = [cy, cy, cy+1, cy-1];
                        for (let i = 0; i < 4; i++) {
                            const nx_ = nx[i], ny_ = ny[i];
                            if (nx_ >= 0 && nx_ < w && ny_ >= 0 && ny_ < h) {
                                const nidx = ny_ * w + nx_;
                                if (visited[nidx] === 0 && !isBackground(nx_, ny_)) {
                                    visited[nidx] = 1;
                                    queue.push({x: nx_, y: ny_});
                                }
                            }
                        }
                    }
                    
                    if (pixels.length >= minSize) {
                        const bounds = {x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1};
                        objects.push({pixels, bounds});
                    }
                }
            }
        }
        return objects;
    }

    function fillHolesInObject(obj, imgData, bgColors, tolerance, mode) {
        const w = imgData.width, h = imgData.height;
        const data = imgData.data;
        const bounds = obj.bounds;
        
        const isBackground = (x, y) => {
            if (x < 0 || x >= w || y < 0 || y >= h) return true;
            const idx = (y * w + x) * 4;
            if (mode === "alpha") {
                return data[idx + 3] < 10;
            } else {
                const r = data[idx], g = data[idx+1], b = data[idx+2];
                for (const col of bgColors) {
                    const dr = Math.abs(r - col.r);
                    const dg = Math.abs(g - col.g);
                    const db = Math.abs(b - col.b);
                    if (dr <= tolerance && dg <= tolerance && db <= tolerance) return true;
                }
                return false;
            }
        };
        
        const originalPixelsSet = new Set(obj.pixels.map(p => `${p.x},${p.y}`));
        const visitedHole = new Uint8Array(bounds.w * bounds.h);
        const holesToFill = [];
        
        for (let y = bounds.y; y < bounds.y + bounds.h; y++) {
            for (let x = bounds.x; x < bounds.x + bounds.w; x++) {
                const localIdx = (y - bounds.y) * bounds.w + (x - bounds.x);
                if (!originalPixelsSet.has(`${x},${y}`) && !visitedHole[localIdx] && isBackground(x, y)) {
                    const queue = [{x, y}];
                    const holeArea = [];
                    let touchesBoundary = false;
                    const tempVisited = new Uint8Array(bounds.w * bounds.h);
                    tempVisited[localIdx] = 1;
                    
                    while (queue.length) {
                        const {x: cx, y: cy} = queue.shift();
                        holeArea.push({x: cx, y: cy});
                        
                        if (cx === bounds.x || cx === bounds.x + bounds.w - 1 || 
                            cy === bounds.y || cy === bounds.y + bounds.h - 1) {
                            touchesBoundary = true;
                        }
                        
                        const neighbors = [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
                        for (const [nx, ny] of neighbors) {
                            const nLocalIdx = (ny - bounds.y) * bounds.w + (nx - bounds.x);
                            if (nx >= bounds.x && nx < bounds.x + bounds.w &&
                                ny >= bounds.y && ny < bounds.y + bounds.h &&
                                !originalPixelsSet.has(`${nx},${ny}`) && !tempVisited[nLocalIdx]) {
                                tempVisited[nLocalIdx] = 1;
                                queue.push({x: nx, y: ny});
                            }
                        }
                    }
                    
                    if (!touchesBoundary) {
                        for (const hp of holeArea) {
                            holesToFill.push(hp);
                            const lp = (hp.y - bounds.y) * bounds.w + (hp.x - bounds.x);
                            visitedHole[lp] = 1;
                        }
                    } else {
                        for (const hp of holeArea) {
                            const lp = (hp.y - bounds.y) * bounds.w + (hp.x - bounds.x);
                            visitedHole[lp] = 1;
                        }
                    }
                }
            }
        }
        
        return {
            pixels: [...obj.pixels, ...holesToFill],
            bounds: obj.bounds
        };
    }

    function trimObjectEdges(obj, trimPixels) {
        if (trimPixels === 0) return obj;
        
        const w = originalImageData.width;
        const h = originalImageData.height;
        
        let currentPixels = new Set(obj.pixels.map(p => `${p.x},${p.y}`));
        
        for (let t = 0; t < trimPixels; t++) {
            const toRemove = new Set();
            for (const pixelStr of currentPixels) {
                const [px, py] = pixelStr.split(',').map(Number);
                const neighbors = [[px+1,py],[px-1,py],[px,py+1],[px,py-1]];
                for (const [nx, ny] of neighbors) {
                    if (nx >= 0 && nx < w && ny >= 0 && ny < h && !currentPixels.has(`${nx},${ny}`)) {
                        toRemove.add(pixelStr);
                        break;
                    }
                }
            }
            for (const rem of toRemove) {
                currentPixels.delete(rem);
            }
            if (toRemove.size === 0) break;
        }
        
        const newPixels = [];
        for (const pStr of currentPixels) {
            const [x, y] = pStr.split(',').map(Number);
            newPixels.push({x, y});
        }
        
        let minX = w, minY = h, maxX = 0, maxY = 0;
        for (const p of newPixels) {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
            maxY = Math.max(maxY, p.y);
        }
        
        return {
            pixels: newPixels,
            bounds: {x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1}
        };
    }

    // ИСПРАВЛЕННОЕ РАЗМЫТИЕ - возвращает новые пиксели И pngData
    function blurObjectEdges(obj, blurRadius) {
        if (blurRadius === 0) return obj;
        
        const w = originalImageData.width;
        const h = originalImageData.height;
        const pixelSet = new Set(obj.pixels.map(p => `${p.x},${p.y}`));
        
        // Граничные пиксели объекта (имеющие соседа за пределами объекта)
        const edgePixels = [];
        for (const p of obj.pixels) {
            let hasOutsideNeighbor = false;
            const neighbors = [[p.x+1,p.y],[p.x-1,p.y],[p.x,p.y+1],[p.x,p.y-1]];
            for (const [nx, ny] of neighbors) {
                if (!(nx >= 0 && nx < w && ny >= 0 && ny < h && pixelSet.has(nx + ',' + ny))) {
                    hasOutsideNeighbor = true;
                    break;
                }
            }
            if (hasOutsideNeighbor) edgePixels.push(p);
        }
        
        // Расширенная зона наружу: BFS ТОЛЬКО от граничных пикселей по фону,
        // ограниченный blurRadius слоями (а не от всех пикселей объекта,
        // чтобы не "разрастаться" по всему холсту для больших объектов)
        const extendedSet = new Set(pixelSet);
        let frontier = edgePixels.slice();
        for (let r = 0; r < blurRadius; r++) {
            const next = [];
            for (const p of frontier) {
                const neighbors = [[p.x+1,p.y],[p.x-1,p.y],[p.x,p.y+1],[p.x,p.y-1]];
                for (const [nx, ny] of neighbors) {
                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const key = nx + ',' + ny;
                        if (!extendedSet.has(key) && !pixelSet.has(key)) {
                            extendedSet.add(key);
                            next.push({x: nx, y: ny});
                        }
                    }
                }
            }
            frontier = next;
        }
        
        // Дополнительные пиксели снаружи объекта (получат частичную альфу от размытия)
        const extraPixels = [];
        for (const key of extendedSet) {
            if (!pixelSet.has(key)) {
                const parts = key.split(',');
                extraPixels.push({x: parseInt(parts[0]), y: parseInt(parts[1])});
            }
        }
        const toProcess = edgePixels.concat(extraPixels);
        
        // Источник чтения - копия оригинала, но с принудительно прозрачным фоном
        // (важно для режима "color", где исходный фон НЕ имеет alpha=0,
        // иначе размытие будет тянуть сплошной цвет фона, а не затухание)
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w;
        tempCanvas.height = h;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(originalImage, 0, 0);
        const srcData = ctx.getImageData(0, 0, w, h);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                if (!pixelSet.has(x + ',' + y)) {
                    const idx = (y * w + x) * 4;
                    srcData.data[idx] = 0;
                    srcData.data[idx+1] = 0;
                    srcData.data[idx+2] = 0;
                    srcData.data[idx+3] = 0;
                }
            }
        }
        
        // Буфер записи - копия srcData (читаем из srcData, пишем в outData, без взаимовлияния)
        const outData = ctx.createImageData(srcData.width, srcData.height);
        outData.data.set(srcData.data);
        
        for (const p of toProcess) {
            let r = 0, g = 0, b = 0, a = 0, count = 0;
            for (let dy = -blurRadius; dy <= blurRadius; dy++) {
                for (let dx = -blurRadius; dx <= blurRadius; dx++) {
                    const nx = p.x + dx, ny = p.y + dy;
                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const idx = (ny * w + nx) * 4;
                        r += srcData.data[idx];
                        g += srcData.data[idx+1];
                        b += srcData.data[idx+2];
                        a += srcData.data[idx+3];
                        // фон в srcData уже зануляется (alpha=0, rgb=0) —
                        // именно это и даёт плавное затухание к краю
                        count++;
                    } else {
                        count++;
                    }
                }
            }
            const idx = (p.y * w + p.x) * 4;
            if (count > 0) {
                outData.data[idx] = r / count;
                outData.data[idx+1] = g / count;
                outData.data[idx+2] = b / count;
                outData.data[idx+3] = a / count;
            }
        }
        
        ctx.putImageData(outData, 0, 0);
        
        // Пересчитываем bounds и пиксели по расширенной области (где альфа стала > 0)
        let minX = w, minY = h, maxX = 0, maxY = 0;
        const newPixels = [];
        for (const key of extendedSet) {
            const parts = key.split(',');
            const x = parseInt(parts[0]), y = parseInt(parts[1]);
            const idx = (y * w + x) * 4;
            if (Math.round(outData.data[idx+3]) >= 1) {
                newPixels.push({x, y});
                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;
            }
        }
        
        let bounds;
        if (newPixels.length === 0) {
            bounds = obj.bounds;
        } else {
            bounds = {x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1};
        }
        
        // Обрезаем до новых bounds
        const cropped = ctx.getImageData(bounds.x, bounds.y, bounds.w, bounds.h);
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = bounds.w;
        finalCanvas.height = bounds.h;
        const finalCtx = finalCanvas.getContext('2d');
        finalCtx.putImageData(cropped, 0, 0);
        
        return {
            pixels: newPixels,
            bounds: bounds,
            pngData: finalCanvas.toDataURL()
        };
    }

    async function processImage() {
        if (!originalImage) return;
        if (currentMode === "color" && bgColors.length === 0) {
            showTooltip('⚠️ выберите хотя бы один цвет фона (клик на миниатюру)', window.innerWidth/2, window.innerHeight/2, false);
            return;
        }
        
        processBtn.disabled = true;
        progressContainer.style.display = 'block';
        
        const minSize = parseInt(minSizeSlider.value);
        const tolerance = parseInt(toleranceSlider.value);
        
        await updateProgress(10, "поиск объектов...");
        
        let objects = findObjects(originalImageData, minSize, bgColors, tolerance, currentMode);
        
        await updateProgress(50, "создание объектов...");
        
        allObjects = [];
        
        for (let i = 0; i < objects.length; i++) {
            const png = await extractObjectAsPNG(originalImage, objects[i]);
            allObjects.push({
                id: i,
                pngData: png,
                bounds: objects[i].bounds,
                pixelCount: objects[i].pixels.length,
                position: {x: objects[i].bounds.x, y: objects[i].bounds.y},
                rawPixels: objects[i].pixels
            });
            await updateProgress(50 + (i / objects.length) * 50, `${i+1}/${objects.length}`);
            await sleep(5);
        }
        
        removedIds.clear();
        historySnapshot = null;
        undoBtn.disabled = true;
        displayResults();
        progressContainer.style.display = 'none';
        processBtn.disabled = false;
        downloadAllBtn.disabled = allObjects.length === 0;
        downloadSequentialBtn.disabled = allObjects.length === 0;
        if (allObjects.length) batchBar.style.display = 'flex';
        else batchBar.style.display = 'none';
        
        showTooltip(`✅ найдено ${allObjects.length} объектов`, window.innerWidth/2, 100, true);
    }

    async function applyPostProcessing(operationName, processor, inputMessage, options) {
        options = options || {};
        if (allObjects.length === 0) {
            showTooltip('⚠️ сначала найдите объекты', window.innerWidth/2, window.innerHeight/2, false);
            return;
        }
        
        let value = null;
        if (options.presetValue !== undefined) {
            value = options.presetValue;
        } else if (inputMessage) {
            value = prompt(inputMessage);
            if (value === null) return;
            value = parseInt(value);
            if (isNaN(value) || value < 0) {
                showTooltip('⚠️ введите корректное число', window.innerWidth/2, window.innerHeight/2, false);
                return;
            }
        }
        
        progressContainer.style.display = 'block';
        await updateProgress(10, `${operationName}...`);
        
        // снимок текущего состояния для возможности отмены (undo)
        // при цепочке операций (авто-фильтр) снимок делается один раз снаружи
        if (!options.skipSnapshot) {
            historySnapshot = {
                allObjects: allObjects.map(o => ({...o, rawPixels: o.rawPixels ? o.rawPixels.map(p => ({...p})) : []})),
                removedIds: new Set(removedIds)
            };
            undoBtn.disabled = false;
        }
        
        const newObjects = [];
        
        for (let i = 0; i < allObjects.length; i++) {
            const obj = allObjects[i];
            
            // удалённые объекты не обрабатываем - оставляем как есть (быстрее,
            // и их id/данные не меняются, так что они останутся скрытыми)
            if (removedIds.has(obj.id)) {
                newObjects.push(obj);
                await updateProgress(10 + (i / allObjects.length) * 80, `${operationName} ${i+1}/${allObjects.length} (пропуск)`);
                continue;
            }
            
            const pixels = obj.rawPixels || [];
            let tempObj = {pixels, bounds: obj.bounds};
            
            let processed;
            if (value !== null) {
                processed = processor(tempObj, value);
            } else {
                processed = processor(tempObj);
            }
            
            const png = processed.pngData || await extractObjectAsPNG(originalImage, processed);
            
            newObjects.push({
                id: obj.id,
                pngData: png,
                bounds: processed.bounds,
                pixelCount: processed.pixels.length,
                position: {x: processed.bounds.x, y: processed.bounds.y},
                rawPixels: processed.pixels
            });
            await updateProgress(10 + (i / allObjects.length) * 80, `${operationName} ${i+1}/${allObjects.length}`);
            await sleep(5);
        }
        
        allObjects = newObjects;
        displayResults();
        if (!options.skipHideProgress) {
            progressContainer.style.display = 'none';
        }
        
        if (!options.skipTooltip) {
            const skipped = removedIds.size;
            const processedCount = allObjects.length - skipped;
            const skippedInfo = skipped > 0 ? ` | пропущено (удалено): ${skipped}` : '';
            showTooltip(`✨ ${operationName} применён | обработано: ${processedCount}${skippedInfo}`, window.innerWidth/2, 100, true);
        }
    }

    async function fillAllHoles() {
        const tolerance = parseInt(toleranceSlider.value);
        await applyPostProcessing("заполнение дырок", (obj) => {
            return fillHolesInObject(obj, originalImageData, bgColors, tolerance, currentMode);
        }, null);
    }

    async function trimEdges() {
        await applyPostProcessing("обрезка краёв", (obj, val) => {
            return trimObjectEdges(obj, val);
        }, "Введите количество пикселей для обрезки от края:");
    }

    async function blurEdges() {
        await applyPostProcessing("размытие границ", (obj, val) => {
            return blurObjectEdges(obj, val);
        }, "Введите радиус размытия границ (пикселей):");
    }

    // АВТО-ФИЛЬТР: заливка дырок -> обрезка краёв на 1px -> размытие границ на 2px
    // применяется как одна цепочка с единым снимком для отмены (undo откатывает всё сразу)
    async function autoFilter() {
        if (allObjects.length === 0) {
            showTooltip('⚠️ сначала найдите объекты', window.innerWidth/2, window.innerHeight/2, false);
            return;
        }
        
        autoFilterBtn.disabled = true;
        
        // единый снимок для undo всей цепочки
        historySnapshot = {
            allObjects: allObjects.map(o => ({...o, rawPixels: o.rawPixels ? o.rawPixels.map(p => ({...p})) : []})),
            removedIds: new Set(removedIds)
        };
        undoBtn.disabled = false;
        
        const tolerance = parseInt(toleranceSlider.value);
        
        await applyPostProcessing("заполнение дырок", (obj) => {
            return fillHolesInObject(obj, originalImageData, bgColors, tolerance, currentMode);
        }, null, {presetValue: undefined, skipSnapshot: true, skipTooltip: true, skipHideProgress: true});
        
        await applyPostProcessing("обрезка краёв", (obj, val) => {
            return trimObjectEdges(obj, val);
        }, null, {presetValue: 1, skipSnapshot: true, skipTooltip: true, skipHideProgress: true});
        
        await applyPostProcessing("размытие границ", (obj, val) => {
            return blurObjectEdges(obj, val);
        }, null, {presetValue: 2, skipSnapshot: true, skipTooltip: true, skipHideProgress: false});
        
        autoFilterBtn.disabled = false;
        
        const skipped = removedIds.size;
        const processedCount = allObjects.length - skipped;
        const skippedInfo = skipped > 0 ? ` | пропущено (удалено): ${skipped}` : '';
        showTooltip(`✨ авто-фильтр применён | обработано: ${processedCount}${skippedInfo}`, window.innerWidth/2, 100, true);
    }

    async function extractObjectAsPNG(img, obj) {
        return new Promise((resolve) => {
            setTimeout(() => {
                const b = obj.bounds;
                const canvas = document.createElement('canvas');
                canvas.width = b.w;
                canvas.height = b.h;
                const ctx = canvas.getContext('2d');
                
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = img.width;
                tempCanvas.height = img.height;
                const tctx = tempCanvas.getContext('2d');
                tctx.drawImage(img, 0, 0);
                
                const imgData = tctx.getImageData(b.x, b.y, b.w, b.h);
                const pixelSet = new Set(obj.pixels.map(p => `${p.x},${p.y}`));
                
                for (let y = 0; y < b.h; y++) {
                    for (let x = 0; x < b.w; x++) {
                        const gx = b.x + x, gy = b.y + y;
                        const idx = (y * b.w + x) * 4;
                        if (!pixelSet.has(`${gx},${gy}`)) {
                            imgData.data[idx + 3] = 0;
                        }
                    }
                }
                
                ctx.putImageData(imgData, 0, 0);
                resolve(canvas.toDataURL());
            }, 0);
        });
    }

    function viewFullscreen(imgData) {
        const modal = document.createElement('div');
        modal.className = 'fullscreen-modal';
        const img = document.createElement('img');
        img.src = imgData;
        img.className = 'fullscreen-img';
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.className = 'close-fullscreen';
        closeBtn.onclick = () => modal.remove();
        modal.appendChild(img);
        modal.appendChild(closeBtn);
        document.body.appendChild(modal);
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    }

    function sortByPosition() {
        const visible = allObjects.filter(o => !removedIds.has(o.id));
        const hidden = allObjects.filter(o => removedIds.has(o.id));
        visible.sort((a, b) => {
            if (Math.abs(a.position.y - b.position.y) > 50) return a.position.y - b.position.y;
            return a.position.x - b.position.x;
        });
        allObjects = [...visible, ...hidden];
        displayResults();
    }

    function undoLastOperation() {
        if (!historySnapshot) {
            showTooltip('⚠️ нет операций для отмены', window.innerWidth/2, window.innerHeight/2, false);
            return;
        }
        allObjects = historySnapshot.allObjects;
        removedIds = historySnapshot.removedIds;
        historySnapshot = null;
        undoBtn.disabled = true;
        displayResults();
        showTooltip('↩️ операция отменена', window.innerWidth/2, 100, true);
    }

    function displayResults() {
        resultsGrid.innerHTML = '';
        const visible = allObjects.filter(o => !removedIds.has(o.id));
        const total = allObjects.length;
        const visCount = visible.length;
        statsCompact.innerHTML = `✅ объектов: ${total} | 📏 мин.размер: ${minSizeSlider.value}px | 🎯 показано: ${visCount}/${total}`;
        
        if (!total) return;
        
        visible.forEach((obj, idx) => {
            const card = document.createElement('div');
            card.className = 'object-card';
            card.setAttribute('data-id', obj.id);
            card.draggable = true;
            const base = baseFileName.value || currentFileName || 'object';
            const num = String(idx + 1).padStart(2, '0');
            card.innerHTML = `
                <div class="object-number">${idx + 1}</div>
                <img src="${obj.pngData}">
                <div class="object-name">${base}_${num}</div>
                <div class="object-size">${obj.bounds.w}×${obj.bounds.h}</div>
                <div class="button-row">
                    <button class="btn-small btn-primary" onclick="event.stopPropagation(); downloadOne(${obj.id})">💾</button>
                    <button class="btn-small btn-danger" onclick="event.stopPropagation(); removeObj(${obj.id})">🗑️</button>
                    <button class="btn-small btn-info" onclick="event.stopPropagation(); viewFullscreen('${obj.pngData}')">🔍</button>
                </div>
            `;
            
            card.ondragstart = (e) => {
                dragSrcId = obj.id;
                e.dataTransfer.effectAllowed = 'move';
                card.classList.add('dragging');
            };
            card.ondragover = (e) => {
                e.preventDefault();
                const t = e.target.closest('.object-card');
                if (t && t.getAttribute('data-id') != dragSrcId) t.classList.add('drag-over');
            };
            card.ondragleave = (e) => {
                const t = e.target.closest('.object-card');
                if (t) t.classList.remove('drag-over');
            };
            card.ondrop = (e) => {
                e.preventDefault();
                const targetCard = e.target.closest('.object-card');
                if (targetCard && dragSrcId !== null) {
                    const targetId = parseInt(targetCard.getAttribute('data-id'));
                    const srcIdx = allObjects.findIndex(o => o.id === dragSrcId);
                    const tgtIdx = allObjects.findIndex(o => o.id === targetId);
                    if (srcIdx !== -1 && tgtIdx !== -1) {
                        const [moved] = allObjects.splice(srcIdx, 1);
                        allObjects.splice(tgtIdx, 0, moved);
                        displayResults();
                    }
                }
                document.querySelectorAll('.object-card').forEach(c => c.classList.remove('drag-over'));
                dragSrcId = null;
            };
            card.ondragend = () => {
                document.querySelectorAll('.object-card').forEach(c => c.classList.remove('dragging', 'drag-over'));
                dragSrcId = null;
            };
            resultsGrid.appendChild(card);
        });
        downloadAllBtn.disabled = visCount === 0;
        downloadSequentialBtn.disabled = visCount === 0;
    }

    function removeObj(id) { removedIds.add(id); displayResults(); }
    
    function downloadOne(id) {
        const obj = allObjects.find(o => o.id === id);
        if (!obj) return;
        const idx = allObjects.filter(o => !removedIds.has(o.id)).findIndex(o => o.id === id);
        const base = baseFileName.value || currentFileName || 'object';
        const link = document.createElement('a');
        link.download = `${base}_${String(idx + 1).padStart(2, '0')}.png`;
        link.href = obj.pngData;
        link.click();
    }
    
    async function downloadAllAsZip() {
        const visible = allObjects.filter(o => !removedIds.has(o.id));
        if (!visible.length) return;
        const zip = new JSZip();
        const base = baseFileName.value || currentFileName || 'object';
        for (let i = 0; i < visible.length; i++) {
            const obj = visible[i];
            const b64 = obj.pngData.split(',')[1];
            zip.file(`${base}_${String(i + 1).padStart(2, '0')}.png`, b64, {base64: true});
        }
        const blob = await zip.generateAsync({type: 'blob'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${base}_objects.zip`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    async function downloadSequential() {
        const visible = allObjects.filter(o => !removedIds.has(o.id));
        if (!visible.length) return;
        const base = baseFileName.value || currentFileName || 'object';
        for (let i = 0; i < visible.length; i++) {
            const obj = visible[i];
            const link = document.createElement('a');
            link.download = `${base}_${String(i + 1).padStart(2, '0')}.png`;
            link.href = obj.pngData;
            link.click();
            await new Promise(r => setTimeout(r, 300));
        }
        showTooltip(`✅ скачано ${visible.length} файлов`, window.innerWidth/2, 100, true);
    }
    
    function resetAll() {
        originalImage = null;
        originalImageData = null;
        allObjects = [];
        removedIds.clear();
        miniPreview.style.display = 'none';
        processBtn.disabled = true;
        downloadAllBtn.disabled = true;
        downloadSequentialBtn.disabled = true;
        resultsGrid.innerHTML = '';
        statsCompact.innerHTML = '⚡ загрузите PNG';
        batchBar.style.display = 'none';
        fileInput.value = '';
        bgColors = [];
        renderColorSwatches();
        historySnapshot = null;
        undoBtn.disabled = true;
    }

    function updateProgress(p, t) {
        return new Promise((resolve) => {
            progressFill.style.width = p + '%';
            progressFill.innerText = p + '%';
            progressText.innerText = t;
            resolve();
        });
    }
    
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    processBtn.onclick = processImage;
    downloadAllBtn.onclick = downloadAllAsZip;
    downloadSequentialBtn.onclick = downloadSequential;
    resetBtn.onclick = resetAll;
    fillHolesBtn.onclick = fillAllHoles;
    trimEdgesBtn.onclick = trimEdges;
    blurEdgesBtn.onclick = blurEdges;
    autoFilterBtn.onclick = autoFilter;
    removeAllBtn.onclick = () => { allObjects.forEach(o => removedIds.add(o.id)); displayResults(); };
    restoreAllBtn.onclick = () => { removedIds.clear(); displayResults(); };
    sortByPosBtn.onclick = sortByPosition;
    undoBtn.onclick = undoLastOperation;
    autoDetectColorsBtn.onclick = autoDetectBackgroundColors;
    
    window.viewFullscreen = viewFullscreen;
    renderColorSwatches();
    
    if (currentMode === "color") {
        pipetteHint.style.opacity = '1';
    } else {
        pipetteHint.style.opacity = '0.5';
    }
</script>
</body>
</html>
