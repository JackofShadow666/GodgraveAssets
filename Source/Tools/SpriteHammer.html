<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpriteHammer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f0c29;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.shell{height:100vh;display:grid;grid-template-rows:58px 1fr;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)}
.top-tabs{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(20,18,42,.96);border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:10}
.brand{font-size:18px;font-weight:800;margin-right:10px;background:linear-gradient(135deg,#667eea,#a77bea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.tab{border:1px solid #555475;background:#292842;color:#c9c8dc;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.tab:hover{border-color:#667eea;transform:translateY(-1px)}
.tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 4px 14px rgba(102,126,234,.28)}
.workspace{position:relative;min-height:0}
.app-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}
.app-frame.active{display:block}
@media(max-width:620px){.brand{display:none}.top-tabs{padding:7px;gap:6px}.tab{flex:1;padding:9px 6px}}
</style>
</head>
<body>
<div class="shell">
  <nav class="top-tabs">
    <div class="brand">⚒ SpriteHammer</div>
    <button class="tab active" data-target="hammerFrame">SpriteHammer</button>
    <button class="tab" data-target="splitterFrame">PNG Splitter</button>
  </nav>
  <main class="workspace">
    <iframe id="hammerFrame" class="app-frame active" title="SpriteHammer"></iframe>
    <iframe id="splitterFrame" class="app-frame" title="PNG Splitter"></iframe>
    <iframe id="smartFrame" class="app-frame" title="Умное разбиение"></iframe>
  </main>
</div>

let pendingSplitterPayload=null;
function notifySmartVisible(){
  const frame=document.getElementById('smartFrame');
  let frames=0;
  const tick=()=>{
    if(!frame.classList.contains('active'))return;
    if(++frames>=3){frame.contentWindow?.postMessage({type:'smart-split-visible'},'*');return;}
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function activateTab(target){
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.target===target));
  document.querySelectorAll('.app-frame').forEach(frame => frame.classList.toggle('active', frame.id===target));
  if(target==='smartFrame'){setTimeout(()=>document.getElementById('smartFrame').contentWindow?.focus(),0);notifySmartVisible();}
}
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click',()=>activateTab(btn.dataset.target));
  btn.addEventListener('dragover',e=>{if(btn.dataset.target==='hammerFrame'&&pendingSplitterPayload){e.preventDefault();btn.classList.add('active')}});
  btn.addEventListener('dragleave',()=>{if(document.getElementById('splitterFrame').classList.contains('active'))btn.classList.remove('active')});
  btn.addEventListener('drop',e=>{
    if(btn.dataset.target!=='hammerFrame')return;
    e.preventDefault();
    let payload=pendingSplitterPayload;
    try{payload=JSON.parse(e.dataTransfer.getData('application/x-png-splitter')||e.dataTransfer.getData('text/plain'))}catch{}
    if(payload?.items?.length){activateTab('hammerFrame');document.getElementById('hammerFrame').contentWindow.postMessage({type:'spritehammer-import',items:payload.items,baseName:payload.baseName},'*')}
    pendingSplitterPayload=null;
  });
});

window.addEventListener('keydown',e=>{
  const smart=document.getElementById('smartFrame');
  if(!smart.classList.contains('active'))return;
  const k=(e.key||'').toLowerCase();
  const relevant=e.code==='KeyE'||e.code==='KeyF'||k==='e'||k==='у'||k==='f'||k==='а'||e.key==='Delete'||e.key==='Backspace';
  if(!relevant||e.ctrlKey||e.metaKey||e.altKey)return;
  try{smart.contentWindow.document.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,code:e.code,bubbles:true,cancelable:true}))}catch{}
});
window.addEventListener('message',e=>{
  if(e.data?.type==='splitter-drag-start')pendingSplitterPayload=e.data.payload;
  if(e.data?.type==='splitter-drag-end')setTimeout(()=>pendingSplitterPayload=null,100);
  if(e.data?.type==='open-smart-split'&&e.data.payload?.pngData){activateTab('smartFrame');setTimeout(()=>{document.getElementById('smartFrame').contentWindow.postMessage({type:'smart-split-load',payload:e.data.payload},'*');setTimeout(notifySmartVisible,0)},0);}if(e.data?.type==='smart-split-apply'&&e.data.payload?.items?.length){document.getElementById('hammerFrame').contentWindow.postMessage({type:'spritehammer-import',items:e.data.payload.items,baseName:e.data.payload.baseName,options:{separateRows:false,sourceRowId:e.data.payload.sourceRowId}},'*');pendingSplitterPayload=null;}
});
</script>
